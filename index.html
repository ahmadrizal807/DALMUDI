        // --- CUSTOM DATE PICKER (TANGGAL HURUF — 1 HARI & MULTI-HARI) & MODERN ANALOG CLOCK PICKER ---
        openBookingDatePicker(focusTarget = 'range') {
          const curStart = AppState.bookingForm.tanggal || getTodayWibISO();
          const curEnd = AppState.bookingForm.tanggal_selesai && AppState.bookingForm.tanggal_selesai >= curStart
            ? AppState.bookingForm.tanggal_selesai
            : curStart;
          const titleMap = {
            start: 'Pilih Tanggal Berangkat (Bisa Multi-Hari)',
            end: 'Pilih Tanggal Kembali',
            range: 'Pilih Rentang Tanggal Pemakaian'
          };
          openDatePicker({
            mode: 'range',
            startIso: curStart,
            endIso: curEnd,
            minIso: getTodayWibISO(),
            initialPhase: focusTarget === 'end' ? 'end' : 'start',
            title: titleMap[focusTarget] || 'Pilih Rentang Tanggal Pemakaian',
            onSelectRange(startIso, endIso) {
              AppState.bookingForm.tanggal = startIso;
              AppState.bookingForm.tanggal_selesai = endIso >= startIso ? endIso : startIso;
              // Jika pindah ke hari ini dan jam berangkat saat ini sudah terlewat, otomatis geser ke slot terdekat
              if (isStartDateTimeInPast(AppState.bookingForm.tanggal, AppState.bookingForm.jam_mulai)) {
                const smart = getSmartDefaultBookingSchedule();
                if (smart.tanggal === AppState.bookingForm.tanggal) {
                  AppState.bookingForm.jam_mulai = smart.jam_mulai;
                  if (AppState.bookingForm.tanggal_selesai === AppState.bookingForm.tanggal && AppState.bookingForm.jam_selesai <= smart.jam_mulai) {
                    AppState.bookingForm.jam_selesai = smart.jam_selesai;
                  }
                }
              }
              renderAll();
            }
          });
        },

        setBookingDurationDays(days) {
          const d = Math.max(1, Number(days) || 1);
          const startIso = AppState.bookingForm.tanggal || getTodayWibISO();
          AppState.bookingForm.tanggal = startIso;
          AppState.bookingForm.tanggal_selesai = shiftDateISO(startIso, d - 1);
          renderAll();
        },

        openModalDatePicker(hiddenInputId, labelSpanId, title) {
          const hidden = document.getElementById(hiddenInputId);
          const currentVal = hidden ? hidden.value : getTodayWibISO();
          openDatePicker({
            mode: 'single',
            initialIso: currentVal,
            title: title || 'Pilih Tanggal',
            onSelect(iso) {
              const h = document.getElementById(hiddenInputId);
              const lbl = document.getElementById(labelSpanId);
              if (h) h.value = iso;
              if (lbl) lbl.textContent = formatTanggalIndo(iso, false);
            }
          });
        },

        setCalendarRangePhase(phase) {
          if (DatePickerState.mode !== 'range') return;
          DatePickerState.phase = phase === 'end' ? 'end' : 'start';
          const targetIso = DatePickerState.phase === 'end' ? DatePickerState.endIso : DatePickerState.startIso;
          if (/^\d{4}-\d{2}-\d{2}$/.test(targetIso || '')) {
            const [y, m] = targetIso.split('-').map(Number);
            DatePickerState.viewYear = y;
            DatePickerState.viewMonth = m - 1;
          }
          renderDatePickerModal();
        },

        applyCalendarRangeDays(days) {
          if (DatePickerState.mode !== 'range') return;
          const d = Math.max(1, Number(days) || 1);
          const base = DatePickerState.startIso || getTodayWibISO();
          DatePickerState.startIso = base;
          DatePickerState.endIso = shiftDateISO(base, d - 1);
          DatePickerState.phase = 'start';
          const [y, m] = DatePickerState.endIso.split('-').map(Number);
          DatePickerState.viewYear = y;
          DatePickerState.viewMonth = m - 1;
          renderDatePickerModal();
        },

        pickCalendarDate(iso) {
          if (DatePickerState.minIso && iso < DatePickerState.minIso) return;
          if (DatePickerState.mode === 'range') {
            if (DatePickerState.phase === 'start' || !DatePickerState.startIso) {
              DatePickerState.startIso = iso;
              DatePickerState.endIso = iso;
              DatePickerState.phase = 'end';
            } else {
              if (iso < DatePickerState.startIso) {
                DatePickerState.startIso = iso;
                DatePickerState.endIso = iso;
                DatePickerState.phase = 'end';
              } else {
                DatePickerState.endIso = iso;
                DatePickerState.phase = 'start';
              }
            }
            DatePickerState.selectedIso = iso;
            const [y, m] = iso.split('-').map(Number);
            DatePickerState.viewYear = y;
            DatePickerState.viewMonth = m - 1;
            renderDatePickerModal();
            return;
          }

          DatePickerState.selectedIso = iso;
          const [y, m] = iso.split('-').map(Number);
          DatePickerState.viewYear = y;
          DatePickerState.viewMonth = m - 1;
          renderDatePickerModal();
        },

        confirmCalendarDate() {
          if (DatePickerState.mode === 'range') {
            const cbRange = DatePickerState.onSelectRange;
            const s = DatePickerState.startIso || DatePickerState.selectedIso || getTodayWibISO();
            const e = DatePickerState.endIso && DatePickerState.endIso >= s ? DatePickerState.endIso : s;
            closePicker();
            if (typeof cbRange === 'function') cbRange(s, e);
            return;
          }
          const cb = DatePickerState.onSelect;
          const chosen = DatePickerState.selectedIso;
          closePicker();
          if (typeof cb === 'function') cb(chosen);
        },

        shiftCalendarMonth(delta) {
          const dt = new Date(DatePickerState.viewYear, DatePickerState.viewMonth + delta, 1);
          DatePickerState.viewYear = dt.getFullYear();
          DatePickerState.viewMonth = dt.getMonth();
          renderDatePickerModal();
        },

        setCalendarMonth(monthIdx) {
          DatePickerState.viewMonth = monthIdx;
          renderDatePickerModal();
        },

        setCalendarYear(yearVal) {
          DatePickerState.viewYear = yearVal;
          renderDatePickerModal();
        },

        openAnalogClockPicker,

        setAnalogClockMode(mode) {
          ClockPickerState.mode = mode;
          renderAnalogClockModal();
        },

        setAnalogMinute(m) {
          ClockPickerState.minute = Math.max(0, Math.min(59, m));
          renderAnalogClockModal();
        },

        nudgeAnalogMinute(delta) {
          ClockPickerState.minute = (ClockPickerState.minute + delta + 60) % 60;
          renderAnalogClockModal();
        },

        applyAnalogPresetTime(hhmm) {
          const [h, m] = String(hhmm).split(':').map(Number);
          ClockPickerState.hour = h;
          ClockPickerState.minute = m;
          renderAnalogClockModal();
        },

        confirmAnalogClockTime() {
          const val = `${String(ClockPickerState.hour).padStart(2, '0')}:${String(ClockPickerState.minute).padStart(2, '0')}`;
          const errMsg = getClockPickerValidationError(val);
          if (errMsg) {
            showToast('Waktu Tidak Valid', errMsg, 'warning');
            return;
          }
          const field = ClockPickerState.field;
          const customCb = ClockPickerState.onSelect;
          closePicker();
          if (typeof customCb === 'function') {
            customCb(val);
            return;
          }
          AppState.bookingForm[field] = val;
          // Jika jam berangkat digeser melewati jam kembali pada hari yang sama, otomatis geser jam kembali (+2 jam)
          if (field === 'jam_mulai') {
            const effEnd = AppState.bookingForm.tanggal_selesai || AppState.bookingForm.tanggal;
            if (effEnd <= AppState.bookingForm.tanggal && AppState.bookingForm.jam_selesai <= val) {
              const [sh, sm] = val.split(':').map(Number);
              const nextEndMin = Math.min(23 * 60 + 59, sh * 60 + sm + 120);
              const nextEndStr = `${String(Math.floor(nextEndMin / 60)).padStart(2, '0')}:${String(nextEndMin % 60).padStart(2, '0')}`;
              if (nextEndStr > val) AppState.bookingForm.jam_selesai = nextEndStr;
            }
          }
          renderAll();
        },

          const unit = document.getElementById('adm-unit').value.trim() || 'Fungsi Logistik & Pengelolaan Aset';

        selectBookingVehicle(vehicleId) {
          const bf = AppState.bookingForm;
          if (!Array.isArray(bf.vehicle_ids)) bf.vehicle_ids = bf.vehicle_id ? [bf.vehicle_id] : [];
          if (!bf.driver_assignments || typeof bf.driver_assignments !== 'object') bf.driver_assignments = {};

          const idx = bf.vehicle_ids.indexOf(vehicleId);
          if (idx > -1) {
            bf.vehicle_ids.splice(idx, 1);
            delete bf.driver_assignments[vehicleId];
          } else {
            // Batasi maksimal unit sesuai jumlah pengemudi tersedia pada slot waktu ini
            const tglSelesai = bf.tanggal_selesai && bf.tanggal_selesai >= bf.tanggal ? bf.tanggal_selesai : bf.tanggal;
            const availDriversCount = AppState.data.drivers.filter((d) =>
              getDriverAvailability(d, bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai).available
            ).length;
            if (availDriversCount > 0 && bf.vehicle_ids.length >= availDriversCount) {
              showToast('Batas Pengemudi Tersedia', `Pada jadwal ini hanya tersedia ${availDriversCount} pengemudi, sehingga maksimal ${availDriversCount} unit kendaraan dapat dipilih sekaligus.`, 'warning');
              return;
            }
            bf.vehicle_ids.push(vehicleId);
          }

          bf.vehicle_id = bf.vehicle_ids[0] || '';
          bf.driver_id = bf.vehicle_id ? (bf.driver_assignments[bf.vehicle_id] || '') : '';
          if (!bf.vehicle_ids.includes(bf.activeAssignVehicleId)) {
            bf.activeAssignVehicleId = bf.vehicle_ids[0] || '';
          }
          renderAll();
        },

          AppState.bookingForm.activeAssignVehicleId = '';

          const ids = Array.isArray(bf.vehicle_ids) && bf.vehicle_ids.length > 0 ? bf.vehicle_ids : (bf.vehicle_id ? [bf.vehicle_id] : []);

            showToast('Pilih Armada', 'Silakan pilih minimal 1 kendaraan yang tersedia terlebih dahulu.', 'warning');

          }
          bf.vehicle_ids = ids;

        setActiveAssignVehicle(vehicleId) {

        },

        selectBookingDriver(driverId) {
          const bf = AppState.bookingForm;
          if (!Array.isArray(bf.vehicle_ids) || bf.vehicle_ids.length === 0) {
            if (bf.vehicle_id) bf.vehicle_ids = [bf.vehicle_id];
          }
          if (!bf.driver_assignments || typeof bf.driver_assignments !== 'object') bf.driver_assignments = {};

          const targetVehId = bf.activeAssignVehicleId || bf.vehicle_ids[0] || bf.vehicle_id;
          if (!targetVehId) return;

          // Pastikan 1 driver tidak dipasangkan ke 2 unit berbeda pada rombongan yang sama
          const usedByOther = Object.keys(bf.driver_assignments).find(
            (vid) => vid !== targetVehId && bf.driver_assignments[vid] === driverId
          );
          if (usedByOther) {
            showToast('Driver Sudah Dipilih', 'Pengemudi ini sudah ditugaskan ke unit lain dalam pengajuan ini.', 'warning');
            return;
          }

          bf.driver_assignments[targetVehId] = driverId;
          bf.driver_id = bf.vehicle_ids[0] ? (bf.driver_assignments[bf.vehicle_ids[0]] || '') : driverId;

          // Auto-pindah ke unit berikutnya yang belum memiliki pengemudi agar praktis
          const nextUnassigned = bf.vehicle_ids.find((vid) => !bf.driver_assignments[vid]);
          if (nextUnassigned) {
            bf.activeAssignVehicleId = nextUnassigned;
          }
          renderAll();
        },

        autoAssignBookingDrivers() {
          const bf = AppState.bookingForm;
          const ids = Array.isArray(bf.vehicle_ids) ? bf.vehicle_ids : [];
          if (ids.length === 0) return;
          if (!bf.driver_assignments || typeof bf.driver_assignments !== 'object') bf.driver_assignments = {};

          const tglSelesai = bf.tanggal_selesai && bf.tanggal_selesai >= bf.tanggal ? bf.tanggal_selesai : bf.tanggal;
          const usedDrivers = new Set(Object.values(bf.driver_assignments).filter(Boolean));
          const availableDrivers = AppState.data.drivers
            .filter((d) => !usedDrivers.has(d.id) && getDriverAvailability(d, bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai).available)
            .sort((a, b) => (Number(b.rating_rata_rata) || 0) - (Number(a.rating_rata_rata) || 0));

          let assignedNow = 0;
          ids.forEach((vid) => {
            if (!bf.driver_assignments[vid] && availableDrivers.length > 0) {
              const pick = availableDrivers.shift();
              bf.driver_assignments[vid] = pick.id;
              assignedNow++;
            }
          });
          bf.driver_id = ids[0] ? (bf.driver_assignments[ids[0]] || '') : '';
          bf.activeAssignVehicleId = ids.find((vid) => !bf.driver_assignments[vid]) || ids[0];
          renderAll();
          if (assignedNow > 0) {
            showToast('Pengemudi Dipasangkan', `${assignedNow} pengemudi tersedia otomatis dipasangkan ke unit rombongan.`, 'success');
          }
        },

        submitBooking() {
          const bf = AppState.bookingForm;
          const tglSelesai = bf.tanggal_selesai && bf.tanggal_selesai >= bf.tanggal ? bf.tanggal_selesai : bf.tanggal;
          const vehIds = Array.isArray(bf.vehicle_ids) && bf.vehicle_ids.length > 0
            ? [...new Set(bf.vehicle_ids)]
            : (bf.vehicle_id ? [bf.vehicle_id] : []);

          if (vehIds.length === 0) {
            showToast('Data Belum Lengkap', 'Pilih minimal 1 armada yang tersedia.', 'warning');
            return;
          }

          if (isStartDateTimeInPast(bf.tanggal, bf.jam_mulai)) {
            showToast('Waktu Sudah Terlewat', `Saat ini sudah pukul ${getNowWibHHMM()} WIB. Peminjaman tidak dapat diajukan untuk waktu yang telah lewat.`, 'error');
            AppState.bookingForm.step = 1;
            renderAll();
            return;
          }

          if (!isBookingTimeRangeValid(bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai)) {
            showToast('Periksa Waktu Pemakaian', 'Tanggal & jam kembali harus lebih besar dari waktu berangkat.', 'warning');
            return;
          }

          // Validasi atomik seluruh pasangan (Armada + Pengemudi unik) sebelum menyimpan 1 pun
          const pairs = [];
          const chosenDriverSet = new Set();
          for (let i = 0; i < vehIds.length; i++) {
            const vid = vehIds[i];
            const veh = getVehicleById(vid);
            const did = (bf.driver_assignments && bf.driver_assignments[vid]) || (vehIds.length === 1 ? bf.driver_id : '');
            const drv = getDriverById(did);
            if (!veh || !drv) {
              showToast('Pengemudi Belum Lengkap', `Silakan pilih pengemudi untuk seluruh ${vehIds.length} kendaraan terpilih.`, 'warning');
              return;
            }
            if (chosenDriverSet.has(drv.id)) {
              showToast('Duplikasi Pengemudi', `Pengemudi ${drv.nama} tidak dapat ditugaskan ke lebih dari 1 kendaraan pada waktu bersamaan.`, 'error');
              return;
            }
            chosenDriverSet.add(drv.id);

            const vAvail = getVehicleAvailability(veh, bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai);
            const dAvail = getDriverAvailability(drv, bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai);
            if (!vAvail.available || !dAvail.available) {
              showToast('Jadwal Bentrok Terdeteksi', !vAvail.available ? `Armada ${veh.plat_nomor}: ${vAvail.reason}` : `Pengemudi ${drv.nama}: ${dAvail.reason}`, 'error');
              renderAll();
              return;
            }
            pairs.push({ veh, drv });
          }

          const isMulti = pairs.length > 1;
          const baseKeperluan = bf.keperluan.trim();
          const nowStamp = formatNowWibStamp();
          const createdBookings = [];

          pairs.forEach(({ veh, drv }, idx) => {
            const unitTag = isMulti ? `[Rombongan Unit ${idx + 1}/${pairs.length}]` : '';
            const keperluanText = isMulti
              ? (baseKeperluan ? `${unitTag} ${baseKeperluan}` : unitTag)
              : baseKeperluan;
            const newBooking = {
              id: generateId('bkg'),
              kode_booking: generateNextBookingCode(bf.tanggal),
              nama_peminjam: bf.nama_peminjam.trim(),
              peminjam_id: AppState.session && AppState.session.isAuthenticated ? String(AppState.session.email || AppState.session.nip || '').trim() : '',
              unit_kerja: bf.unit_kerja.trim(),
              tujuan: bf.tujuan.trim(),
              keperluan: keperluanText,
              tanggal: bf.tanggal,
              tanggal_selesai: tglSelesai,
              jam_mulai: bf.jam_mulai,
              jam_selesai: bf.jam_selesai,
              vehicle_id: veh.id,
              driver_id: drv.id,
              km_awal: veh.odometer_saat_ini,
              km_akhir: null,
              status: 'ACTIVE',
              rating: null,
              ulasan_tags: [],
              ulasan_catatan: '',
              waktu_mulai_aktual: '',
              waktu_selesai_aktual: '',
              created_at: nowStamp
            };
            AppState.data.bookings.unshift(newBooking);
            SyncEngine.knownBookingIds.add(newBooking.id);
            createdBookings.push(newBooking);
          });

          // Reset wizard selections ke slot jadwal mendatang yang valid
          const nextSlot = getSmartDefaultBookingSchedule();
          AppState.bookingForm.step = 1;
          AppState.bookingForm.tanggal = nextSlot.tanggal;
          AppState.bookingForm.tanggal_selesai = nextSlot.tanggal_selesai;
          AppState.bookingForm.jam_mulai = nextSlot.jam_mulai;
          AppState.bookingForm.jam_selesai = nextSlot.jam_selesai;
          AppState.bookingForm.tujuan = '';
          AppState.bookingForm.keperluan = '';
          AppState.bookingForm.selectedChip = '';
          AppState.bookingForm.vehicle_id = '';
          AppState.bookingForm.driver_id = '';
          AppState.bookingForm.vehicle_ids = [];
          AppState.bookingForm.driver_assignments = {};
          AppState.bookingForm.activeAssignVehicleId = '';

          const summaryCode = isMulti
            ? `${createdBookings.length} unit (${createdBookings[0].kode_booking}–${createdBookings[createdBookings.length - 1].kode_booking})`
            : createdBookings[0].kode_booking;
          SyncEngine.persistAndBroadcast('CREATE_BOOKING', { kode_booking: summaryCode });
          SyncEngine.postBookingsToGAS(createdBookings);

          renderAll();
          openBookingSuccessModal(isMulti ? createdBookings : createdBookings[0]);
        },

        // --- DRIVER: OPERASIONAL LAPANGAN & BBM / E-TOLL (OTOMATIS TERCATAT ATAS activeDriverId) ---
        startTrip(bookingId) {
          const activeDriver = DriverAuth.getActiveDriver();
          if (!activeDriver) {
            openDriverPinModal({ targetNav: 'tugas' });
            return;
          }
          const b = getBookingById(bookingId);
          if (!b || b.driver_id !== activeDriver.id) {
            showToast('Akses Ditolak', 'Perjalanan ini bukan jadwal milik akun pengemudi yang aktif.', 'error');
            return;
          }
          if (b.status === 'ON_TRIP' || b.status === 'COMPLETED' || b.status === 'CANCELLED') {
            renderAll();
            return;
          }
          const v = getVehicleById(b.vehicle_id);
          const d = activeDriver;

          b.status = 'ON_TRIP';
          b.km_awal = v ? v.odometer_saat_ini : (b.km_awal || 0);
          b.waktu_mulai_aktual = formatNowWibStamp();

          if (v) v.status = 'ON_TRIP';
          if (d) d.status = 'ON_DUTY';

          DriverAlertManager.dismiss();
          // Kunci epoch mutasi lokal SEBELUM render & POST agar silent poll in-flight tidak menimpa status ON_TRIP
          SyncEngine.persistAndBroadcast('START_TRIP', { booking_id: b.id, plat_nomor: v?.plat_nomor || '' });
          renderAll();
          showToast('Perjalanan Dimulai', `${v ? v.plat_nomor : 'Armada'} berstatus Sedang Dinas oleh ${activeDriver.nama} sejak ${b.waktu_mulai_aktual}.`, 'success');

          SyncEngine.postToGAS('START_TRIP', {
            booking_id: b.id,
            vehicle_id: b.vehicle_id,
            driver_id: activeDriver.id,
            km_awal: b.km_awal,
            waktu_mulai_aktual: b.waktu_mulai_aktual
          });
        },

        confirmCompleteTrip(e, bookingId) {
          e.preventDefault();
          const activeDriver = DriverAuth.getActiveDriver();
          if (!activeDriver) {
            closeModal();
            openDriverPinModal({ targetNav: 'tugas' });
            return;
          }
          const b = getBookingById(bookingId);
          if (!b || b.driver_id !== activeDriver.id) {
            showToast('Akses Ditolak', 'Perjalanan ini bukan jadwal milik akun pengemudi yang aktif.', 'error');
            return;
          }
          if (b.status === 'COMPLETED' || b.status === 'CANCELLED') {
            closeModal();
            renderAll();
            return;
          }
          const v = getVehicleById(b.vehicle_id);
          const d = activeDriver;

          const kmAkhir = Number(document.getElementById('complete-km-akhir').value);
          const kmAwal = Number(b.km_awal || (v ? v.odometer_saat_ini : 0));

          if (isNaN(kmAkhir) || kmAkhir < kmAwal) {
            showToast('Odometer Tidak Valid', 'Odometer akhir harus lebih besar atau sama dengan KM awal.', 'error');
            return;
          }

          b.status = 'COMPLETED';
          b.km_akhir = kmAkhir;
          b.waktu_selesai_aktual = formatNowWibStamp();

          let triggeredServiceAlert = false;
          if (v) {
            v.odometer_saat_ini = Math.max(v.odometer_saat_ini, kmAkhir);
            triggeredServiceAlert = getVehicleServiceHealth(v).needsService;
          }

          if (d) {
            d.total_trip = (Number(d.total_trip) || 0) + 1;
          }

          // Rekonsiliasi status kendaraan & driver secara atomik dari Booking_Kendaraan
          reconcileFleetAndDriverStatuses([b.vehicle_id], [b.driver_id]);

          SyncEngine.persistAndBroadcast('COMPLETE_TRIP', { booking_id: b.id, kode_booking: b.kode_booking });
          SyncEngine.postToGAS('COMPLETE_TRIP', {
            booking_id: b.id,
            vehicle_id: b.vehicle_id,
            driver_id: activeDriver.id,
            km_akhir: kmAkhir,
            total_trip: d ? d.total_trip : undefined,
            waktu_selesai_aktual: b.waktu_selesai_aktual
          });

          closeModal();
          renderAll();

          showToast(
            'Perjalanan Selesai',
            `Diselesaikan oleh ${activeDriver.nama}. Odometer ${v ? v.plat_nomor : ''} diperbarui ke ${formatKM(kmAkhir)}.${triggeredServiceAlert ? ' ⚠ Alert Service aktif di Dashboard Admin!' : ' Form rating kini aktif di layar Pegawai.'}`,
            triggeredServiceAlert ? 'warning' : 'success'
          );
        },

        openExpenseForBooking(bookingId) {
          const activeDriver = DriverAuth.getActiveDriver();
          if (!activeDriver) {
            openDriverPinModal({ targetNav: 'bbm_etoll' });
            return;
          }
          const b = getBookingById(bookingId);
          if (b && b.driver_id === activeDriver.id) {
            AppState.expenseForm.booking_id = b.id;
            AppState.expenseForm.vehicle_id = b.vehicle_id;
            const v = getVehicleById(b.vehicle_id);
            if (v) AppState.expenseForm.odometer_pengisian = String(v.odometer_saat_ini);
          }
          switchNav('bbm_etoll');
        },

        updateExpenseField(key, val, shouldRender) {
          AppState.expenseForm[key] = val;
          if (shouldRender) renderAll();
        },

        selectExpenseBooking(bookingId) {
          AppState.expenseForm.booking_id = bookingId;
          const b = getBookingById(bookingId);
          if (b && b.vehicle_id) {
            AppState.expenseForm.vehicle_id = b.vehicle_id;
          }
          renderAll();
        },

        async handleReceiptFileChange(inputEl) {
          const file = inputEl.files && inputEl.files[0];
          if (!file) return;
          try {
            showToast('Mengompresi Foto Struk', 'Memproses gambar di browser agar ukuran ≤ 150 KB...', 'info');
            const compressed = await compressReceiptImage(file, 150);
            AppState.expenseForm.bukti_foto_url = compressed.dataUrl;
            AppState.expenseForm.photoInfo = `Kompresi sukses: ${compressed.originalKB} KB → ${compressed.compressedKB} KB (≤ 150 KB)`;
            renderAll();
            showToast('Foto Siap', `Struk terkompresi menjadi ${compressed.compressedKB} KB.`, 'success');
          } catch (err) {
            showToast('Gagal Memproses Foto', err.message, 'error');
          }
        },

        generateDemoReceipt() {
          const ef = AppState.expenseForm;
          const v = getVehicleById(ef.vehicle_id);
          const url = createSampleReceiptDataUrl({
            type: ef.jenis_biaya,
            plate: v ? v.plat_nomor : 'H 1042 BI',
            nominal: ef.nominal || 200000,
            dateLabel: formatNowWibStamp(),
            liter: ef.liter || (ef.jenis_biaya === 'BBM' ? 16.5 : null),
            odo: ef.odometer_pengisian || (v ? v.odometer_saat_ini : 18500)
          });
          const kb = Math.max(1, Math.round(((url.split(',')[1] || '').length * 3) / 4 / 1024));
          ef.bukti_foto_url = url;
          ef.photoInfo = `Struk contoh terkompresi: ${kb} KB (≤ 150 KB)`;
          renderAll();
        },

        submitExpense() {
          const ef = AppState.expenseForm;
          const driver = DriverAuth.getActiveDriver();
          if (!driver) {
            showToast('Login Pengemudi Diperlukan', 'Silakan masuk menggunakan PIN pengemudi terlebih dahulu.', 'warning');
            openDriverPinModal({ targetNav: 'bbm_etoll' });
            return;
          }
          const veh = getVehicleById(ef.vehicle_id);

          if (!veh || !ef.nominal || Number(ef.nominal) < 1000) {
            showToast('Lengkapi Nominal Biaya', 'Masukkan nominal transaksi minimal Rp 1.000 dan pilih kendaraan.', 'warning');
            return;
          }

          const odoVal = ef.jenis_biaya === 'BBM' && ef.odometer_pengisian ? Number(ef.odometer_pengisian) : null;
          if (ef.jenis_biaya === 'BBM' && odoVal && odoVal < veh.odometer_saat_ini) {
            showToast('Periksa Odometer', `Odometer pengisian (${formatKM(odoVal)}) lebih rendah dari KM terakhir (${formatKM(veh.odometer_saat_ini)}).`, 'warning');
            return;
          }

          const validBookingId = ef.booking_id && getBookingById(ef.booking_id)?.driver_id === driver.id ? ef.booking_id : '';

          const newExp = {
            id: generateId('exp'),
            booking_id: validBookingId,
            vehicle_id: veh.id,
            driver_id: driver.id,
            tanggal_waktu: formatNowWibStamp(),
            jenis_biaya: ef.jenis_biaya,
            nominal: Number(ef.nominal),
            liter: ef.jenis_biaya === 'BBM' && ef.liter ? Number(ef.liter) : null,
            odometer_pengisian: odoVal,
            bukti_foto_url: ef.bukti_foto_url || '',
            keterangan: ef.keterangan.trim() || (ef.jenis_biaya === 'BBM' ? 'Pengisian BBM Operasional Dinas' : 'Transaksi / Top-Up E-Toll Dinas')
          };

          AppState.data.expenses.unshift(newExp);
          if (odoVal && odoVal > veh.odometer_saat_ini) {
            veh.odometer_saat_ini = odoVal;
          }

          // Reset sebagian form
          ef.nominal = 200000;
          ef.liter = '';
          ef.odometer_pengisian = '';
          ef.keterangan = '';
          ef.bukti_foto_url = '';
          ef.photoInfo = '';

          SyncEngine.persistAndBroadcast('ADD_EXPENSE', { jenis_biaya: newExp.jenis_biaya, nominal: newExp.nominal });
          SyncEngine.postToGAS('ADD_EXPENSE', newExp);

          renderAll();
          showToast('Transaksi Tersimpan', `${newExp.jenis_biaya} ${formatRupiah(newExp.nominal)} (${veh.plat_nomor}) dicatat atas nama ${driver.nama}.`, 'success');
        },

        toggleDriverAvailability(driverId) {
          const activeDriver = DriverAuth.getActiveDriver();
          if (!activeDriver || activeDriver.id !== driverId) {
            showToast('Akses Ditolak', 'Anda hanya dapat mengubah status kesiapan akun sendiri.', 'warning');
            return;
          }
          const d = activeDriver;
          if (!d || d.status === 'ON_DUTY') return;
          d.status = d.status === 'AVAILABLE' ? 'OFF' : 'AVAILABLE';
          SyncEngine.persistAndBroadcast('UPSERT_DRIVER', { driver_id: d.id });
          SyncEngine.postToGAS('UPSERT_DRIVER', d);
          renderAll();
          showToast('Status Diperbarui', `Status ${d.nama} diubah menjadi ${d.status}.`, 'info');
        },

        // --- RATING PENGEMUDI ---
        setRatingStars(stars) {
          RatingModalState.stars = stars;
          const row = document.getElementById('rating-stars-row');
          const cap = document.getElementById('rating-star-caption');
          const labels = {
            1: '1.0 — Sangat Perlu Perbaikan',
            2: '2.0 — Kurang Memuaskan',
            3: '3.0 — Cukup Baik',
            4: '4.0 — Sangat Baik',
            5: '5.0 — Sempurna & Sangat Memuaskan'
          };
          if (row) row.innerHTML = renderRatingStarsButtons(stars);
          if (cap) cap.textContent = labels[stars] || '';
        },

        toggleRatingTag(tag) {
          const idx = RatingModalState.tags.indexOf(tag);
          if (idx > -1) RatingModalState.tags.splice(idx, 1);
          else RatingModalState.tags.push(tag);
          const row = document.getElementById('rating-tags-row');
          if (row) row.innerHTML = renderRatingTagButtons();
        },

        submitRating() {
          const b = getBookingById(RatingModalState.bookingId);
          if (!b) return;
          if (b.rating) {
            closeModal();
            renderAll();
            return;
          }
          const drv = getDriverById(b.driver_id);
          const notesEl = document.getElementById('rating-notes');

          b.rating = RatingModalState.stars;
          b.ulasan_tags = [...RatingModalState.tags];
          b.ulasan_catatan = notesEl ? notesEl.value.trim() : '';

          if (drv) {
            // Kalkulasi ulang rating rata-rata pengemudi secara real-time (berbobot total trip)
            const prevTrips = Math.max(0, (Number(drv.total_trip) || 1) - 1);
            const updatedAvg = ((Number(drv.rating_rata_rata) * prevTrips) + Number(b.rating)) / (prevTrips + 1);
            drv.rating_rata_rata = Number(Math.min(5, Math.max(1, updatedAvg)).toFixed(2));
          }

          SyncEngine.persistAndBroadcast('SUBMIT_RATING', { booking_id: b.id, rating: b.rating });
          SyncEngine.postToGAS('SUBMIT_RATING', {
            booking_id: b.id,
            driver_id: b.driver_id,
            rating: b.rating,
            ulasan_tags: b.ulasan_tags,
            ulasan_catatan: b.ulasan_catatan,
            new_driver_rating: drv ? drv.rating_rata_rata : undefined
          });

          closeModal();
          renderAll();
          showToast('Terima Kasih atas Penilaian Anda', `Rating ★ ${b.rating}.0 untuk ${drv ? drv.nama : 'Pengemudi'} langsung memperbarui peringkat Logistik.`, 'success');
        },

        // --- ADMIN LOGISTIK: EDIT / RESCHEDULE & BATALKAN PEMINJAMAN ---
        switchAdminBookingTab(tab) {
          AdminBookingModalState.tab = tab === 'cancel' ? 'cancel' : 'reschedule';
          refreshAdminBookingModalInPlace();
        },

        updateAdminBookingDraft(key, val, shouldRefresh) {
          AdminBookingModalState[key] = val;
          if (shouldRefresh) refreshAdminBookingModalInPlace();
        },

        setAdminBookingDurationDays(days) {
          const d = Math.max(1, Number(days) || 1);
          const startIso = AdminBookingModalState.tanggal || getTodayWibISO();
          AdminBookingModalState.tanggal = startIso;
          AdminBookingModalState.tanggal_selesai = shiftDateISO(startIso, d - 1);
          refreshAdminBookingModalInPlace();
        },

        openAdminBookingDatePicker(focusTarget = 'range') {
          const b = getBookingById(AdminBookingModalState.bookingId);
          const curStart = AdminBookingModalState.tanggal || getTodayWibISO();
          const curEnd = AdminBookingModalState.tanggal_selesai && AdminBookingModalState.tanggal_selesai >= curStart
            ? AdminBookingModalState.tanggal_selesai
            : curStart;
          openDatePicker({
            mode: 'range',
            startIso: curStart,
            endIso: curEnd,
            minIso: b && b.status === 'ON_TRIP' ? '' : getTodayWibISO(),
            initialPhase: focusTarget === 'end' ? 'end' : 'start',
            title: focusTarget === 'end' ? 'Reschedule Tanggal Kembali' : 'Reschedule Tanggal Berangkat',
            onSelectRange(startIso, endIso) {
              AdminBookingModalState.tanggal = startIso;
              AdminBookingModalState.tanggal_selesai = endIso >= startIso ? endIso : startIso;
              if ((!b || b.status !== 'ON_TRIP') && isStartDateTimeInPast(AdminBookingModalState.tanggal, AdminBookingModalState.jam_mulai)) {
                const smart = getSmartDefaultBookingSchedule();
                if (smart.tanggal === AdminBookingModalState.tanggal) {
                  AdminBookingModalState.jam_mulai = smart.jam_mulai;
                  if (AdminBookingModalState.tanggal_selesai === AdminBookingModalState.tanggal && AdminBookingModalState.jam_selesai <= smart.jam_mulai) {
                    AdminBookingModalState.jam_selesai = smart.jam_selesai;
                  }
                }
              }
              refreshAdminBookingModalInPlace();
            }
          });
        },

        openAdminBookingClockPicker(fieldName) {
          const s = AdminBookingModalState;
          const b = getBookingById(s.bookingId);
          openAnalogClockPicker(fieldName, {
            initialTime: s[fieldName] || (fieldName === 'jam_mulai' ? '09:00' : '14:00'),
            title: fieldName === 'jam_mulai' ? 'Reschedule Jam Berangkat (WIB)' : 'Reschedule Jam Kembali (WIB)',
            allowPast: Boolean(b && b.status === 'ON_TRIP'),
            compareCtx: {
              startDate: s.tanggal,
              endDate: s.tanggal_selesai || s.tanggal,
              startTime: s.jam_mulai
            },
            onSelect(val) {
              AdminBookingModalState[fieldName] = val;
              refreshAdminBookingModalInPlace();
            }
          });
        },

        submitAdminBookingReschedule(e) {
          e.preventDefault();
          const s = AdminBookingModalState;
          const b = getBookingById(s.bookingId);
          if (!b || b.status === 'COMPLETED') return;

          const tglSelesai = s.tanggal_selesai && s.tanggal_selesai >= s.tanggal ? s.tanggal_selesai : s.tanggal;
          if (b.status !== 'ON_TRIP' && isStartDateTimeInPast(s.tanggal, s.jam_mulai)) {
            showToast('Waktu Sudah Terlewat', `Jadwal reschedule tidak boleh sebelum pukul ${getNowWibHHMM()} WIB hari ini.`, 'warning');
            return;
          }
          if (!isBookingTimeRangeValid(s.tanggal, tglSelesai, s.jam_mulai, s.jam_selesai)) {
            showToast('Periksa Waktu Jadwal', 'Tanggal & jam kembali harus lebih besar dari waktu berangkat (WIB).', 'warning');
            return;
          }

          const veh = getVehicleById(s.vehicle_id);
          const drv = getDriverById(s.driver_id);
          if (!veh || !drv) {
            showToast('Data Belum Lengkap', 'Pilih armada dan pengemudi yang tersedia.', 'warning');
            return;
          }

          const vAvail = getVehicleAvailability(veh, s.tanggal, tglSelesai, s.jam_mulai, s.jam_selesai, b.id);
          const dAvail = getDriverAvailability(drv, s.tanggal, tglSelesai, s.jam_mulai, s.jam_selesai, b.id);
          if (!vAvail.available || !dAvail.available) {
            showToast('Jadwal Bentrok', !vAvail.available ? `Armada ${veh.plat_nomor}: ${vAvail.reason}` : `Driver ${drv.nama}: ${dAvail.reason}`, 'error');
            refreshAdminBookingModalInPlace();
            return;
          }

          const oldVehId = b.vehicle_id;
          const oldDrvId = b.driver_id;

          b.tanggal = s.tanggal;
          b.tanggal_selesai = tglSelesai;
          b.jam_mulai = s.jam_mulai;
          b.jam_selesai = s.jam_selesai;
          b.vehicle_id = veh.id;
          b.driver_id = drv.id;
          b.tujuan = String(s.tujuan || b.tujuan).trim();
          b.keperluan = String(s.keperluan || '').trim();
          if (b.status === 'CANCELLED') {
            b.status = 'ACTIVE';
            b.alasan_batal = '';
          }

          const { vehicleUpdates, driverUpdates } = reconcileFleetAndDriverStatuses([oldVehId, veh.id], [oldDrvId, drv.id]);

          SyncEngine.persistAndBroadcast('UPDATE_BOOKING', { kode_booking: b.kode_booking, action: 'RESCHEDULE' });
          SyncEngine.postToGAS('UPDATE_BOOKING', {
            booking: b,
            vehicle_updates: vehicleUpdates,
            driver_updates: driverUpdates
          });

          closeModal();
          renderAll();
          showToast('Jadwal Diperbarui', `${b.kode_booking} berhasil di-reschedule ke ${formatTanggalRangeIndo(b.tanggal, b.tanggal_selesai, false, true)} (${b.jam_mulai}–${b.jam_selesai} WIB).`, 'success');
        },

        applyCancelReasonPreset(reason) {
          AdminBookingModalState.alasan_batal = reason;
          refreshAdminBookingModalInPlace();
        },

        confirmAdminCancelBooking(e) {
          e.preventDefault();
          const s = AdminBookingModalState;
          const b = getBookingById(s.bookingId);
          if (!b || b.status === 'COMPLETED') return;

          const reasonInput = document.getElementById('adm-bkg-cancel-reason');
          const alasan = String((reasonInput ? reasonInput.value : s.alasan_batal) || '').trim();
          if (!alasan) {
            showToast('Alasan Diperlukan', 'Mohon isi alasan pembatalan dinas.', 'warning');
            if (reasonInput) reasonInput.focus();
            return;
          }

          b.status = 'CANCELLED';
          b.alasan_batal = alasan;
          if (!b.ulasan_catatan) b.ulasan_catatan = `Dibatalkan: ${alasan}`;

          const { vehicleUpdates, driverUpdates } = reconcileFleetAndDriverStatuses([b.vehicle_id], [b.driver_id]);

          SyncEngine.persistAndBroadcast('UPDATE_BOOKING', { kode_booking: b.kode_booking, action: 'CANCEL' });
          SyncEngine.postToGAS('UPDATE_BOOKING', {
            booking: b,
            vehicle_updates: vehicleUpdates,
            driver_updates: driverUpdates
          });

          closeModal();
          renderAll();
          const v = getVehicleById(b.vehicle_id);
          const d = getDriverById(b.driver_id);
          showToast('Dinas Dibatalkan', `${b.kode_booking} dibatalkan. Slot ${v ? v.plat_nomor : 'armada'} & ${d ? d.nama : 'driver'} kini tersedia kembali.`, 'warning');
        },

        // --- ADMIN LOGISTIK: SERVICE, MASTER ARMADA, DRIVER, FILTER, SYNC ---
        updateAdminFilter(key, val) {
          AppState.adminFilters[key] = val;
          renderAll();
        },

        submitServiceRecord(e, vehicleId) {
          e.preventDefault();
          const v = getVehicleById(vehicleId);
          if (!v) return;

          const tanggal_service = document.getElementById('srv-date').value;
          const km_service = Number(document.getElementById('srv-km').value);
          const bengkel = document.getElementById('srv-bengkel').value.trim();
          const jenis_perawatan = document.getElementById('srv-desc').value.trim();
          const biaya_service = Number(document.getElementById('srv-cost').value);

          const newSrv = {
            id: generateId('srv'),
            vehicle_id: v.id,
            tanggal_service,
            km_service,
            jenis_perawatan,
            bengkel,
            biaya_service
          };

          AppState.data.services.unshift(newSrv);
          // Otomatis reset target KM service (+10.000 km) & tanggal service (+6 bulan)
          v.odometer_saat_ini = Math.max(v.odometer_saat_ini, km_service);
          v.target_km_service = km_service + 10000;
          v.tanggal_service_berikutnya = addMonthsISO(tanggal_service, 6);
          if (v.status === 'MAINTENANCE') v.status = 'READY';

          SyncEngine.persistAndBroadcast('ADD_SERVICE', { plat_nomor: v.plat_nomor });
          SyncEngine.postToGAS('ADD_SERVICE', {
            service: newSrv,
            vehicle_update: {
              id: v.id,
              odometer_saat_ini: v.odometer_saat_ini,
              target_km_service: v.target_km_service,
              tanggal_service_berikutnya: v.tanggal_service_berikutnya,
              status: v.status
            }
          });

          closeModal();
          renderAll();
          showToast('Service Tercatat', `Target service ${v.plat_nomor} direset ke ${formatKM(v.target_km_service)} (${formatTanggalIndo(v.tanggal_service_berikutnya, false)}).`, 'success');
        },

        toggleVehicleMaintenance(vehicleId) {
          const v = getVehicleById(vehicleId);
          if (!v || v.status === 'ON_TRIP') return;
          v.status = v.status === 'MAINTENANCE' ? 'READY' : 'MAINTENANCE';
          SyncEngine.persistAndBroadcast('UPSERT_VEHICLE', { id: v.id });
          SyncEngine.postToGAS('UPSERT_VEHICLE', v);
          renderAll();
          showToast('Status Armada Diperbarui', `${v.plat_nomor} kini berstatus ${v.status === 'MAINTENANCE' ? 'Bengkel / Perawatan' : 'Tersedia (Ready)'}.`, 'info');
        },

        submitVehicleForm(e, vehicleId) {
          e.preventDefault();
          const payload = {
            id: vehicleId || generateId('veh'),
            plat_nomor: document.getElementById('veh-plat').value.trim().toUpperCase(),
            masa_berlaku_plat: document.getElementById('veh-exp').value.trim() || '11·30',
            jenis_mobil: document.getElementById('veh-name').value.trim(),
            kategori: document.getElementById('veh-cat').value,
            kapasitas: Number(document.getElementById('veh-cap').value) || 7,
            odometer_saat_ini: Number(document.getElementById('veh-odo').value) || 0,
            target_km_service: Number(document.getElementById('veh-target').value) || 10000,
            tanggal_service_berikutnya: document.getElementById('veh-srvdate').value,
            status: vehicleId ? (getVehicleById(vehicleId)?.status || 'READY') : 'READY'
          };

          const existingIdx = AppState.data.vehicles.findIndex((x) => x.id === payload.id);
          if (existingIdx > -1) AppState.data.vehicles[existingIdx] = payload;
          else AppState.data.vehicles.push(payload);

          SyncEngine.persistAndBroadcast('UPSERT_VEHICLE', { id: payload.id });
          SyncEngine.postToGAS('UPSERT_VEHICLE', payload);

          closeModal();
          renderAll();
          showToast('Master Armada Disimpan', `Kendaraan ${payload.plat_nomor} berhasil disimpan.`, 'success');
        },

        submitDriverForm(e, driverId) {
          e.preventDefault();
          const existing = driverId ? getDriverById(driverId) : null;
          const pinInputEl = document.getElementById('drv-pin');
          const pinClean = String(pinInputEl ? pinInputEl.value : (existing?.pin || '')).trim().replace(/\D/g, '');
          if (!/^\d{4,6}$/.test(pinClean)) {
            showToast('PIN Tidak Valid', 'PIN pengemudi harus terdiri dari 4 sampai 6 digit angka.', 'warning');
            if (pinInputEl) pinInputEl.focus();
            return;
          }

          const payload = {
            id: driverId || generateId('drv'),
            nama: document.getElementById('drv-name').value.trim(),
            nip_pegawai: document.getElementById('drv-nip').value.trim(),
            no_hp: document.getElementById('drv-hp').value.trim(),
            status: document.getElementById('drv-status').value,
            rating_rata_rata: existing ? existing.rating_rata_rata : 5.0,
            total_trip: existing ? existing.total_trip : 0,
            pin: pinClean
          };

          const idx = AppState.data.drivers.findIndex((x) => x.id === payload.id);
          if (idx > -1) AppState.data.drivers[idx] = payload;
          else AppState.data.drivers.push(payload);

          SyncEngine.persistAndBroadcast('UPSERT_DRIVER', { id: payload.id });
          SyncEngine.postToGAS('UPSERT_DRIVER', payload);

          closeModal();
          renderAll();
          showToast('Master Pengemudi Disimpan', `Data & PIN Cockpit ${payload.nama} berhasil diperbarui.`, 'success');
        },

        saveIntegrationSettings() {
          const gasUrl = (document.getElementById('cfg-gas-url')?.value || '').trim();
          const fb = {
            apiKey: (document.getElementById('cfg-fb-apiKey')?.value || '').trim(),
            projectId: (document.getElementById('cfg-fb-projectId')?.value || '').trim(),
            authDomain: (document.getElementById('cfg-fb-authDomain')?.value || '').trim(),
            appId: (document.getElementById('cfg-fb-appId')?.value || '').trim(),
            storageBucket: SyncEngine.config?.FIREBASE_CONFIG?.storageBucket || '',
            messagingSenderId: SyncEngine.config?.FIREBASE_CONFIG?.messagingSenderId || ''
          };
          SyncEngine.saveConfig({ GOOGLE_APPS_SCRIPT_URL: gasUrl, FIREBASE_CONFIG: fb });
          showToast('Konfigurasi Tersimpan', 'Pengaturan integrasi backend telah diperbarui.', 'success');
        },

        testGas() {
          SyncEngine.testGasConnection().then(() => renderAll());
        },

        pushAllGas() {
          SyncEngine.pushAllToGAS();
        },

        pullGas() {
          SyncEngine.pullFromGAS();
        },

        resetDemoData() {
          if (!confirm('Reset seluruh data kembali ke Seed Data awal KPwBI Provinsi Jawa Tengah?')) return;
          AppState.data = buildSeedState();
          SyncEngine.persistAndBroadcast('RESET_SEED', {});
          renderAll();
          showToast('Data Direset', 'Seed data awal KPwBI Provinsi Jawa Tengah telah dipulihkan.', 'info');
        }
      };

      /* ======================================================================
       * 15. INISIALISASI APLIKASI & JAM WIB REAL-TIME
       * ====================================================================== */
      SyncEngine.init();
      renderAll();

      // Update jam WIB setiap detik tanpa re-render seluruh DOM
      setInterval(() => {
        const clockEl = document.getElementById('live-wib-clock');
        if (clockEl) clockEl.textContent = formatNowClockWIB();
      }, 1000);
    })();
  </script>
</body>
</html>
