       *    - Salin URL Web App (`https://script.google.com/macros/s/XXXX/exec`) lalu tempel
       *      ke `GOOGLE_APPS_SCRIPT_URL` di bawah ini, ATAU masukkan langsung lewat menu
       *      Admin Logistik -> Driver & Pengaturan -> Integrasi Backend.

       *    - Isi objek `FIREBASE_CONFIG` dari Firebase Console Anda.
       * 3) MODE DEFAULT (OUT-OF-THE-BOX):
       *    - Jika keduanya kosong, aplikasi otomatis berjalan 100% interaktif dengan
       *      Real-Time Local Sync Engine (`localStorage` + `BroadcastChannel API`).
       */
      const DEFAULT_INTEGRATION_CONFIG = {
        GOOGLE_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyQjFZ7CtXgKmWMwH4if052rQgm6ixKbBoUAt-ERbYWAmQ_GiwYDMk8Oh1LxwVAWweb/exec',
        FIREBASE_CONFIG: {

          storageBucket: '',
          messagingSenderId: '',
          appId: ''
        }
      };

      // Versi Aplikasi DALMUDI (Selalu dinaikkan setiap ada pembaruan fitur/perubahan)
      const APP_VERSION = 'v1.4.0';

      // PIN Default Akses Tab Admin Logistik (6 Digit — dapat diubah di menu Admin -> Driver & Sistem)
      const DEFAULT_ADMIN_PIN = '211126';

      // Akun Admin Utama (Default Fallback Offline — khusus tanpa email, tidak dapat dihapus)
      const DEFAULT_PRIMARY_ADMIN = {
        id: 'adm-primary',
        identifier: 'BI-ADM-0009',
        nama: 'Ahmad Rizal',
        unit: 'Fungsi Logistik & Pengelolaan Aset',
        isPrimary: true
      };

      const STORAGE_KEYS = {
        STATE: 'bi_fleet_jateng_state_v1',
        CONFIG: 'bi_fleet_jateng_integration_cfg_v1',
        SESSION: 'bi_fleet_jateng_session_v1',
        SYNC_LOG: 'bi_fleet_jateng_synclog_v1',
        ADMIN_LIST: 'bi_fleet_jateng_admin_list_v1',
        ADMIN_PIN_HASH: 'bi_fleet_jateng_admin_pin_hash_v1',
        ADMIN_UNLOCKED: 'bi_fleet_jateng_admin_unlocked_v1'
      };

      const BROADCAST_CHANNEL_NAME = 'bi_fleet_jateng_realtime_v1';

      /** Engine Keamanan PIN Admin Logistik (Hash tersimpan aman + Session Lock + Rate Limit) */
      const AdminAuth = {
        memoryUnlocked: false,
        failedAttempts: 0,
        lockedUntil: 0,

        hashPin(pin) {
          const salted = 'BI-FLEET-JATENG-KPWBI::' + String(pin || '') + '::SEMARANG';
          let h1 = 0xdeadbeef ^ salted.length;
          let h2 = 0x41c6ce57 ^ salted.length;
          for (let i = 0; i < salted.length; i++) {
            const ch = salted.charCodeAt(i);
            h1 = Math.imul(h1 ^ ch, 2654435761);
            h2 = Math.imul(h2 ^ ch, 1597334677);
          }
          h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
          h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
          return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
        },

        getStoredHash() {
          try {
            const custom = localStorage.getItem(STORAGE_KEYS.ADMIN_PIN_HASH);
            if (custom) return custom;
          } catch (_) {}
          return this.hashPin(DEFAULT_ADMIN_PIN);
        },

        isCustomPinSet() {
          try {
            return Boolean(localStorage.getItem(STORAGE_KEYS.ADMIN_PIN_HASH));
          } catch (_) {
            return false;
          }
        },

        ensurePrimaryAdmin(list) {
          const normalized = Array.isArray(list)
            ? list
                .filter((a) => a && String(a.identifier || '').trim())
                .map((a) => ({
                  id: String(a.id || ('adm-' + String(a.identifier).trim().toLowerCase().replace(/[^a-z0-9]/g, '_'))),
                  identifier: String(a.identifier).trim(),
                  nama: String(a.nama || 'Admin Logistik').trim(),
                  unit: String(a.unit || 'Fungsi Logistik & Pengelolaan Aset').trim(),
                  isPrimary: Boolean(a.isPrimary)
                }))
            : [];

          const primaryKey = DEFAULT_PRIMARY_ADMIN.identifier.toLowerCase();
          const hasPrimary = normalized.some((a) => a.identifier.toLowerCase() === primaryKey || a.isPrimary);
          if (!hasPrimary) {
            normalized.unshift(Object.assign({}, DEFAULT_PRIMARY_ADMIN));
          } else {
            // Sinkronkan nama Admin Utama bila masih memakai nama bawaan lama & pastikan di urutan pertama
            normalized.forEach((a) => {
              if (a.isPrimary || a.id === DEFAULT_PRIMARY_ADMIN.id || a.identifier.toLowerCase() === primaryKey) {
                a.isPrimary = true;
                if (!a.nama || /hendra kusumo/i.test(a.nama)) {
                  a.nama = DEFAULT_PRIMARY_ADMIN.nama;
                }
              }
            });
            normalized.sort((a, b) => (b.isPrimary ? 1 : 0) - (a.isPrimary ? 1 : 0));
          }
          return normalized;
        },

        loadAdminList() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.ADMIN_LIST);
            if (raw) {
              const parsed = JSON.parse(raw);
              return this.ensurePrimaryAdmin(parsed);
            }
          } catch (_) {}
          const fallback = this.ensurePrimaryAdmin([Object.assign({}, DEFAULT_PRIMARY_ADMIN)]);
          try {
            localStorage.setItem(STORAGE_KEYS.ADMIN_LIST, JSON.stringify(fallback));
          } catch (_) {}
          return fallback;
        },

        saveAdminList(list) {
          const safe = this.ensurePrimaryAdmin(list);
          AppState.adminList = safe;
          try {
            localStorage.setItem(STORAGE_KEYS.ADMIN_LIST, JSON.stringify(safe));
          } catch (_) {}
          return safe;
        },

        findAdminByIdentifier(identifier) {
          const clean = String(identifier || '').trim().toLowerCase();
          if (!clean) return null;
          const list = (typeof AppState !== 'undefined' && Array.isArray(AppState.adminList))
            ? AppState.adminList
            : this.loadAdminList();
          return list.find((a) => String(a.identifier || '').trim().toLowerCase() === clean) || null;
        },

        isAdminIdentifier(identifier) {
          return Boolean(this.findAdminByIdentifier(identifier));
        },

        isUnlocked() {
          try {
            if (typeof sessionStorage !== 'undefined' && sessionStorage.getItem(STORAGE_KEYS.ADMIN_UNLOCKED) === '1') {
              return true;
            }
          } catch (_) {}
          return this.memoryUnlocked;
        },

        unlock() {
          this.memoryUnlocked = true;
          this.failedAttempts = 0;
          this.lockedUntil = 0;
          try {
            if (typeof sessionStorage !== 'undefined') {
              sessionStorage.setItem(STORAGE_KEYS.ADMIN_UNLOCKED, '1');
            }
          } catch (_) {}
        },

        lock() {
          this.memoryUnlocked = false;
          try {
            if (typeof sessionStorage !== 'undefined') {
              sessionStorage.removeItem(STORAGE_KEYS.ADMIN_UNLOCKED);
            }
          } catch (_) {}
        },

        verifyPin(inputPin) {
          const now = Date.now();
          if (this.lockedUntil > now) {
            const secs = Math.ceil((this.lockedUntil - now) / 1000);
            return { ok: false, locked: true, waitSeconds: secs, message: `Terlalu banyak percobaan salah. Tunggu ${secs} detik.` };
          }
          if (this.hashPin(inputPin) === this.getStoredHash()) {
            this.unlock();
            return { ok: true };
          }
          this.failedAttempts += 1;
          const remaining = Math.max(0, 5 - this.failedAttempts);
          if (remaining === 0) {
            this.lockedUntil = Date.now() + 30000;
            this.failedAttempts = 0;
            return { ok: false, locked: true, waitSeconds: 30, message: '5x PIN salah. Akses dikunci sementara selama 30 detik.' };
          }
          return { ok: false, locked: false, remaining, message: `PIN Admin salah. Sisa percobaan: ${remaining} kali.` };
        },

        changePin(oldPin, newPin, confirmPin) {
          if (this.hashPin(oldPin) !== this.getStoredHash()) {
            return { ok: false, message: 'PIN Admin saat ini tidak sesuai.' };
          }
          if (!/^\d{6}$/.test(String(newPin || ''))) {
            return { ok: false, message: 'PIN baru wajib berupa tepat 6 digit angka.' };
          }
          if (newPin !== confirmPin) {
            return { ok: false, message: 'Konfirmasi PIN baru tidak cocok.' };
          }
          try {
            localStorage.setItem(STORAGE_KEYS.ADMIN_PIN_HASH, this.hashPin(newPin));
          } catch (_) {
            return { ok: false, message: 'Gagal menyimpan PIN baru di penyimpanan browser.' };
          }
          return { ok: true, message: 'PIN Admin Logistik berhasil diperbarui.' };
        }

      /* ======================================================================
       * 3. UTILITAS TANGGAL WIB, FORMATTER, GAMBAR & EKSPOR
       * ====================================================================== */
      function getNowWIB() {
        const now = new Date();
        // Konversi akurat ke WIB (UTC+7)
        const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utcMs + 7 * 3600000);
      }

      function getTodayWibISO() {
        const d = getNowWIB();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function shiftDateISO(isoDate, deltaDays) {
        const [y, m, d] = isoDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d + deltaDays);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }

      function addMonthsISO(isoDate, months) {
        const [y, m, d] = (isoDate || getTodayWibISO()).split('-').map(Number);
        const dt = new Date(y, m - 1 + months, d);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }

      function diffDaysFromToday(targetIso) {
        if (!targetIso) return 999;
        const [ty, tm, td] = getTodayWibISO().split('-').map(Number);
        const [y, m, d] = String(targetIso).split('-').map(Number);
        const todayUtc = Date.UTC(ty, tm - 1, td);
        const targetUtc = Date.UTC(y, m - 1, d);
        return Math.round((targetUtc - todayUtc) / 86400000);
      }

      function formatTanggalIndo(isoDate, includeDay = true) {
        if (!isoDate) return '-';
        const clean = String(isoDate).slice(0, 10);
        const parts = clean.split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return isoDate;
        const dt = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayStr = HARI_ID[dt.getDay()];
        const monthStr = BULAN_ID[dt.getMonth()];
        return includeDay
          ? `${dayStr}, ${parts[2]} ${monthStr} ${parts[0]}`
          : `${parts[2]} ${monthStr} ${parts[0]}`;
      }

      function formatBulanIndo(ym) {
        if (!ym || ym === 'ALL') return 'Semua Periode';
        const [y, m] = ym.split('-').map(Number);
        if (!y || !m) return ym;
        return `${BULAN_ID[m - 1]} ${y}`;
      }

      function formatTanggalWaktuIndo(stamp) {
        if (!stamp) return '-';
        const match = String(stamp).match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);
        if (!match) return stamp;
        return `${formatTanggalIndo(match[1], false)}, ${match[2]}`;
      }

      function formatRelativeDateLabel(isoDate) {
        const diff = diffDaysFromToday(isoDate);
        if (diff === 0) return 'Hari ini';
        if (diff === 1) return 'Besok';
        if (diff === 2) return 'Lusa';
        if (diff === -1) return 'Kemarin';
        if (diff > 2) return `${diff} hari lagi`;
        return `${Math.abs(diff)} hari lalu`;
      }

      function formatNowWibStamp() {
        const d = getNowWIB();
        const iso = getTodayWibISO();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${iso} ${hh}:${mm} WIB`;
      }

      function formatNowClockWIB() {
        const d = getNowWIB();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss} WIB`;
      }

      function formatRupiah(amount) {
        const n = Math.round(Number(amount) || 0);
        return 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }

      function formatKM(km) {
        const n = Math.round(Number(km) || 0);
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' km';
      }

      function formatNumberID(num) {
        const n = Math.round(Number(num) || 0);
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function generateId(prefix) {
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      }

      function getInitials(name) {
        if (!name) return 'BI';
        const parts = name.trim().split(/\s+/);
        return ((parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '')).toUpperCase();
      }

      function isTimeOverlap(startA, endA, startB, endB) {
        if (!startA || !endA || !startB || !endB) return false;
        return String(startA) < String(endB) && String(startB) < String(endA);
      }

      function calcDurationLabel(startHHMM, endHHMM) {
        if (!startHHMM || !endHHMM) return '';
        const [sh, sm] = startHHMM.split(':').map(Number);
        const [eh, em] = endHHMM.split(':').map(Number);
        const diffMin = (eh * 60 + em) - (sh * 60 + sm);
        if (diffMin <= 0) return 'Jam kembali harus lebih besar';
        const h = Math.floor(diffMin / 60);
        const m = diffMin % 60;
        return h > 0 && m > 0 ? `${h} jam ${m} menit` : h > 0 ? `${h} jam` : `${m} menit`;
      }

      /**
       * Membuat gambar struk sintetis yang realistis (Canvas -> JPEG <= 60KB)
       * agar struk contoh seed data & simulasi pengujian langsung tampil tajam.
       */
      function createSampleReceiptDataUrl({ type, plate, nominal, dateLabel, liter, odo, merchant }) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 460;
          canvas.height = 600;
          const ctx = canvas.getContext('2d');

          // Kertas thermal struk
          ctx.fillStyle = '#FDFDFB';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Border halus
          ctx.strokeStyle = '#E2E8F0';
          ctx.lineWidth = 4;
          ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

          // Header strip
          ctx.fillStyle = type === 'BBM' ? '#0B3B60' : '#1D4ED8';
          ctx.fillRect(24, 24, canvas.width - 48, 72);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(merchant || (type === 'BBM' ? 'SPBU PERTAMINA 44.502.11' : 'JASA MARGA — GERBANG TOL SEMARANG'), canvas.width / 2, 56);
          ctx.font = '13px sans-serif';
          ctx.fillText(type === 'BBM' ? 'Jl. Pandanaran / Imam Bardjo, Semarang' : 'Transaksi E-Toll Mandiri / BNI TapCash', canvas.width / 2, 80);

          // Garis putus-putus
          ctx.strokeStyle = '#94A3B8';
          ctx.setLineDash([6, 4]);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(32, 120);
          ctx.lineTo(canvas.width - 32, 120);
          ctx.stroke();
          ctx.setLineDash([]);

          // Isi struk
          ctx.textAlign = 'left';
          ctx.fillStyle = '#0F172A';
          ctx.font = 'bold 16px monospace';
          ctx.fillText('BUKTI TRANSAKSI OPERASIONAL', 36, 152);

          ctx.font = '14px monospace';
          ctx.fillStyle = '#334155';
          const rows = [
            ['INSTANSI', 'KPwBI PROV. JAWA TENGAH'],
            ['TANGGAL', dateLabel || formatNowWibStamp()],
            ['KATEGORI', type === 'BBM' ? 'PENGISIAN BBM DINAS' : 'TRANSAKSI / TOP-UP E-TOLL'],
            ['NO. POLISI', plate || 'H 1205 BI'],
            ...(type === 'BBM' ? [
              ['PRODUK', 'PERTAMAX / DEXLITE'],
              ['VOLUME', (liter ? liter + ' Liter' : 'Sesuai Meter SPBU')],
              ['ODOMETER', odo ? formatKM(odo) : '-']
            ] : [
              ['RUAS TOL', 'Semarang - Solo / Kalikangkung'],
              ['METODE', 'Kartu E-Toll Dinas BI']
            ])
          ];

          let y = 190;
          rows.forEach(([k, v]) => {
            ctx.fillStyle = '#64748B';
            ctx.fillText(k.padEnd(11, ' ') + ':', 36, y);
            ctx.fillStyle = '#0F172A';
            ctx.fillText(String(v).slice(0, 26), 160, y);
            y += 32;
          });

          // Garis total
          ctx.strokeStyle = '#0F172A';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(36, y + 6);
          ctx.lineTo(canvas.width - 36, y + 6);
          ctx.stroke();

          ctx.font = 'bold 22px monospace';
          ctx.fillStyle = '#0B3B60';
          ctx.fillText('TOTAL BAYAR', 36, y + 44);
          ctx.textAlign = 'right';
          ctx.fillText(formatRupiah(nominal || 0), canvas.width - 36, y + 44);

          // Footer verifikasi
          ctx.textAlign = 'center';
          ctx.fillStyle = '#059669';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('✓ TERVERIFIKASI — DALMUDI', canvas.width / 2, canvas.height - 62);
          ctx.fillStyle = '#64748B';
          ctx.font = '12px monospace';
          ctx.fillText('Arsip Digital Fungsi Logistik & Pengelolaan Aset', canvas.width / 2, canvas.height - 38);

          return canvas.toDataURL('image/jpeg', 0.72);
        } catch (err) {
          return '';
        }
      }

      /**
       * Kompresi gambar bukti struk di sisi klien (HTML5 Canvas)
       * secara iteratif hingga <= 150 KB.
       */
      function compressReceiptImage(file, maxKB = 150) {
        return new Promise((resolve, reject) => {
          const originalKB = Math.max(1, Math.round(file.size / 1024));
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
          reader.onload = (ev) => {
            const img = new Image();
            img.onerror = () => reject(new Error('Format gambar tidak didukung.'));
            img.onload = () => {
              let maxDim = 1280;
              let quality = 0.82;
              let dataUrl = '';
              let compressedKB = originalKB;

              for (let attempt = 0; attempt < 10; attempt++) {
                const ratio = Math.min(1, maxDim / Math.max(img.width, img.height));
                const w = Math.max(1, Math.round(img.width * ratio));
                const h = Math.max(1, Math.round(img.height * ratio));

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);

                dataUrl = canvas.toDataURL('image/jpeg', quality);
                // Estimasi ukuran byte aktual dari string Base64
                const base64Body = dataUrl.split(',')[1] || '';
                compressedKB = Math.max(1, Math.round((base64Body.length * 3) / 4 / 1024));

                if (compressedKB <= maxKB) break;

                if (quality > 0.4) {
                  quality -= 0.12;
                } else {
                  maxDim = Math.round(maxDim * 0.78);
                  quality = 0.65;
                }
              }

              resolve({
                dataUrl,
                originalKB,
                compressedKB
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      /* ======================================================================
       * 5. ENGINE STATE & SINKRONISASI REAL-TIME
       *    (LocalStorage + BroadcastChannel + Firebase Firestore + GAS)
       * ====================================================================== */
      const SyncEngine = {
        channel: null,
        firestoreDb: null,
        firebaseActive: false,
        config: null,
        syncLogs: [],

        init() {
          this.config = this.loadConfig();
          this.syncLogs = this.loadSyncLogs();

          // BroadcastChannel API untuk sinkronisasi real-time antar-tab browser (< 50ms)
          if (typeof BroadcastChannel !== 'undefined') {
            this.channel = new BroadcastChannel(BROADCAST_CHANNEL_NAME);
            this.channel.onmessage = (event) => {
              const msg = event.data;
              if (!msg || msg.senderId === AppState.tabId) return;
              this.handleIncomingSync(msg);
            };
          }

          // Fallback listener localStorage untuk browser/konteks tertentu
          window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEYS.STATE && e.newValue) {
              try {
                const parsed = JSON.parse(e.newValue);
                if (parsed && parsed.updated_at !== AppState.data.updated_at) {
                  AppState.data = parsed;
                  renderAll();
                }
              } catch (_) {}
            }
          });

          // Jika kredensial Firebase diisi, aktifkan Firestore real-time listener
          if (this.hasFirebaseConfig()) {
            this.initFirebaseRealtime();
          }

          // Jika URL Google Apps Script sudah aktif, tarik data terbaru di latar belakang secara senyap
          if (this.hasGasUrl()) {
            this.pullFromGAS(true);
          }
        },

        loadConfig() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.CONFIG);
            if (raw) {
              const saved = JSON.parse(raw);
              const savedGas = typeof saved.GOOGLE_APPS_SCRIPT_URL === 'string' ? saved.GOOGLE_APPS_SCRIPT_URL.trim() : '';
              return {
                GOOGLE_APPS_SCRIPT_URL: savedGas || DEFAULT_INTEGRATION_CONFIG.GOOGLE_APPS_SCRIPT_URL,
                FIREBASE_CONFIG: Object.assign({}, DEFAULT_INTEGRATION_CONFIG.FIREBASE_CONFIG, saved.FIREBASE_CONFIG || {})
              };
            }
          } catch (_) {}
          return JSON.parse(JSON.stringify(DEFAULT_INTEGRATION_CONFIG));
        },

        saveConfig(newCfg) {
          this.config = newCfg;
          localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(newCfg));
          if (this.hasFirebaseConfig() && !this.firebaseActive) {
            this.initFirebaseRealtime();
          }
          renderAll();
        },

        hasFirebaseConfig() {
          const fc = this.config && this.config.FIREBASE_CONFIG;
          return Boolean(fc && fc.apiKey && fc.projectId);
        },

        hasGasUrl() {
          return Boolean(this.config && this.config.GOOGLE_APPS_SCRIPT_URL && this.config.GOOGLE_APPS_SCRIPT_URL.trim().startsWith('http'));
        },

        getModeLabel() {
          if (this.firebaseActive && this.hasGasUrl()) return 'Cloud Real-Time (Firebase + Sheets)';
          if (this.firebaseActive) return 'Cloud Real-Time (Firebase)';
          if (this.hasGasUrl()) return 'Real-Time Lokal + Arsip Google Sheets';
          return 'Real-Time Lokal (Multi-Tab Sync)';
        },

        loadSyncLogs() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.SYNC_LOG);
            return raw ? JSON.parse(raw) : [];
          } catch (_) {
            return [];
          }
        },

        addSyncLog(entry) {
          this.syncLogs.unshift({
            time: formatNowClockWIB(),
            ...entry
          });
          if (this.syncLogs.length > 25) this.syncLogs.length = 25;
          try {
            localStorage.setItem(STORAGE_KEYS.SYNC_LOG, JSON.stringify(this.syncLogs));
          } catch (_) {}
        },

        persistAndBroadcast(eventType, meta = {}) {
          AppState.data.updated_at = Date.now();
          try {
            localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(AppState.data));
            localStorage.setItem(STORAGE_KEYS.ADMIN_LIST, JSON.stringify(AppState.adminList));
          } catch (err) {
            showToast('Peringatan Penyimpanan', 'Kapasitas localStorage hampir penuh. Disarankan sinkronkan ke Google Sheets.', 'warning');
          }

          if (this.channel) {
            this.channel.postMessage({
              senderId: AppState.tabId,
              eventType,
              meta,
              state: AppState.data,
              adminList: AppState.adminList
            });
          }

          // Jika Firebase aktif, tulis ke Firestore
          if (this.firebaseActive && this.firestoreDb) {
            this.pushToFirebase(eventType, meta);
          }
        },

        handleIncomingSync(msg) {
          if (msg.state) {
            AppState.data = msg.state;
          }
          if (Array.isArray(msg.adminList)) {
            AdminAuth.saveAdminList(msg.adminList);
          }
          renderAll();

          if (msg.eventType === 'CREATE_BOOKING') {
            showToast('Sinkronisasi Real-Time', `Peminjaman baru ${msg.meta?.kode_booking || ''} telah masuk.`, 'info');
          } else if (msg.eventType === 'START_TRIP') {
            showToast('Status Armada Diperbarui', `Kendaraan ${msg.meta?.plat_nomor || ''} mulai beroperasi (Sedang Dinas).`, 'info');
          } else if (msg.eventType === 'COMPLETE_TRIP') {
            showToast('Perjalanan Selesai', `Tugas ${msg.meta?.kode_booking || ''} selesai. Odometer & status diperbarui.`, 'success');
            // Trigger otomatis modal rating jika pengguna berada di peran Pegawai
            if (AppState.role === 'pegawai' && msg.meta?.booking_id) {
              setTimeout(() => openRatingModal(msg.meta.booking_id), 350);
            }
          } else if (msg.eventType === 'SUBMIT_RATING') {
            showToast('Rating Pengemudi Masuk', `Penilaian bintang ${msg.meta?.rating || 5}★ telah diperbarui secara live.`, 'success');
          } else if (msg.eventType === 'ADD_EXPENSE') {
            showToast('Catatan Biaya Masuk', `Transaksi ${msg.meta?.jenis_biaya || 'Biaya'} ${formatRupiah(msg.meta?.nominal || 0)} tercatat.`, 'info');
          } else if (msg.eventType === 'ADD_SERVICE') {
            showToast('Jadwal Service Diperbarui', `Perawatan armada ${msg.meta?.plat_nomor || ''} telah dicatat.`, 'success');
          }
        },

        /**
         * Background POST non-blocking ke Google Apps Script Web App (`Code.gs`).
         * Menggunakan `text/plain;charset=utf-8` agar terhindar dari preflight CORS block.
         */
        async postToGAS(action, payload) {
          if (!this.hasGasUrl()) {
            this.addSyncLog({
              target: 'Local Sync',
              action,
              status: 'OK (Mode Lokal)',
              detail: 'URL GAS belum diisi — tersimpan real-time di perangkat.'
            });
            return { skipped: true };
          }

          const url = this.config.GOOGLE_APPS_SCRIPT_URL.trim();
          try {
            const resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, payload })
            });
            const data = await resp.json();
            if (data.status === 'success') {
              this.addSyncLog({
                target: 'Google Sheets (GAS)',
                action,
                status: 'BERHASIL',
                detail: `Tersinkron pada ${data.timestamp || formatNowClockWIB()}`
              });
              return data;
            }
            throw new Error(data.message || 'Respon GAS error');
          } catch (err) {
            this.addSyncLog({
              target: 'Google Sheets (GAS)',
              action,
              status: 'GAGAL',
              detail: err.message || 'Koneksi GAS gagal'
            });
            return { error: err.message };
          }
        },

        async testGasConnection() {
          if (!this.hasGasUrl()) {
            showToast('URL GAS Kosong', 'Masukkan URL Web App Google Apps Script terlebih dahulu.', 'warning');
            return null;
          }
          const url = this.config.GOOGLE_APPS_SCRIPT_URL.trim();
          const sep = url.includes('?') ? '&' : '?';
          try {
            const resp = await fetch(`${url}${sep}action=ping`);
            const json = await resp.json();
            if (json.status === 'success') {
              this.addSyncLog({
                target: 'Google Sheets (GAS)',
                action: 'PING',
                status: 'TERHUBUNG',
                detail: `Sheet: ${json.spreadsheetName || 'OK'}`
              });
              showToast('Koneksi GAS Berhasil', `Terhubung ke "${json.spreadsheetName || 'Spreadsheet DALMUDI'}".`, 'success');
              return json;
            }
            throw new Error(json.message || 'Respon tidak valid');
          } catch (err) {
            this.addSyncLog({
              target: 'Google Sheets (GAS)',
              action: 'PING',
              status: 'GAGAL',
              detail: err.message
            });
            showToast('Koneksi GAS Gagal', 'Pastikan deployment Web App diset "Who has access: Anyone".', 'error');
            return null;
          }
        },

        async pullFromGAS(silent = false) {
          if (!this.hasGasUrl()) {
            if (!silent) showToast('URL GAS Kosong', 'Isi URL Web App GAS untuk menarik data dari Google Sheets.', 'warning');
            return;
          }
          const url = this.config.GOOGLE_APPS_SCRIPT_URL.trim();
          const sep = url.includes('?') ? '&' : '?';
          try {
            if (!silent) showToast('Sinkronisasi', 'Mengambil data terbaru dari Google Sheets...', 'info');
            const resp = await fetch(`${url}${sep}action=getAll`);
            const json = await resp.json();
            if (json.status === 'success' && json.data) {
              let pulledSomething = false;
              if (json.data.vehicles && json.data.vehicles.length > 0) {
                AppState.data = {
                  version: 1,
                  updated_at: Date.now(),
                  vehicles: json.data.vehicles,
                  drivers: json.data.drivers || [],
                  bookings: json.data.bookings || [],
                  expenses: json.data.expenses || [],
                  services: json.data.services || []
                };
                pulledSomething = true;
              }
              if (Array.isArray(json.data.admins) && json.data.admins.length > 0) {
                AdminAuth.saveAdminList(json.data.admins);
                pulledSomething = true;
              }
              if (pulledSomething) {
                this.addSyncLog({
                  target: 'Google Sheets (GAS)',
                  action: silent ? 'AUTO_PULL' : 'PULL',
                  status: 'BERHASIL',
                  detail: `Data terbaru dimuat (${AppState.data.vehicles.length} armada, ${AppState.adminList.length} admin)`
                });
                this.persistAndBroadcast('SYNC_PULL', {});
                renderAll();
                if (!silent) showToast('Data Ditarik', 'Seluruh data Google Sheets (termasuk Master_Admin) berhasil dimuat.', 'success');
              } else if (!silent) {
                showToast('Sheet Masih Kosong', 'Klik "Dorong Semua ke Sheets" untuk mengunggah data awal ke Spreadsheet.', 'warning');
              }
            } else {
              throw new Error(json.message || 'Gagal membaca data');
            }
          } catch (err) {
            if (!silent) showToast('Gagal Menarik Data', err.message, 'error');
          }
        },

        async pushAllToGAS() {
          if (!this.hasGasUrl()) {
            showToast('URL GAS Kosong', 'Isi URL Web App GAS terlebih dahulu.', 'warning');
            return;
          }
          showToast('Menyinkronkan', 'Mengirim seluruh tabel (termasuk Master_Admin) ke Google Sheets...', 'info');
          const res = await this.postToGAS('SYNC_ALL', {
            vehicles: AppState.data.vehicles,

            expenses: AppState.data.expenses,

          });
          if (res && res.status === 'success') {
            showToast('Sinkronisasi Selesai', 'Seluruh data (termasuk Daftar Admin) berhasil diarsipkan ke Google Sheets & Drive.', 'success');
          } else {
            showToast('Sinkronisasi Gagal', res?.error || 'Periksa izin akses Web App GAS Anda.', 'error');
          }
          renderAll();
        },

        /**
         * Dynamic loader opsional untuk Firebase Firestore (Real-Time onSnapshot)
         * Hanya dimuat jika FIREBASE_CONFIG telah diisi pengguna.
         */
        initFirebaseRealtime() {
          const loadScript = (src) => new Promise((res, rej) => {
            if (document.querySelector(`script[src="${src}"]`)) return res();
            const s = document.createElement('script');
            s.src = src;
            s.onload = res;
            s.onerror = rej;
            document.head.appendChild(s);
          });

          Promise.all([
            loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js'),
            loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js')
          ]).then(() => {
            if (!window.firebase) return;
            const app = window.firebase.apps.length
              ? window.firebase.app()
              : window.firebase.initializeApp(this.config.FIREBASE_CONFIG);
            const db = app.firestore();
            this.firestoreDb = db;
            this.firebaseActive = true;

            const collections = ['vehicles', 'drivers', 'bookings', 'expenses', 'services'];
            collections.forEach((colName) => {
              db.collection(colName).onSnapshot((snap) => {
                if (snap.empty) return;
                const items = [];
                snap.forEach((doc) => items.push(Object.assign({ id: doc.id }, doc.data())));
                AppState.data[colName] = items;
                localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(AppState.data));
                renderAll();
              }, (err) => {
                this.addSyncLog({ target: 'Firebase', action: `onSnapshot(${colName})`, status: 'ERROR', detail: err.message });
              });
            });

            this.addSyncLog({ target: 'Firebase', action: 'CONNECT', status: 'TERHUBUNG', detail: `Project: ${this.config.FIREBASE_CONFIG.projectId}` });
            renderAll();
          }).catch((err) => {
            this.addSyncLog({ target: 'Firebase', action: 'LOAD_SDK', status: 'GAGAL', detail: err.message || 'Gagal memuat SDK Firebase' });
          });
        },

        pushToFirebase(eventType, meta) {
          if (!this.firestoreDb) return;
          try {
            const batch = this.firestoreDb.batch();
            ['vehicles', 'drivers', 'bookings', 'expenses', 'services'].forEach((col) => {
              (AppState.data[col] || []).forEach((item) => {
                if (item && item.id) {
                  batch.set(this.firestoreDb.collection(col).doc(String(item.id)), item, { merge: true });
                }
              });
            });
            batch.commit().catch(() => {});
          } catch (_) {}
        }
      };

      /**
       * Logika Peringatan Otomatis Jadwal Service (PRD Seksi 4.4):
       * Alert aktif jika (Target_KM_Service - Odometer_Saat_Ini) <= 500 km
       * ATAU tanggal service berikutnya tinggal <= 7 hari.
       */
      function getVehicleServiceHealth(v) {
        const currentKm = Number(v.odometer_saat_ini) || 0;
        const targetKm = Number(v.target_km_service) || 10000;
        const remainingKm = targetKm - currentKm;
        const daysLeft = diffDaysFromToday(v.tanggal_service_berikutnya);
        const intervalBase = Math.max(0, targetKm - 10000);
        const progressRaw = ((currentKm - intervalBase) / 10000) * 100;
        const progressPct = Math.max(0, Math.min(100, Math.round(progressRaw)));
        const needsService = remainingKm <= 500 || daysLeft <= 7;
        const isOverdue = remainingKm <= 0 || daysLeft < 0;

        let reason = '';
        if (remainingKm <= 500 && daysLeft <= 7) {
          reason = `Sisa ${formatNumberID(Math.max(0, remainingKm))} km & ${Math.max(0, daysLeft)} hari`;
        } else if (remainingKm <= 500) {
          reason = remainingKm <= 0 ? `Melewati batas ${formatNumberID(Math.abs(remainingKm))} km` : `Sisa ${formatNumberID(remainingKm)} km lagi`;
        } else if (daysLeft <= 7) {
          reason = daysLeft < 0 ? `Lewat ${Math.abs(daysLeft)} hari` : `Tinggal ${daysLeft} hari lagi`;
        } else {
          reason = `Sisa ${formatNumberID(remainingKm)} km`;
        }

        return {
          currentKm,
          targetKm,
          remainingKm,
          daysLeft,
          progressPct,
          needsService,
          isOverdue,
          reason
        };
      }

      /**
       * Deteksi konflik jadwal anti-double-booking untuk kendaraan & driver
       */
      function getVehicleAvailability(vehicle, tanggal, jamMulai, jamSelesai) {
        if (vehicle.status === 'MAINTENANCE') {
          return { available: false, reason: 'Sedang Perawatan / Bengkel', badgeType: 'MAINTENANCE', conflictBooking: null };
        }

        const conflict = AppState.data.bookings.find((b) =>
          b.vehicle_id === vehicle.id &&
          b.status !== 'COMPLETED' &&
          b.tanggal === tanggal &&
          isTimeOverlap(b.jam_mulai, b.jam_selesai, jamMulai, jamSelesai)
        );

        if (conflict) {
          const label = conflict.status === 'ON_TRIP'
            ? `Sedang Dinas (${conflict.jam_mulai}–${conflict.jam_selesai} WIB)`
            : `Terjadwal (${conflict.jam_mulai}–${conflict.jam_selesai} WIB)`;
          return { available: false, reason: label, badgeType: conflict.status === 'ON_TRIP' ? 'ON_TRIP' : 'BOOKED', conflictBooking: conflict };
        }

        // Jika tanggal hari ini dan kendaraan sedang ON_TRIP di luar slot (tetap cek jika tidak punya booking tercatat)
        if (tanggal === getTodayWibISO() && vehicle.status === 'ON_TRIP') {
          const activeTrip = AppState.data.bookings.find((b) => b.vehicle_id === vehicle.id && b.status === 'ON_TRIP');
          if (!activeTrip) {
            return { available: false, reason: 'Sedang Dinas', badgeType: 'ON_TRIP', conflictBooking: null };
          }
        }

        return { available: true, reason: 'Tersedia', badgeType: 'READY', conflictBooking: null };
      }

      function getDriverAvailability(driver, tanggal, jamMulai, jamSelesai) {
        if (driver.status === 'OFF') {
          return { available: false, reason: 'Sedang Off / Tidak Bertugas', badgeType: 'OFF', conflictBooking: null };
        }

        const conflict = AppState.data.bookings.find((b) =>
          b.driver_id === driver.id &&
          b.status !== 'COMPLETED' &&
          b.tanggal === tanggal &&
          isTimeOverlap(b.jam_mulai, b.jam_selesai, jamMulai, jamSelesai)
        );

        if (conflict) {
          const label = conflict.status === 'ON_TRIP'
            ? `Sedang Bertugas (${conflict.jam_mulai}–${conflict.jam_selesai} WIB)`
            : `Terjadwal (${conflict.jam_mulai}–${conflict.jam_selesai} WIB)`;
          return { available: false, reason: label, badgeType: 'ON_DUTY', conflictBooking: conflict };
        }

        return { available: true, reason: 'Tersedia', badgeType: 'AVAILABLE', conflictBooking: null };
      }

      function getPendingRatingBookings() {
        return AppState.data.bookings.filter((b) => b.status === 'COMPLETED' && !b.rating);
      }

      function getMonthlyKPIs() {
        const currentMonth = getTodayWibISO().slice(0, 7);
        const vehicles = AppState.data.vehicles;
        const readyCount = vehicles.filter((v) => v.status === 'READY').length;
        const onTripCount = vehicles.filter((v) => v.status === 'ON_TRIP').length;
        const maintenanceCount = vehicles.filter((v) => v.status === 'MAINTENANCE').length;
        const serviceAlertUnits = vehicles.filter((v) => getVehicleServiceHealth(v).needsService);

        const monthExpenses = AppState.data.expenses.filter((e) => String(e.tanggal_waktu || '').startsWith(currentMonth));
        const totalBBM = monthExpenses.filter((e) => e.jenis_biaya === 'BBM').reduce((acc, e) => acc + (Number(e.nominal) || 0), 0);
        const totalEtoll = monthExpenses.filter((e) => e.jenis_biaya === 'ETOLL').reduce((acc, e) => acc + (Number(e.nominal) || 0), 0);

        return {
          currentMonth,
          totalVehicles: vehicles.length,
          readyCount,
          onTripCount,
          maintenanceCount,
          serviceAlertCount: serviceAlertUnits.length,
          serviceAlertUnits,
          totalBBM,
          totalEtoll,
          totalExpenses: totalBBM + totalEtoll
        };
      }

      (function applyBIFavicon() {
        try {
          if (typeof document !== 'undefined' && document.head && !document.querySelector('link[rel="icon"]')) {

            link.rel = 'icon';

      /** Toast Notification */
      function showToast(title, message, variant = 'info') {
        const root = document.getElementById('toast-root');
        if (!root) return;

        const styles = {
          success: { border: 'border-emerald-200', icon: 'check-circle-2', iconColor: 'text-emerald-600', bg: 'bg-white' },
          warning: { border: 'border-amber-200', icon: 'alert-triangle', iconColor: 'text-amber-600', bg: 'bg-white' },
          error: { border: 'border-rose-200', icon: 'x-circle', iconColor: 'text-rose-600', bg: 'bg-white' },
          info: { border: 'border-blue-200', icon: 'info', iconColor: 'text-[#1D4ED8]', bg: 'bg-white' }
        }[variant] || { border: 'border-slate-200', icon: 'info', iconColor: 'text-[#0B3B60]', bg: 'bg-white' };

        const toast = document.createElement('div');
        toast.className = `pointer-events-auto animate-toast ${styles.bg} border ${styles.border} rounded-xl shadow-soft p-3.5 flex items-start gap-3`;

      function syncMobileDrawerClasses() {

          sidebar.classList.toggle('translate-x-0', mobileDrawerOpen);

        if (backdrop) {
          backdrop.classList.toggle('opacity-0', !mobileDrawerOpen);
          backdrop.classList.toggle('pointer-events-none', !mobileDrawerOpen);
          backdrop.classList.toggle('opacity-100', mobileDrawerOpen);
          backdrop.classList.toggle('pointer-events-auto', mobileDrawerOpen);
          backdrop.setAttribute('aria-hidden', mobileDrawerOpen ? 'false' : 'true');

        if (hamburger) {
          hamburger.setAttribute('aria-expanded', mobileDrawerOpen ? 'true' : 'false');

        if (document.body && document.body.classList) {
          document.body.classList.toggle('overflow-hidden', mobileDrawerOpen);
        }

      // Secret Trigger 1: Tap / Klik Logo & Judul "DALMUDI" 5x dalam < 3 detik
      const BrandTapTracker = {
        timestamps: [],
        singleTapTimer: null
      };

      function handleBrandLogoTap() {
        const now = Date.now();
        // Simpan hanya klik dalam jendela waktu < 3000 ms (3 detik)
        BrandTapTracker.timestamps = BrandTapTracker.timestamps.filter((t) => now - t < 3000);
        BrandTapTracker.timestamps.push(now);

        if (BrandTapTracker.singleTapTimer) {
          clearTimeout(BrandTapTracker.singleTapTimer);
          BrandTapTracker.singleTapTimer = null;
        }

        if (BrandTapTracker.timestamps.length >= 5) {
          BrandTapTracker.timestamps = [];
          closeMobileDrawer();
          if (AppState.role === 'admin') {
            showToast('Mode Admin Aktif', 'Anda sudah berada di dashboard Admin Logistik.', 'info');
            return;
          }
          // Selalu validasi lewat pop-up PIN Admin saat dipicu oleh secret trigger
          openAdminPinModal(() => {
            const primary = AppState.adminList.find((a) => a.isPrimary) || DEFAULT_PRIMARY_ADMIN;
            if (!AdminAuth.findAdminByIdentifier(AppState.session.nip || AppState.session.email)) {
              AppState.session = {
                nip: primary.identifier,
                email: primary.isPrimary ? '' : (primary.identifier.includes('@') ? primary.identifier : ''),
                nama: primary.nama,
                unit_kerja: primary.unit,
                role: 'admin',
                driver_id: null
              };
            }
            AppState.role = 'admin';
            AppState.activeNav = ROLE_NAVS.admin[0].id;
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('Mode Admin Aktif', `Verifikasi PIN berhasil. Masuk sebagai ${AppState.session.nama}.`, 'success');
          });
          return;
        }

        // Klik 1x normal: kembali ke Beranda Pegawai (debounce 260ms agar tap cepat 5x tidak terganggu re-render)
        BrandTapTracker.singleTapTimer = setTimeout(() => {
          BrandTapTracker.singleTapTimer = null;
          if (BrandTapTracker.timestamps.length === 1) {
            if (AppState.role !== 'admin') {
              if (AppState.role !== 'pegawai' || AppState.activeNav !== 'beranda') {
                switchRole('pegawai', 'beranda');
              } else {
                closeMobileDrawer();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            } else {
              switchNav('dashboard');
            }
          }
        }, 260);
      }

      /** Modul 4.1: Wizard Peminjaman Kendaraan Anti-Bentrok (3 Langkah) */
      function renderPegawaiBookingWizard() {
        const bf = AppState.bookingForm;
        const validTime = bf.tanggal && bf.jam_mulai && bf.jam_selesai && bf.jam_selesai > bf.jam_mulai;

        // Evaluasi ketersediaan real-time berdasarkan tanggal & jam
        const vehicleStatuses = AppState.data.vehicles.map((v) => ({
          vehicle: v,
          avail: validTime ? getVehicleAvailability(v, bf.tanggal, bf.jam_mulai, bf.jam_selesai) : { available: false, reason: 'Atur jam valid', badgeType: 'OFF' },
          health: getVehicleServiceHealth(v)
        }));
        const readyVehCount = vehicleStatuses.filter((x) => x.avail.available).length;

        const driverStatuses = AppState.data.drivers.map((d) => ({
          driver: d,
          avail: validTime ? getDriverAvailability(d, bf.tanggal, bf.jam_mulai, bf.jam_selesai) : { available: false, reason: 'Atur jam valid', badgeType: 'OFF' }
        }));
        const readyDrvCount = driverStatuses.filter((x) => x.avail.available).length;

        // Pastikan pilihan lama tidak bentrok bila jam baru diubah
        if (bf.vehicle_id) {
          const curV = vehicleStatuses.find((x) => x.vehicle.id === bf.vehicle_id);
          if (!curV || !curV.avail.available) bf.vehicle_id = '';
        }
        if (bf.driver_id) {
          const curD = driverStatuses.find((x) => x.driver.id === bf.driver_id);
          if (!curD || !curD.avail.available) bf.driver_id = '';
        }

        const selectedVeh = getVehicleById(bf.vehicle_id);
        const selectedDrv = getDriverById(bf.driver_id);

        return `
          <div class="space-y-5">
            <!-- Header & Stepper Anti-Bentrok -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-card">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-3">
                <div class="min-w-0">
                  <h2 class="text-base sm:text-lg font-extrabold text-[#0B3B60] leading-snug">Pengajuan Peminjaman Kendaraan Dinas</h2>
                  <p class="text-xs text-slate-500 mt-0.5">Filter jadwal anti-bentrok aktif otomatis berdasarkan tanggal &amp; jam WIB yang dipilih.</p>
                </div>
                <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#EFF6FF] text-[#1D4ED8] text-[11px] sm:text-xs font-bold tabular-nums self-start sm:self-auto">
                  <i data-lucide="shield-check" class="w-4 h-4 shrink-0"></i>
                  <span>${readyVehCount}/${AppState.data.vehicles.length} Mobil · ${readyDrvCount}/${AppState.data.drivers.length} Driver Ready</span>
                </div>
              </div>

              <!-- Stepper Bar (Mobile-Compact tanpa Terpotong) -->
              <div class="mt-4 sm:mt-5 grid grid-cols-3 gap-2 sm:gap-4">
                ${[
                  { n: 1, title: 'Waktu & Detail', mobileTitle: 'Waktu', sub: validTime ? `${bf.jam_mulai}–${bf.jam_selesai}` : 'Isi Jadwal' },
                  { n: 2, title: 'Pilih Armada', mobileTitle: 'Armada', sub: selectedVeh ? selectedVeh.plat_nomor : `${readyVehCount} Ready` },
                  { n: 3, title: 'Pilih Driver & Ajukan', mobileTitle: 'Driver', sub: selectedDrv ? selectedDrv.nama.split(' ')[0] : `${readyDrvCount} Ready` }
                ].map((s) => {
                  const isCurrent = bf.step === s.n;
                  const isDone = (s.n === 1 && validTime && bf.nama_peminjam && bf.unit_kerja && bf.tujuan) ||
                                 (s.n === 2 && Boolean(bf.vehicle_id)) ||
                                 (s.n === 3 && Boolean(bf.driver_id));
                  return `
                    <button
                      onclick="App.setBookingStep(${s.n})"
                      class="p-2.5 sm:p-3 rounded-xl border transition text-center sm:text-left min-w-0 ${
                        isCurrent
                          ? 'bg-[#0B3B60] text-white border-[#0B3B60] shadow-sm'
                          : isDone
                            ? 'bg-[#ECFDF5] text-slate-900 border-emerald-200 hover:border-emerald-300'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                      }"
                    >
                      <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-2">
                        <span class="w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center shrink-0 tabular-nums ${
                          isCurrent ? 'bg-white text-[#0B3B60]' : isDone ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'
                        }">
                          ${isDone && !isCurrent ? '✓' : s.n}
                        </span>
                        <span class="text-[11px] sm:text-sm font-bold leading-tight truncate max-w-full">
                          <span class="sm:hidden">${s.mobileTitle}</span>
                          <span class="hidden sm:inline">${s.title}</span>
                        </span>
                      </div>
                      <div class="mt-1 sm:pl-8 text-[10px] sm:text-[11px] truncate tabular-nums ${isCurrent ? 'text-blue-200' : 'text-slate-500'}">${escapeHtml(s.sub)}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- STEP 1: Penentuan Waktu & Detail Dinas -->
            ${bf.step === 1 ? `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-card space-y-5">
                <div class="flex items-center gap-2.5 border-b border-slate-100 pb-3.5">
                  <span class="w-8 h-8 rounded-xl bg-[#0B3B60]/10 text-[#0B3B60] flex items-center justify-center font-extrabold text-sm">1</span>
                  <div>
                    <h3 class="text-sm sm:text-base font-extrabold text-slate-900">Waktu Pemakaian &amp; Detail Dinas</h3>
                    <p class="text-xs text-slate-500">Ubah tanggal atau jam untuk langsung melihat kendaraan yang tidak bentrok.</p>
                  </div>
                </div>

                <!-- Baris Waktu (Tanggal dalam Huruf + Jam Analog Modern 24-Jam WIB) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Tanggal Pemakaian</label>
                    <button

      function renderUnitDropdownItems(query) {

          return `<div class="px-3.5 py-2.5 text-xs text-slate-400">Unit kerja tidak ditemukan.</div>`;

        return filtered.map((u) => {

          return `

              type="button"
              onmousedown="App.selectUnitKerja('${escapeHtml(u)}')"
              class="w-full text-left px-3.5 py-2 text-xs sm:text-sm flex items-center justify-between gap-2 transition ${

            </button>
          `;
        }).join('');

      /** Halaman Perjalanan Saya + Status Menunggu Rating */
      function renderPegawaiTrips() {
        const sorted = [...AppState.data.bookings].sort((a, b) => {

          const score = (x) => (x.status === 'COMPLETED' && !x.rating ? 0 : x.status === 'ON_TRIP' ? 1 : x.status === 'ACTIVE' ? 2 : 3);
          return score(a) - score(b) || String(b.tanggal).localeCompare(String(a.tanggal));
        });

        return `

                      </div>
                    </div>

                    ${waitingRating ? `
                      <div class="mt-4 p-3.5 rounded-xl bg-[#FFFBEB] border border-amber-200 flex flex-wrap items-center justify-between gap-3">
                        <div class="text-xs text-amber-900">
                          <strong>Perjalanan telah selesai pada ${escapeHtml(formatTanggalWaktuIndo(b.waktu_selesai_aktual))}</strong>. Mohon berikan rating kinerja pengemudi untuk evaluasi Logistik KPwBI Jateng.

                        <button

                        </button>

                    ${b.rating ? `

                        <div>
                          <div class="flex items-center gap-2">

              <div class="min-w-0 flex-1">

                    <!-- Kendaraan yang Digunakan -->
                    ${veh ? `
                      <div class="p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-4">

                        <i data-lucide="fuel" class="w-5 h-5"></i>
                        <span>Catat BBM / E-Toll</span>

                    </div>

      /* ----------------------------------------------------------------------

       * ---------------------------------------------------------------------- */
      const ClockPickerState = {
        field: 'jam_mulai',
        title: 'Pilih Jam Berangkat (WIB)',
        hour: 9,
        minute: 0,
        mode: 'hour', // 'hour' | 'minute'
        isDragging: false
      };

      function openAnalogClockPicker(fieldName) {
        const raw = AppState.bookingForm[fieldName] || (fieldName === 'jam_mulai' ? '09:00' : '14:00');
        const [hh, mm] = String(raw).split(':').map((n) => parseInt(n, 10));
        ClockPickerState.field = fieldName;
        ClockPickerState.title = fieldName === 'jam_mulai' ? 'Jam Berangkat (WIB)' : 'Estimasi Jam Kembali (WIB)';
        ClockPickerState.hour = isNaN(hh) ? 9 : Math.max(0, Math.min(23, hh));
        ClockPickerState.minute = isNaN(mm) ? 0 : Math.max(0, Math.min(59, mm));
        ClockPickerState.mode = 'hour';
        ClockPickerState.isDragging = false;
        renderAnalogClockModal();
      }

      function buildClockTicksSvg() {
        const cx = 138;
        const cy = 138;
        let ticks = '';
        for (let i = 0; i < 60; i++) {
          const isMajor = i % 5 === 0;
          const angleRad = (i * 6 - 90) * (Math.PI / 180);
          const rOuter = 132;
          const rInner = isMajor ? 125 : 128;
          const x1 = (cx + rInner * Math.cos(angleRad)).toFixed(1);
          const y1 = (cy + rInner * Math.sin(angleRad)).toFixed(1);
          const x2 = (cx + rOuter * Math.cos(angleRad)).toFixed(1);
          const y2 = (cy + rOuter * Math.sin(angleRad)).toFixed(1);
          ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMajor ? '#94A3B8' : '#CBD5E1'}" stroke-width="${isMajor ? '1.8' : '1'}" stroke-linecap="round"/>`;
        }
        return ticks;
      }

      function getAnalogClockGeometry() {
        const cx = 138;
        const cy = 138;
        const R_OUTER = 104;
        const R_INNER = 67;

        if (ClockPickerState.mode === 'hour') {
          const h = ClockPickerState.hour;
          const isInner = h === 0 || h >= 13;
          const sector = h % 12; // 0 = 12/00
          const deg = sector * 30;
          const rad = (deg - 90) * (Math.PI / 180);
          const radius = isInner ? R_INNER : R_OUTER;
          return {
            cx,
            cy,
            x: cx + radius * Math.cos(rad),
            y: cy + radius * Math.sin(rad),
            tipRadius: isInner ? 17 : 20,
            handColor: isInner ? '#1D4ED8' : '#0B3B60',
            showFineDot: false
          };
        }

        const m = ClockPickerState.minute;
        const deg = m * 6;
        const rad = (deg - 90) * (Math.PI / 180);
        return {
          cx,
          cy,
          x: cx + R_OUTER * Math.cos(rad),
          y: cy + R_OUTER * Math.sin(rad),
          tipRadius: 19,
          handColor: '#0B3B60',
          showFineDot: m % 5 !== 0
        };
      }

      function renderAnalogClockNumbersHtml() {
        const cx = 138;
        const cy = 138;
        const R_OUTER = 104;
        const R_INNER = 67;
        const toPct = (v) => ((v / 276) * 100).toFixed(2) + '%';
        const nodes = [];

        if (ClockPickerState.mode === 'hour') {
          // Ring Luar: 12, 01..11 (Siang / Pagi)
          for (let i = 0; i < 12; i++) {
            const val = i === 0 ? 12 : i;
            const rad = (i * 30 - 90) * (Math.PI / 180);
            const x = cx + R_OUTER * Math.cos(rad);
            const y = cy + R_OUTER * Math.sin(rad);
            const active = ClockPickerState.hour === val;
            nodes.push(`
              <div class="analog-clock-num w-8 h-8 sm:w-9 sm:h-9 text-xs sm:text-sm font-extrabold ${active ? 'text-white' : 'text-slate-800'}" style="left:${toPct(x)};top:${toPct(y)};">
                ${String(val).padStart(2, '0')}
              </div>
            `);
          }
          // Ring Dalam: 00, 13..23 (Sore / Malam 24-Jam WIB)
          for (let i = 0; i < 12; i++) {
            const val = i === 0 ? 0 : i + 12;
            const rad = (i * 30 - 90) * (Math.PI / 180);
            const x = cx + R_INNER * Math.cos(rad);
            const y = cy + R_INNER * Math.sin(rad);
            const active = ClockPickerState.hour === val;
            nodes.push(`
              <div class="analog-clock-num w-7 h-7 sm:w-8 sm:h-8 text-[10px] sm:text-[11px] font-bold ${active ? 'text-white' : 'text-slate-500'}" style="left:${toPct(x)};top:${toPct(y)};">
                ${String(val).padStart(2, '0')}
              </div>
            `);
          }
        } else {
          // Mode Menit: 00, 05, 10 .. 55
          for (let i = 0; i < 12; i++) {
            const val = i * 5;
            const rad = (i * 30 - 90) * (Math.PI / 180);
            const x = cx + R_OUTER * Math.cos(rad);
            const y = cy + R_OUTER * Math.sin(rad);
            const active = ClockPickerState.minute === val;
            nodes.push(`
              <div class="analog-clock-num w-8 h-8 sm:w-9 sm:h-9 text-xs sm:text-sm font-extrabold ${active ? 'text-white' : 'text-slate-800'}" style="left:${toPct(x)};top:${toPct(y)};">
                ${String(val).padStart(2, '0')}
              </div>
            `);
          }
        }
        return nodes.join('');
      }

      function updateAnalogClockDomLive() {
        const hhStr = String(ClockPickerState.hour).padStart(2, '0');
        const mmStr = String(ClockPickerState.minute).padStart(2, '0');
        const formatted = `${hhStr}:${mmStr}`;
        const geom = getAnalogClockGeometry();

        const btnH = document.getElementById('clock-btn-hour');
        const btnM = document.getElementById('clock-btn-minute');
        if (btnH) btnH.textContent = hhStr;
        if (btnM) btnM.textContent = mmStr;

        const line = document.getElementById('clock-hand-line');
        const tip = document.getElementById('clock-hand-tip');
        const fineDot = document.getElementById('clock-hand-finedot');
        if (line) {
          line.setAttribute('x2', geom.x.toFixed(1));
          line.setAttribute('y2', geom.y.toFixed(1));
          line.setAttribute('stroke', geom.handColor);
        }
        if (tip) {
          tip.setAttribute('cx', geom.x.toFixed(1));
          tip.setAttribute('cy', geom.y.toFixed(1));
          tip.setAttribute('r', String(geom.tipRadius));
          tip.setAttribute('fill', geom.handColor);
        }
        if (fineDot) {
          fineDot.setAttribute('cx', geom.x.toFixed(1));
          fineDot.setAttribute('cy', geom.y.toFixed(1));
          fineDot.style.display = geom.showFineDot ? 'block' : 'none';
        }

        const nums = document.getElementById('analog-clock-numbers');
        if (nums) nums.innerHTML = renderAnalogClockNumbersHtml();

        const confirmBtn = document.getElementById('clock-confirm-btn');
        if (confirmBtn) confirmBtn.textContent = `Terapkan (${formatted} WIB)`;

        const warnEl = document.getElementById('clock-validation-msg');
        if (warnEl) {
          const invalid = ClockPickerState.field === 'jam_selesai' && formatted <= AppState.bookingForm.jam_mulai;
          warnEl.classList.toggle('hidden', !invalid);
        }
      }

      function computeAnalogClockFromPointer(faceEl, clientX, clientY) {
        const rect = faceEl.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        const deg = (Math.atan2(dy, dx) * (180 / Math.PI) + 90 + 360) % 360;

        if (ClockPickerState.mode === 'hour') {
          const sector = Math.round(deg / 30) % 12;
          const isInner = dist < rect.width * 0.315;
          ClockPickerState.hour = isInner ? (sector === 0 ? 0 : sector + 12) : (sector === 0 ? 12 : sector);
        } else {
          ClockPickerState.minute = Math.round(deg / 6) % 60;
        }
        updateAnalogClockDomLive();
      }

      function bindAnalogClockPointerEvents() {
        const face = document.getElementById('analog-clock-face');
        if (!face) return;

        face.addEventListener('pointerdown', (e) => {
          ClockPickerState.isDragging = true;
          if (face.setPointerCapture) {
            try { face.setPointerCapture(e.pointerId); } catch (_) {}
          }
          computeAnalogClockFromPointer(face, e.clientX, e.clientY);
        });

        face.addEventListener('pointermove', (e) => {
          if (!ClockPickerState.isDragging) return;
          computeAnalogClockFromPointer(face, e.clientX, e.clientY);
        });

        const endDrag = (e) => {
          if (!ClockPickerState.isDragging) return;
          ClockPickerState.isDragging = false;
          if (face.releasePointerCapture) {
            try { face.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          // Otomatis berpindah dari mode Jam -> Menit agar pengisian cepat 2 ketukan
          if (ClockPickerState.mode === 'hour') {
            setTimeout(() => {
              if (document.getElementById('analog-clock-face')) {
                ClockPickerState.mode = 'minute';
                renderAnalogClockModal();
              }
            }, 170);
          }
        };

        face.addEventListener('pointerup', endDrag);
        face.addEventListener('pointercancel', endDrag);
      }

      function handleAdminPinDigit(digit) {
        if (!AdminPinModalState.open || !/^\d$/.test(digit)) return;
        if (AdminPinModalState.digits.length >= 6) return;
        AdminPinModalState.error = '';
        AdminPinModalState.digits += digit;
        renderAdminPinModal(false);

        if (AdminPinModalState.digits.length === 6) {
          const entered = AdminPinModalState.digits;
          setTimeout(() => {
            if (!AdminPinModalState.open) return;
            const res = AdminAuth.verifyPin(entered);
            if (res.ok) {
              const cb = AdminPinModalState.onSuccess;
              closeAdminPinModal();
              if (typeof cb === 'function') cb();
            } else {
              AdminPinModalState.digits = '';
              AdminPinModalState.error = res.message;
              renderAdminPinModal(true);
            }
          }, 90);
        }
      }

      function previewTripDistance(startKm, endVal, targetServiceKm) {
        const el = document.getElementById('trip-distance-preview');
        if (!el) return;
        const endNum = Number(endVal) || 0;
        const dist = endNum - startKm;
        if (dist < 0) {
          el.className = 'mt-2 text-xs font-bold text-rose-600 tabular-nums';
          el.textContent = 'KM Akhir tidak boleh lebih kecil dari KM Awal.';
          return;
        }
        const remService = targetServiceKm - endNum;
        let extra = '';
        if (targetServiceKm > 0 && remService <= 500) {
          extra = ` · ⚠ Sisa ${formatNumberID(Math.max(0, remService))} km menuju target service (akan memicu Alert Service!)`;
          el.className = 'mt-2 text-xs font-bold text-amber-700 tabular-nums';
        } else {
          el.className = 'mt-2 text-xs font-semibold text-emerald-700 tabular-nums';
        }
        el.textContent = `Jarak tempuh perjalanan: +${formatNumberID(dist)} km${extra}`;
      }

      function renderRatingStarsButtons(selected) {
        return [1, 2, 3, 4, 5].map((n) => `
          <button
            type="button"
            onclick="App.setRatingStars(${n})"
            class="text-3xl sm:text-4xl leading-none transition transform hover:scale-110 ${n <= selected ? 'text-amber-400' : 'text-slate-200'}"
            aria-label="${n} Bintang"
          >★</button>
        `).join('');
      }

      function renderRatingTagButtons() {
        return RATING_QUICK_TAGS.map((tag) => {
          const active = RatingModalState.tags.includes(tag);
          return `
            <button
              type="button"
              onclick="App.toggleRatingTag('${escapeHtml(tag)}')"
              class="px-3 py-1.5 rounded-full text-xs font-semibold border transition ${
                active
                  ? 'bg-[#0B3B60] text-white border-[#0B3B60]'
                  : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-[#0B3B60]'
              }"
            >
              ${active ? '✓ ' : ''}${escapeHtml(tag)}
            </button>
          `;
        }).join('');
      }

      /* ======================================================================
       * 13. EKSPOR LAPORAN RESMI BULANAN (EXCEL .XLS & CSV BERKOP KPWBI JATENG)
       * ====================================================================== */
      function exportMonthlyReport(format = 'xls') {
        const month = AppState.adminFilters.expenseMonth === 'ALL'
          ? getTodayWibISO().slice(0, 7)
          : AppState.adminFilters.expenseMonth;
        const periodLabel = formatBulanIndo(month);
        const generatedAt = formatTanggalIndo(getTodayWibISO(), true) + ', ' + formatNowClockWIB();

        const exps = AppState.data.expenses.filter((e) => AppState.adminFilters.expenseMonth === 'ALL' || String(e.tanggal_waktu || '').startsWith(month));
        const bkgs = AppState.data.bookings.filter((b) => AppState.adminFilters.expenseMonth === 'ALL' || String(b.tanggal || '').startsWith(month));
        const totalBBM = exps.filter((e) => e.jenis_biaya === 'BBM').reduce((s, e) => s + (Number(e.nominal) || 0), 0);
        const totalEtoll = exps.filter((e) => e.jenis_biaya === 'ETOLL').reduce((s, e) => s + (Number(e.nominal) || 0), 0);

        if (format === 'csv') {
          const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
          const rows = [
            ['BANK INDONESIA'],
            ['KANTOR PERWAKILAN PROVINSI JAWA TENGAH'],
            ['Jl. Imam Bardjo SH No. 4, Semarang — Fungsi Logistik & Pengelolaan Aset'],
            [`LAPORAN OPERASIONAL KENDARAAN DINAS, BBM & E-TOLL — PERIODE: ${periodLabel.toUpperCase()}`],
            [`Dicetak: ${generatedAt}`],
            [],
            ['RINGKASAN PENGELUARAN', 'NOMINAL (IDR)'],
            ['Total Pengeluaran BBM', totalBBM],

      function triggerDownload(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);

      document.addEventListener('keydown', (e) => {
        if (AdminPinModalState.open) {
          if (/^\d$/.test(e.key)) {
            e.preventDefault();
            handleAdminPinDigit(e.key);
            return;
          }
          if (e.key === 'Backspace') {
            e.preventDefault();
            if (AdminPinModalState.digits.length > 0) {
              AdminPinModalState.digits = AdminPinModalState.digits.slice(0, -1);
              AdminPinModalState.error = '';
              renderAdminPinModal(false);
            }
            return;
          }
          if (e.key === 'Escape') {
            e.preventDefault();
            closeAdminPinModal();
            return;
          }
        }
        if (e.key !== 'Escape') return;
        const picker = document.getElementById('picker-root');
        if (picker && picker.innerHTML.trim()) {
          closePicker();
        } else if (mobileDrawerOpen) {
          closeMobileDrawer();
        } else {
          closeModal();
        }
      });

            openAdminPinModal(() => {

              AppState.session = {

                nama: adminName,

                role: 'admin',

              };

              AppState.bookingForm.nama_peminjam = adminName;
              AppState.bookingForm.unit_kerja = UNIT_KERJA_LIST.includes(adminUnit) ? adminUnit : 'Fungsi Logistik & SDM';

        submitAdminForm(e) {

          const identifier = document.getElementById('adm-identifier').value.trim();
          const nama = document.getElementById('adm-name').value.trim();
          const unit = document.getElementById('adm-unit').value.trim() || 'Fungsi Logistik & Pengelolaan Aset';

          if (!identifier || !nama) {
            showToast('Data Belum Lengkap', 'NIP/Email dan Nama Lengkap wajib diisi.', 'warning');
            return;
          }
          if (AdminAuth.findAdminByIdentifier(identifier)) {
            showToast('Sudah Terdaftar', `Akun "${identifier}" sudah ada di Daftar Admin Logistik.`, 'warning');
            return;
          }

          const newAdmin = {
            id: generateId('adm'),
            identifier,
            nama,
            unit,
            isPrimary: false
          };

          AdminAuth.saveAdminList([...AppState.adminList, newAdmin]);
          SyncEngine.persistAndBroadcast('UPSERT_ADMIN', { identifier: newAdmin.identifier });
          SyncEngine.postToGAS('UPSERT_ADMIN', newAdmin);

          closeModal();
          renderAll();
          showToast('Admin Ditambahkan', `${nama} (${identifier}) kini memiliki akses Admin Logistik.`, 'success');

        deleteAdminAccount(adminId) {
          const target = AppState.adminList.find((a) => a.id === adminId);
          if (!target) return;
          if (target.isPrimary) {
            showToast('Tidak Diizinkan', 'Akun Admin Utama tidak dapat dihapus.', 'warning');
            return;
          }
          if (!confirm(`Hapus akses Admin Logistik untuk ${target.nama} (${target.identifier})?`)) return;

          const updated = AppState.adminList.filter((a) => a.id !== adminId);
          AdminAuth.saveAdminList(updated);
          SyncEngine.persistAndBroadcast('DELETE_ADMIN', { id: target.id, identifier: target.identifier });
          SyncEngine.postToGAS('DELETE_ADMIN', { id: target.id, identifier: target.identifier });

          renderAll();
