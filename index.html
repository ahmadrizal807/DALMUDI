      /**
       * Logika Peringatan Otomatis Jadwal Service (PRD Seksi 4.4):
       * Alert aktif jika (Target_KM_Service - Odometer_Saat_Ini) <= 500 km
       * ATAU tanggal service berikutnya tinggal <= 7 hari.
       */
      function getVehicleServiceHealth(v) {
        const currentKm = Number(v.odometer_saat_ini) || 0;
        const targetKm = Number(v.target_km_service) || 10000;
        const remainingKm = targetKm - currentKm;
        const daysLeft = diffDaysFromToday(v.tanggal_service_berikutnya);
        const intervalBase = Math.max(0, targetKm - 10000);
        const progressRaw = ((currentKm - intervalBase) / 10000) * 100;
        const progressPct = Math.max(0, Math.min(100, Math.round(progressRaw)));
        const needsService = remainingKm <= 500 || daysLeft <= 7;
        const isOverdue = remainingKm <= 0 || daysLeft < 0;

        let reason = '';
        if (remainingKm <= 500 && daysLeft <= 7) {
          reason = `Sisa ${formatNumberID(Math.max(0, remainingKm))} km & ${Math.max(0, daysLeft)} hari`;
        } else if (remainingKm <= 500) {
          reason = remainingKm <= 0 ? `Melewati batas ${formatNumberID(Math.abs(remainingKm))} km` : `Sisa ${formatNumberID(remainingKm)} km lagi`;
        } else if (daysLeft <= 7) {
          reason = daysLeft < 0 ? `Lewat ${Math.abs(daysLeft)} hari` : `Tinggal ${daysLeft} hari lagi`;
        } else {
          reason = `Sisa ${formatNumberID(remainingKm)} km`;
        }

        return {
          currentKm,
          targetKm,
          remainingKm,
          daysLeft,
          progressPct,
          needsService,
          isOverdue,
          reason
        };
      }

      /**
       * Deteksi konflik jadwal anti-double-booking untuk kendaraan & driver
       * (mendukung peminjaman 1 hari maupun multi-hari)
       */
      function formatConflictTimeSummary(conflict, reqStartDate, reqEndDate) {
        const cStart = String(conflict.tanggal || '').slice(0, 10);
        const cEnd = getBookingEndDate(conflict);
        const isMulti = cEnd > cStart || reqEndDate > reqStartDate || cStart !== reqStartDate;
        if (isMulti) {
          const datePart = cEnd > cStart
            ? `${formatTanggalSingkatIndo(cStart)}–${formatTanggalSingkatIndo(cEnd)}`
            : formatTanggalSingkatIndo(cStart);
          return `${datePart}, ${conflict.jam_mulai}–${conflict.jam_selesai} WIB`;
        }
        return `${conflict.jam_mulai}–${conflict.jam_selesai} WIB`;
      }

      function isBookingBlockingSchedule(b) {
        return Boolean(b && b.status !== 'COMPLETED' && b.status !== 'CANCELLED');
      }

      function reconcileFleetAndDriverStatuses(vehicleIds = [], driverIds = []) {
        const vehicleUpdates = [];
        const driverUpdates = [];

        [...new Set(vehicleIds.filter(Boolean))].forEach((vid) => {
          const v = getVehicleById(vid);
          if (!v || v.status === 'MAINTENANCE') return;
          const hasOnTrip = AppState.data.bookings.some((x) => x.vehicle_id === v.id && x.status === 'ON_TRIP');
          const nextStatus = hasOnTrip ? 'ON_TRIP' : 'READY';
          if (v.status !== nextStatus) {
            v.status = nextStatus;
            vehicleUpdates.push({ id: v.id, status: v.status });
          }
        });

        [...new Set(driverIds.filter(Boolean))].forEach((did) => {
          const d = getDriverById(did);
          if (!d || d.status === 'OFF') return;
          const hasOnTrip = AppState.data.bookings.some((x) => x.driver_id === d.id && x.status === 'ON_TRIP');
          const nextStatus = hasOnTrip ? 'ON_DUTY' : 'AVAILABLE';
          if (d.status !== nextStatus) {
            d.status = nextStatus;
            driverUpdates.push({ id: d.id, status: d.status });
          }
        });

        return { vehicleUpdates, driverUpdates };
      }

      function getVehicleAvailability(vehicle, tanggalMulai, tanggalSelesai, jamMulai, jamSelesai, excludeBookingId = '') {
        if (vehicle.status === 'MAINTENANCE') {
          return { available: false, reason: 'Sedang Perawatan / Bengkel', badgeType: 'MAINTENANCE', conflictBooking: null };
        }

        // Kompatibilitas bila dipanggil dengan 4 parameter (tanggal, jamMulai, jamSelesai)
        let effEnd = tanggalSelesai;
        let effStartTime = jamMulai;
        let effEndTime = jamSelesai;
        if (jamSelesai === undefined) {
          effEnd = tanggalMulai;
          effStartTime = tanggalSelesai;
          effEndTime = jamMulai;
        }
        if (!effEnd || effEnd < tanggalMulai) effEnd = tanggalMulai;

        const conflict = AppState.data.bookings.find((b) =>
          b.id !== excludeBookingId &&
          b.vehicle_id === vehicle.id &&
          isBookingBlockingSchedule(b) &&
          isDateTimeRangeOverlap(b.tanggal, getBookingEndDate(b), b.jam_mulai, b.jam_selesai, tanggalMulai, effEnd, effStartTime, effEndTime)
        );

        if (conflict) {
          const timeText = formatConflictTimeSummary(conflict, tanggalMulai, effEnd);
          const label = conflict.status === 'ON_TRIP'
            ? `Sedang Dinas (${timeText})`
            : `Terjadwal (${timeText})`;
          return { available: false, reason: label, badgeType: conflict.status === 'ON_TRIP' ? 'ON_TRIP' : 'BOOKED', conflictBooking: conflict };
        }

        return { available: true, reason: 'Tersedia', badgeType: 'READY', conflictBooking: null };
      }

      function getDriverAvailability(driver, tanggalMulai, tanggalSelesai, jamMulai, jamSelesai, excludeBookingId = '') {
        if (driver.status === 'OFF') {
          return { available: false, reason: 'Sedang Off / Tidak Bertugas', badgeType: 'OFF', conflictBooking: null };
        }

        let effEnd = tanggalSelesai;
        let effStartTime = jamMulai;
        let effEndTime = jamSelesai;
        if (jamSelesai === undefined) {
          effEnd = tanggalMulai;
          effStartTime = tanggalSelesai;
          effEndTime = jamMulai;
        }
        if (!effEnd || effEnd < tanggalMulai) effEnd = tanggalMulai;

        const conflict = AppState.data.bookings.find((b) =>
          b.id !== excludeBookingId &&
          b.driver_id === driver.id &&
          isBookingBlockingSchedule(b) &&
          isDateTimeRangeOverlap(b.tanggal, getBookingEndDate(b), b.jam_mulai, b.jam_selesai, tanggalMulai, effEnd, effStartTime, effEndTime)
        );

        if (conflict) {
          const timeText = formatConflictTimeSummary(conflict, tanggalMulai, effEnd);
          const label = conflict.status === 'ON_TRIP'
            ? `Sedang Bertugas (${timeText})`
            : `Terjadwal (${timeText})`;
          return { available: false, reason: label, badgeType: 'ON_DUTY', conflictBooking: conflict };
        }

        return { available: true, reason: 'Tersedia', badgeType: 'AVAILABLE', conflictBooking: null };
      }

      function isBookingOwnedByCurrentSession(b) {
        const sess = AppState.session;
        if (!b || !sess || !sess.isAuthenticated || !String(sess.nama || '').trim()) return false;
        const sessName = String(sess.nama).trim().toLowerCase();
        const bookingName = String(b.nama_peminjam || '').trim().toLowerCase();
        if (!bookingName || bookingName !== sessName) return false;
        const ownerId = String(b.peminjam_id || '').trim().toLowerCase();
        const sessId = String(sess.email || sess.nip || '').trim().toLowerCase();
        if (ownerId && sessId && ownerId !== sessId) return false;
        return true;
      }

      function getPendingRatingBookings() {
        return AppState.data.bookings.filter((b) => b.status === 'COMPLETED' && !b.rating && isBookingOwnedByCurrentSession(b));
      }

      function getMonthlyKPIs() {
        const currentMonth = getTodayWibISO().slice(0, 7);
        const vehicles = AppState.data.vehicles;
        const readyCount = vehicles.filter((v) => v.status === 'READY').length;
        const onTripCount = vehicles.filter((v) => v.status === 'ON_TRIP').length;
        const maintenanceCount = vehicles.filter((v) => v.status === 'MAINTENANCE').length;
        const serviceAlertUnits = vehicles.filter((v) => getVehicleServiceHealth(v).needsService);

        const monthExpenses = AppState.data.expenses.filter((e) => String(e.tanggal_waktu || '').startsWith(currentMonth));
        const totalBBM = monthExpenses.filter((e) => e.jenis_biaya === 'BBM').reduce((acc, e) => acc + (Number(e.nominal) || 0), 0);
        const totalEtoll = monthExpenses.filter((e) => e.jenis_biaya === 'ETOLL').reduce((acc, e) => acc + (Number(e.nominal) || 0), 0);

        return {
          currentMonth,
          totalVehicles: vehicles.length,
          readyCount,
          onTripCount,
          maintenanceCount,
          serviceAlertCount: serviceAlertUnits.length,
          serviceAlertUnits,
          totalBBM,
          totalEtoll,
          totalExpenses: totalBBM + totalEtoll
        };
      }

      // Set favicon tab browser dengan logo resmi Bank Indonesia
      (function applyBIFavicon() {
        try {

            link.rel = 'icon';

      /** Circular SVG Telemetry Gauge (Speedometer / Service / Rating Ring) */
      function renderTelemetryGaugeSvg(percent, valueText, subLabel, strokeColor = '#0EA5E9', trackColor = 'rgba(255,255,255,0.14)', darkText = false) {
        const clamped = Math.max(0, Math.min(100, Number(percent) || 0));
        const r = 28;
        const circ = 2 * Math.PI * r;
        const dashOffset = circ * (1 - clamped / 100);
        return `
          <div class="relative w-20 h-20 flex items-center justify-center shrink-0">
            <svg viewBox="0 0 72 72" class="w-full h-full -rotate-90" aria-hidden="true">
              <circle cx="36" cy="36" r="${r}" fill="none" stroke="${trackColor}" stroke-width="6" />
              <circle
                cx="36" cy="36" r="${r}"
                fill="none"
                stroke="${strokeColor}"
                stroke-width="6"
                stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(1)}"
                stroke-dashoffset="${dashOffset.toFixed(1)}"
              />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center leading-none">
              <span class="font-sport text-sm font-bold tabular-nums ${darkText ? 'text-slate-900' : 'text-white'}">${escapeHtml(valueText)}</span>
              ${subLabel ? `<span class="text-[9px] font-bold uppercase tracking-wider mt-0.5 ${darkText ? 'text-slate-500' : 'text-blue-200/80'}">${escapeHtml(subLabel)}</span>` : ''}
            </div>
          </div>
        `;
      }

      /** Toast Notification */
      function showToast(title, message, variant = 'info') {
        const root = document.getElementById('toast-root');
        if (!root) return;

        const styles = {
          success: { border: 'border-emerald-200', icon: 'check-circle-2', iconColor: 'text-emerald-600', bg: 'bg-white' },
          warning: { border: 'border-amber-200', icon: 'alert-triangle', iconColor: 'text-amber-600', bg: 'bg-white' },
          error: { border: 'border-rose-200', icon: 'x-circle', iconColor: 'text-rose-600', bg: 'bg-white' },
          info: { border: 'border-blue-200', icon: 'info', iconColor: 'text-[#1D4ED8]', bg: 'bg-white' }
        }[variant] || { border: 'border-slate-200', icon: 'info', iconColor: 'text-[#0B3B60]', bg: 'bg-white' };

        const toast = document.createElement('div');
        toast.className = `pointer-events-auto animate-toast ${styles.bg} border ${styles.border} rounded-xl shadow-soft p-3.5 flex items-start gap-3`;
        toast.innerHTML = `
          <i data-lucide="${styles.icon}" class="w-5 h-5 ${styles.iconColor} shrink-0 mt-0.5"></i>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-bold text-slate-900">${escapeHtml(title)}</div>
            <div class="text-xs text-slate-600 mt-0.5 leading-relaxed">${escapeHtml(message)}</div>
          </div>
          <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 p-0.5" aria-label="Tutup">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        `;
        root.appendChild(toast);
        if (window.lucide) lucide.createIcons({ nodes: [toast] });

        setTimeout(() => {
          toast.style.transition = 'opacity 0.25s ease';
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 260);
        }, 4200);
      }

      function syncMobileDrawerClasses() {
        const sidebar = document.getElementById('desktop-sidebar');

        const hamburger = document.getElementById('mobile-menu-btn');

        if (sidebar) {
          sidebar.classList.toggle('-translate-x-full', !mobileDrawerOpen);
          sidebar.classList.toggle('translate-x-0', mobileDrawerOpen);
        }
        if (backdrop) {
          backdrop.classList.toggle('opacity-0', !mobileDrawerOpen);
          backdrop.classList.toggle('pointer-events-none', !mobileDrawerOpen);
          backdrop.classList.toggle('opacity-100', mobileDrawerOpen);
          backdrop.classList.toggle('pointer-events-auto', mobileDrawerOpen);
          backdrop.setAttribute('aria-hidden', mobileDrawerOpen ? 'false' : 'true');
        }
        if (hamburger) {
          hamburger.setAttribute('aria-expanded', mobileDrawerOpen ? 'true' : 'false');
        }
        if (document.body && document.body.classList) {
          document.body.classList.toggle('overflow-hidden', mobileDrawerOpen);
        }

      // Secret Trigger 1: Tap / Klik Logo & Judul "DALMUDI" 5x dalam < 3 detik
      const BrandTapTracker = {
        timestamps: [],
        singleTapTimer: null
      };

      function handleBrandLogoTap() {
        const now = Date.now();
        // Simpan hanya klik dalam jendela waktu < 3000 ms (3 detik)
        BrandTapTracker.timestamps = BrandTapTracker.timestamps.filter((t) => now - t < 3000);
        BrandTapTracker.timestamps.push(now);

        if (BrandTapTracker.singleTapTimer) {
          clearTimeout(BrandTapTracker.singleTapTimer);
          BrandTapTracker.singleTapTimer = null;
        }

        if (BrandTapTracker.timestamps.length >= 5) {
          BrandTapTracker.timestamps = [];
          closeMobileDrawer();
          if (AppState.role === 'admin') {
            showToast('Mode Admin Aktif', 'Anda sudah berada di dashboard Admin Logistik.', 'info');
            return;
          }
          // Selalu validasi lewat pop-up PIN Admin saat dipicu oleh secret trigger
          openAdminPinModal(() => {
            const primary = AppState.adminList.find((a) => a.isPrimary) || DEFAULT_PRIMARY_ADMIN;
            if (!AdminAuth.findAdminByIdentifier(AppState.session.nip || AppState.session.email)) {
              AppState.session = {
                nip: primary.identifier,
                email: primary.isPrimary ? '' : (primary.identifier.includes('@') ? primary.identifier : ''),
                nama: primary.nama,
                unit_kerja: primary.unit,
                role: 'admin',
                driver_id: null,
                isAuthenticated: true

            }
            AppState.role = 'admin';
            AppState.activeNav = ROLE_NAVS.admin[0].id;
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('Mode Admin Aktif', `Verifikasi PIN berhasil. Masuk sebagai ${AppState.session.nama}.`, 'success');
          });
          return;
        }

        // Klik 1x normal: kembali ke Beranda Pegawai (debounce 260ms agar tap cepat 5x tidak terganggu re-render)
        BrandTapTracker.singleTapTimer = setTimeout(() => {
          BrandTapTracker.singleTapTimer = null;
          if (BrandTapTracker.timestamps.length === 1) {
            if (AppState.role !== 'admin') {
              if (AppState.role !== 'pegawai' || AppState.activeNav !== 'beranda') {
                switchRole('pegawai', 'beranda');
              } else {
                closeMobileDrawer();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            } else {
              switchNav('dashboard');
            }
          }
        }, 260);
      }

      /** Modul 4.1: Wizard Peminjaman Kendaraan Anti-Bentrok (3 Langkah — 1 Hari & Multi-Hari) */
      function renderPegawaiBookingWizard() {
        const bf = AppState.bookingForm;
        const tglSelesai = bf.tanggal_selesai && bf.tanggal_selesai >= bf.tanggal ? bf.tanggal_selesai : bf.tanggal;
        if (bf.tanggal_selesai !== tglSelesai) bf.tanggal_selesai = tglSelesai;
        const dayCount = getBookingDayCount(bf.tanggal, tglSelesai);
        const isMultiDay = dayCount > 1;
        const isPastStart = isStartDateTimeInPast(bf.tanggal, bf.jam_mulai);
        const validRange = isBookingTimeRangeValid(bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai);
        const validTime = validRange && !isPastStart;

        // Evaluasi ketersediaan real-time berdasarkan rentang tanggal & jam
        const vehicleStatuses = AppState.data.vehicles.map((v) => ({
          vehicle: v,
          avail: validTime ? getVehicleAvailability(v, bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai) : { available: false, reason: 'Atur jadwal valid', badgeType: 'OFF' },
          health: getVehicleServiceHealth(v)
        }));
        const readyVehCount = vehicleStatuses.filter((x) => x.avail.available).length;

        const driverStatuses = AppState.data.drivers.map((d) => ({
          driver: d,
          avail: validTime ? getDriverAvailability(d, bf.tanggal, tglSelesai, bf.jam_mulai, bf.jam_selesai) : { available: false, reason: 'Atur jadwal valid', badgeType: 'OFF' }
        }));
        const readyDrvCount = driverStatuses.filter((x) => x.avail.available).length;

        // Normalisasi & sinkronisasi pilihan multi-armada & penugasan driver (1 atau >1 unit untuk acara kedinasan)
        if (!Array.isArray(bf.vehicle_ids)) bf.vehicle_ids = bf.vehicle_id ? [bf.vehicle_id] : [];
        if (!bf.driver_assignments || typeof bf.driver_assignments !== 'object') bf.driver_assignments = {};
        if (bf.vehicle_id && bf.vehicle_ids.length === 0) bf.vehicle_ids = [bf.vehicle_id];
        if (bf.vehicle_id && bf.driver_id && !bf.driver_assignments[bf.vehicle_id]) {
          bf.driver_assignments[bf.vehicle_id] = bf.driver_id;
        }

        // Pastikan pilihan lama tidak bentrok bila tanggal/jam baru diubah
        const availVehIdSet = new Set(vehicleStatuses.filter((x) => x.avail.available).map((x) => x.vehicle.id));
        const availDrvIdSet = new Set(driverStatuses.filter((x) => x.avail.available).map((x) => x.driver.id));
        bf.vehicle_ids = [...new Set(bf.vehicle_ids)].filter((vid) => availVehIdSet.has(vid));

        const cleanAssignments = {};
        const seenDrivers = new Set();
        bf.vehicle_ids.forEach((vid) => {
          const did = bf.driver_assignments[vid];
          if (did && availDrvIdSet.has(did) && !seenDrivers.has(did)) {
            cleanAssignments[vid] = did;
            seenDrivers.add(did);
          }
        });
        bf.driver_assignments = cleanAssignments;
        bf.vehicle_id = bf.vehicle_ids[0] || '';
        bf.driver_id = bf.vehicle_id ? (bf.driver_assignments[bf.vehicle_id] || '') : '';
        if (!bf.vehicle_ids.includes(bf.activeAssignVehicleId)) {
          bf.activeAssignVehicleId = bf.vehicle_ids.find((vid) => !bf.driver_assignments[vid]) || bf.vehicle_ids[0] || '';
        }

        const selectedVehicles = bf.vehicle_ids.map((vid) => getVehicleById(vid)).filter(Boolean);
        const isMultiVehicle = selectedVehicles.length > 1;
        const totalSelectedSeats = selectedVehicles.reduce((sum, v) => sum + (Number(v.kapasitas) || 0), 0);
        const assignedDriverCount = selectedVehicles.filter((v) => Boolean(bf.driver_assignments[v.id])).length;
        const allDriversAssigned = selectedVehicles.length > 0 && assignedDriverCount === selectedVehicles.length;

        const selectedVeh = selectedVehicles[0] || null;
        const selectedDrv = selectedVeh ? getDriverById(bf.driver_assignments[selectedVeh.id]) : null;
        const step1Sub = validTime
          ? (isMultiDay ? `${dayCount} Hari · ${formatTanggalSingkatIndo(bf.tanggal)}–${formatTanggalSingkatIndo(tglSelesai)}` : `${bf.jam_mulai}–${bf.jam_selesai}`)
          : 'Isi Jadwal';
        const step2Sub = selectedVehicles.length === 0
          ? `${readyVehCount} Ready`
          : selectedVehicles.length === 1
            ? selectedVehicles[0].plat_nomor
            : `${selectedVehicles.length} Unit Dipilih`;
        const step3Sub = selectedVehicles.length <= 1
          ? (selectedDrv ? selectedDrv.nama.split(' ')[0] : `${readyDrvCount} Ready`)
          : `${assignedDriverCount}/${selectedVehicles.length} Driver`;
        const durationLabel = calcDurationLabel(bf.jam_mulai, bf.jam_selesai, bf.tanggal, tglSelesai);

        return `
          <div class="space-y-5">
            <!-- Header & Stepper Anti-Bentrok -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-card">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-3">
                <div class="min-w-0">
                  <h2 class="text-base sm:text-lg font-extrabold text-[#0B3B60] leading-snug">Pengajuan Peminjaman Kendaraan Dinas</h2>
                  <p class="text-xs text-slate-500 mt-0.5">Mendukung peminjaman 1 atau lebih kendaraan sekaligus (acara kedinasan) serta harian/multi-hari anti-bentrok.</p>
                </div>
                <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#EFF6FF] text-[#1D4ED8] text-[11px] sm:text-xs font-bold tabular-nums self-start sm:self-auto">
                  <i data-lucide="shield-check" class="w-4 h-4 shrink-0"></i>
                  <span>${readyVehCount}/${AppState.data.vehicles.length} Mobil · ${readyDrvCount}/${AppState.data.drivers.length} Driver Ready</span>
                </div>
              </div>

              <!-- Stepper Bar (Mobile-Compact tanpa Terpotong) -->
              <div class="mt-4 sm:mt-5 grid grid-cols-3 gap-2 sm:gap-4">
                ${[
                  { n: 1, title: 'Waktu & Detail', mobileTitle: 'Waktu', sub: step1Sub },
                  { n: 2, title: 'Pilih Armada', mobileTitle: 'Armada', sub: step2Sub },
                  { n: 3, title: 'Pilih Driver & Ajukan', mobileTitle: 'Driver', sub: step3Sub }
                ].map((s) => {
                  const isCurrent = bf.step === s.n;
                  const isDone = (s.n === 1 && validTime && bf.nama_peminjam && bf.unit_kerja && bf.tujuan) ||
                                 (s.n === 2 && selectedVehicles.length > 0) ||
                                 (s.n === 3 && allDriversAssigned);
                  return `
                    <button
                      onclick="App.setBookingStep(${s.n})"
                      class="p-2.5 sm:p-3 rounded-xl border transition text-center sm:text-left min-w-0 ${
                        isCurrent
                          ? 'bg-[#0B3B60] text-white border-[#0B3B60] shadow-sm'
                          : isDone
                            ? 'bg-[#ECFDF5] text-slate-900 border-emerald-200 hover:border-emerald-300'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                      }"
                    >
                      <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-2">
                        <span class="w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center shrink-0 tabular-nums ${
                          isCurrent ? 'bg-white text-[#0B3B60]' : isDone ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'
                        }">
                          ${isDone && !isCurrent ? '✓' : s.n}
                        </span>
                        <span class="text-[11px] sm:text-sm font-bold leading-tight truncate max-w-full">
                          <span class="sm:hidden">${s.mobileTitle}</span>
                          <span class="hidden sm:inline">${s.title}</span>
                        </span>
                      </div>
                      <div class="mt-1 sm:pl-8 text-[10px] sm:text-[11px] truncate tabular-nums ${isCurrent ? 'text-blue-200' : 'text-slate-500'}">${escapeHtml(s.sub)}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- STEP 1: Penentuan Waktu & Detail Dinas -->
            ${bf.step === 1 ? `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-card space-y-5">
                <div class="flex flex-wrap items-center justify-between gap-2.5 border-b border-slate-100 pb-3.5">
                  <div class="flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-xl bg-[#0B3B60]/10 text-[#0B3B60] flex items-center justify-center font-extrabold text-sm">1</span>
                    <div>
                      <h3 class="text-sm sm:text-base font-extrabold text-slate-900">Waktu Pemakaian &amp; Detail Dinas</h3>
                      <p class="text-xs text-slate-500">Pilih tanggal 1 hari atau rentang multi-hari untuk cek ketersediaan armada real-time.</p>
                    </div>
                  </div>
                  <span class="sport-skew-badge px-2.5 py-1 rounded-lg font-sport text-[11px] font-bold uppercase tracking-wider tabular-nums ${
                    isMultiDay

                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[11px] font-extrabold uppercase tracking-wide text-slate-500 mr-1">Lama Pakai:</span>
                    ${[1, 2, 3, 4, 5].map((dNum) => {
                      const active = dayCount === dNum;
                      return `
                        <button

                          onclick="App.setBookingDurationDays(${dNum})"

                  </div>
                  <button

                  >
                    <i data-lucide="calendar-range" class="w-3.5 h-3.5"></i>
                    <span>Pilih Rentang di Kalender</span>
                  </button>
                </div>

                <!-- Baris Waktu Berangkat & Estimasi Kembali (Tanggal dalam Huruf + Jam Analog 24-Jam WIB) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <!-- Panel Berangkat -->
                  <div class="rounded-xl border border-slate-200 border-l-4 border-l-[#0B3B60] bg-slate-50/60 p-3.5 sm:p-4 space-y-3">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-[11px] font-sport font-bold uppercase tracking-wider text-[#0B3B60] flex items-center gap-1.5">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                        <span>Jadwal Berangkat</span>
                      </span>
                      <span class="text-[11px] font-semibold text-slate-500">${escapeHtml(formatRelativeDateLabel(bf.tanggal))}</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                      <div class="sm:col-span-3">
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Tanggal Berangkat</label>
                        <button
                          type="button"
                          onclick="App.openBookingDatePicker('start')"
                          class="w-full px-3 py-2.5 rounded-xl border ${bf.tanggal < getTodayWibISO() ? 'border-rose-400 bg-rose-50/40' : 'border-slate-300 bg-white hover:border-[#0B3B60]'} focus:border-[#0B3B60] focus:ring-2 focus:ring-[#0B3B60]/15 outline-none text-left flex items-center justify-between gap-2 transition group"
                        >
                          <span class="text-xs sm:text-sm font-bold ${bf.tanggal < getTodayWibISO() ? 'text-rose-700' : 'text-slate-900'} truncate">${escapeHtml(formatTanggalIndo(bf.tanggal, true))}</span>
                          <span class="w-7 h-7 rounded-lg ${bf.tanggal < getTodayWibISO() ? 'bg-rose-100 text-rose-600' : 'bg-slate-100 group-hover:bg-[#0B3B60]/10 text-slate-500 group-hover:text-[#0B3B60]'} flex items-center justify-center shrink-0 transition">
                            <i data-lucide="calendar" class="w-4 h-4"></i>
                          </span>
                        </button>
                      </div>
                      <div class="sm:col-span-2">
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Jam Berangkat</label>
                        <button

                          onclick="App.openAnalogClockPicker('jam_mulai')"
                          class="w-full px-3 py-2.5 rounded-xl border ${isPastStart ? 'border-rose-400 bg-rose-50/40' : 'border-slate-300 bg-white hover:border-[#0B3B60]'} focus:border-[#0B3B60] focus:ring-2 focus:ring-[#0B3B60]/15 outline-none text-left flex items-center justify-between gap-1.5 transition group"
                        >
                          <span class="text-sm font-extrabold ${isPastStart ? 'text-rose-700' : 'text-slate-900'} tabular-nums">${escapeHtml(bf.jam_mulai)} <span class="text-[11px] font-semibold text-slate-500">WIB</span></span>
                          <span class="w-7 h-7 rounded-lg ${isPastStart ? 'bg-rose-100 text-rose-600' : 'bg-[#EFF6FF] group-hover:bg-[#0B3B60] text-[#1D4ED8] group-hover:text-white'} flex items-center justify-center shrink-0 transition">

                    <div class="flex items-center justify-between gap-2">
                      <span class="text-[11px] font-sport font-bold uppercase tracking-wider ${isMultiDay ? 'text-[#1D4ED8]' : 'text-slate-700'} flex items-center gap-1.5">

                      <span class="text-[11px] font-bold tabular-nums ${isMultiDay ? 'text-[#1D4ED8]' : 'text-slate-500'}">
                        ${isMultiDay ? `+${dayCount - 1} Hari dari berangkat` : 'Hari yang sama'}
                      </span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                      <div class="sm:col-span-3">

                    </p>
                  </div>

      function renderUnitDropdownItems(query) {
        const q = String(query || '').trim().toLowerCase();
        const filtered = UNIT_KERJA_LIST.filter((u) => u.toLowerCase().includes(q));
        if (filtered.length === 0) {
          return `<div class="px-3.5 py-2.5 text-xs text-slate-400">Unit kerja tidak ditemukan.</div>`;
        }
        return filtered.map((u) => {
          const selected = AppState.bookingForm.unit_kerja === u;
          return `
            <button
              type="button"
              onmousedown="App.selectUnitKerja('${escapeHtml(u)}')"
              class="w-full text-left px-3.5 py-2 text-xs sm:text-sm flex items-center justify-between gap-2 transition ${
                selected ? 'bg-[#EFF6FF] text-[#0B3B60] font-bold' : 'text-slate-700 hover:bg-slate-50'
              }"
            >
              <span>${escapeHtml(u)}</span>
              ${selected ? '<span class="text-[#1D4ED8] font-bold">✓</span>' : ''}
            </button>
          `;
        }).join('');
      }

      /** Modul 4.2: Tampilan Fokus Satu Layar (Driver Task Card — Khusus activeDriverId) */
      function renderDriverActiveTasks(driver) {
        const myTasks = AppState.data.bookings
          .filter((b) => b.driver_id === driver.id && isBookingBlockingSchedule(b))
          .sort((a, b) => (a.status === 'ON_TRIP' ? -1 : 1) - (b.status === 'ON_TRIP' ? -1 : 1));

        const primaryTask = myTasks[0];
        const queuedTasks = myTasks.slice(1);

        return `
          <div id="driver-active-tasks-section" class="space-y-5">
            ${primaryTask ? (() => {
              const veh = getVehicleById(primaryTask.vehicle_id);
              const vehHealth = veh ? getVehicleServiceHealth(veh) : null;
              const isOnTrip = primaryTask.status === 'ON_TRIP';

      /** Halaman Admin: Log Transaksi BBM & E-Toll Terpadu + Ekspor Laporan Resmi */
      function renderAdminExpensesReports() {
        const af = AppState.adminFilters;
        const availableMonths = Array.from(new Set([
          getTodayWibISO().slice(0, 7),
          ...AppState.data.expenses.map((e) => String(e.tanggal_waktu || '').slice(0, 7)).filter((m) => /^\d{4}-\d{2}$/.test(m))
        ])).sort().reverse();

      const DatePickerState = {
        mode: 'single', // 'single' | 'range'
        selectedIso: '',
        startIso: '',
        endIso: '',
        minIso: '', // Opsional: blokir pemilihan tanggal sebelum minIso
        phase: 'start', // 'start' | 'end' (khusus mode range)
        viewYear: 2026,
        viewMonth: 10, // 0-indexed (0=Jan .. 11=Des)
        title: 'Pilih Tanggal Pemakaian',

        onSelectRange: null

      function openDatePicker({ initialIso, startIso, endIso, minIso = '', mode = 'single', initialPhase = 'start', title, onSelect, onSelectRange }) {
        const isRange = mode === 'range';
        const today = getTodayWibISO();
        let sIso = /^\d{4}-\d{2}-\d{2}$/.test((isRange ? startIso : initialIso) || '') ? (isRange ? startIso : initialIso) : today;
        if (minIso && sIso < minIso) sIso = minIso;
        let eIso = /^\d{4}-\d{2}-\d{2}$/.test(endIso || '') ? endIso : sIso;
        if (eIso < sIso) eIso = sIso;

        const focusIso = isRange && initialPhase === 'end' ? eIso : sIso;
        const [y, m] = focusIso.split('-').map(Number);

        DatePickerState.mode = isRange ? 'range' : 'single';
        DatePickerState.selectedIso = sIso;
        DatePickerState.startIso = sIso;
        DatePickerState.endIso = eIso;
        DatePickerState.minIso = minIso || '';
        DatePickerState.phase = initialPhase === 'end' ? 'end' : 'start';
        DatePickerState.viewYear = y;
        DatePickerState.viewMonth = m - 1;
        DatePickerState.title = title || (isRange ? 'Pilih Rentang Tanggal Pemakaian' : 'Pilih Tanggal');
        DatePickerState.onSelect = onSelect || null;
        DatePickerState.onSelectRange = onSelectRange || null;
        renderDatePickerModal();
      }

      /* ----------------------------------------------------------------------
       * KOMPONEN 2: JAM ANALOG MODERN 24-JAM WIB (DRAG & TAP INTERAKTIF)
       * ---------------------------------------------------------------------- */
      const ClockPickerState = {
        field: 'jam_mulai',
        title: 'Pilih Jam Berangkat (WIB)',
        hour: 9,
        minute: 0,
        mode: 'hour', // 'hour' | 'minute'
        isDragging: false,
        onSelect: null,
        compareCtx: null, // { startDate, endDate, startTime }
        allowPast: false
      };

      function openAnalogClockPicker(fieldName, customOpts = null) {
        const raw = (customOpts && customOpts.initialTime)
          ? customOpts.initialTime
          : (AppState.bookingForm[fieldName] || (fieldName === 'jam_mulai' ? '09:00' : '14:00'));
        const [hh, mm] = String(raw).split(':').map((n) => parseInt(n, 10));
        ClockPickerState.field = fieldName;
        ClockPickerState.title = (customOpts && customOpts.title)
          ? customOpts.title
          : (fieldName === 'jam_mulai' ? 'Jam Berangkat (WIB)' : 'Estimasi Jam Kembali (WIB)');
        ClockPickerState.hour = isNaN(hh) ? 9 : Math.max(0, Math.min(23, hh));
        ClockPickerState.minute = isNaN(mm) ? 0 : Math.max(0, Math.min(59, mm));
        ClockPickerState.mode = 'hour';
        ClockPickerState.isDragging = false;
        ClockPickerState.onSelect = (customOpts && typeof customOpts.onSelect === 'function') ? customOpts.onSelect : null;
        ClockPickerState.compareCtx = (customOpts && customOpts.compareCtx) ? customOpts.compareCtx : null;
        ClockPickerState.allowPast = Boolean(customOpts && customOpts.allowPast);
        renderAnalogClockModal();
      }

      function getClockPickerValidationError(formatted) {
        const ctx = ClockPickerState.compareCtx || {
          startDate: AppState.bookingForm.tanggal,
          endDate: AppState.bookingForm.tanggal_selesai || AppState.bookingForm.tanggal,
          startTime: AppState.bookingForm.jam_mulai
        };
        if (ClockPickerState.field === 'jam_mulai' && !ClockPickerState.allowPast) {
          if (isStartDateTimeInPast(ctx.startDate, formatted)) {
            return `Jam berangkat sudah terlewat (sekarang ${getNowWibHHMM()} WIB). Pilih jam setelahnya atau ubah tanggal ke besok.`;
          }
        }
        if (ClockPickerState.field === 'jam_selesai') {
          const isSameDayClock = (ctx.endDate || ctx.startDate) <= ctx.startDate;
          if (!ClockPickerState.allowPast && isStartDateTimeInPast(ctx.endDate || ctx.startDate, formatted)) {
            return `Jam kembali sudah terlewat (sekarang ${getNowWibHHMM()} WIB).`;
          }
          if (isSameDayClock && formatted <= ctx.startTime) {
            return `Estimasi Jam Kembali harus lebih besar dari Jam Berangkat (${ctx.startTime} WIB).`;
          }
        }
        return '';
      }

      function buildClockTicksSvg() {
        const cx = 138;
        const cy = 138;
        let ticks = '';
        for (let i = 0; i < 60; i++) {
          const isMajor = i % 5 === 0;
          const angleRad = (i * 6 - 90) * (Math.PI / 180);
          const rOuter = 132;
          const rInner = isMajor ? 125 : 128;
          const x1 = (cx + rInner * Math.cos(angleRad)).toFixed(1);
          const y1 = (cy + rInner * Math.sin(angleRad)).toFixed(1);
          const x2 = (cx + rOuter * Math.cos(angleRad)).toFixed(1);
          const y2 = (cy + rOuter * Math.sin(angleRad)).toFixed(1);
          ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMajor ? '#94A3B8' : '#CBD5E1'}" stroke-width="${isMajor ? '1.8' : '1'}" stroke-linecap="round"/>`;
        }
        return ticks;
      }

      function getAnalogClockGeometry() {
        const cx = 138;
        const cy = 138;
        const R_OUTER = 104;
        const R_INNER = 67;

        if (ClockPickerState.mode === 'hour') {
          const h = ClockPickerState.hour;
          const isInner = h === 0 || h >= 13;
          const sector = h % 12; // 0 = 12/00
          const deg = sector * 30;
          const rad = (deg - 90) * (Math.PI / 180);
          const radius = isInner ? R_INNER : R_OUTER;
          return {
            cx,
            cy,
            x: cx + radius * Math.cos(rad),
            y: cy + radius * Math.sin(rad),
            tipRadius: isInner ? 17 : 20,
            handColor: isInner ? '#1D4ED8' : '#0B3B60',
            showFineDot: false
          };
        }

        const m = ClockPickerState.minute;
        const deg = m * 6;
        const rad = (deg - 90) * (Math.PI / 180);
        return {
          cx,
          cy,
          x: cx + R_OUTER * Math.cos(rad),
          y: cy + R_OUTER * Math.sin(rad),
          tipRadius: 19,
          handColor: '#0B3B60',
          showFineDot: m % 5 !== 0
        };
      }

      function renderAnalogClockNumbersHtml() {
        const cx = 138;
        const cy = 138;
        const R_OUTER = 104;
        const R_INNER = 67;
        const toPct = (v) => ((v / 276) * 100).toFixed(2) + '%';
        const nodes = [];

        if (ClockPickerState.mode === 'hour') {
          // Ring Luar: 12, 01..11 (Siang / Pagi)
          for (let i = 0; i < 12; i++) {
            const val = i === 0 ? 12 : i;
            const rad = (i * 30 - 90) * (Math.PI / 180);
            const x = cx + R_OUTER * Math.cos(rad);
            const y = cy + R_OUTER * Math.sin(rad);
            const active = ClockPickerState.hour === val;
            nodes.push(`
              <div class="analog-clock-num w-8 h-8 sm:w-9 sm:h-9 text-xs sm:text-sm font-extrabold ${active ? 'text-white' : 'text-slate-800'}" style="left:${toPct(x)};top:${toPct(y)};">
                ${String(val).padStart(2, '0')}
              </div>
            `);
          }
          // Ring Dalam: 00, 13..23 (Sore / Malam 24-Jam WIB)
          for (let i = 0; i < 12; i++) {
            const val = i === 0 ? 0 : i + 12;
            const rad = (i * 30 - 90) * (Math.PI / 180);
            const x = cx + R_INNER * Math.cos(rad);
            const y = cy + R_INNER * Math.sin(rad);
            const active = ClockPickerState.hour === val;
            nodes.push(`
              <div class="analog-clock-num w-7 h-7 sm:w-8 sm:h-8 text-[10px] sm:text-[11px] font-bold ${active ? 'text-white' : 'text-slate-500'}" style="left:${toPct(x)};top:${toPct(y)};">
                ${String(val).padStart(2, '0')}
              </div>
            `);
          }
        } else {
          // Mode Menit: 00, 05, 10 .. 55
          for (let i = 0; i < 12; i++) {
            const val = i * 5;
            const rad = (i * 30 - 90) * (Math.PI / 180);
            const x = cx + R_OUTER * Math.cos(rad);
            const y = cy + R_OUTER * Math.sin(rad);
            const active = ClockPickerState.minute === val;
            nodes.push(`
              <div class="analog-clock-num w-8 h-8 sm:w-9 sm:h-9 text-xs sm:text-sm font-extrabold ${active ? 'text-white' : 'text-slate-800'}" style="left:${toPct(x)};top:${toPct(y)};">
                ${String(val).padStart(2, '0')}
              </div>
            `);
          }
        }
        return nodes.join('');
      }

      function updateAnalogClockDomLive() {
        const hhStr = String(ClockPickerState.hour).padStart(2, '0');
        const mmStr = String(ClockPickerState.minute).padStart(2, '0');
        const formatted = `${hhStr}:${mmStr}`;
        const geom = getAnalogClockGeometry();

        const btnH = document.getElementById('clock-btn-hour');
        const btnM = document.getElementById('clock-btn-minute');
        if (btnH) btnH.textContent = hhStr;
        if (btnM) btnM.textContent = mmStr;

        const line = document.getElementById('clock-hand-line');
        const tip = document.getElementById('clock-hand-tip');
        const fineDot = document.getElementById('clock-hand-finedot');
        if (line) {
          line.setAttribute('x2', geom.x.toFixed(1));
          line.setAttribute('y2', geom.y.toFixed(1));
          line.setAttribute('stroke', geom.handColor);
        }
        if (tip) {
          tip.setAttribute('cx', geom.x.toFixed(1));
          tip.setAttribute('cy', geom.y.toFixed(1));
          tip.setAttribute('r', String(geom.tipRadius));
          tip.setAttribute('fill', geom.handColor);
        }
        if (fineDot) {
          fineDot.setAttribute('cx', geom.x.toFixed(1));
          fineDot.setAttribute('cy', geom.y.toFixed(1));
          fineDot.style.display = geom.showFineDot ? 'block' : 'none';
        }

        const nums = document.getElementById('analog-clock-numbers');
        if (nums) nums.innerHTML = renderAnalogClockNumbersHtml();

        const errMsg = getClockPickerValidationError(formatted);
        const confirmBtn = document.getElementById('clock-confirm-btn');
        if (confirmBtn) {
          confirmBtn.textContent = `Terapkan (${formatted} WIB)`;
          confirmBtn.disabled = Boolean(errMsg);
          confirmBtn.className = `flex-1 py-2.5 px-4 rounded-xl text-xs font-extrabold shadow-sm transition tabular-nums ${
            errMsg
              ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
              : 'bg-[#0B3B60] hover:bg-[#072A45] text-white'
          }`;
        }

        const warnEl = document.getElementById('clock-validation-msg');
        if (warnEl) {
          warnEl.textContent = errMsg;
          warnEl.classList.toggle('hidden', !errMsg);
        }
      }

      function computeAnalogClockFromPointer(faceEl, clientX, clientY) {
        const rect = faceEl.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        const deg = (Math.atan2(dy, dx) * (180 / Math.PI) + 90 + 360) % 360;

        if (ClockPickerState.mode === 'hour') {
          const sector = Math.round(deg / 30) % 12;
          const isInner = dist < rect.width * 0.315;
          ClockPickerState.hour = isInner ? (sector === 0 ? 0 : sector + 12) : (sector === 0 ? 12 : sector);
        } else {
          ClockPickerState.minute = Math.round(deg / 6) % 60;
        }
        updateAnalogClockDomLive();
      }

      function bindAnalogClockPointerEvents() {
        const face = document.getElementById('analog-clock-face');
        if (!face) return;

        face.addEventListener('pointerdown', (e) => {
          ClockPickerState.isDragging = true;
          if (face.setPointerCapture) {
            try { face.setPointerCapture(e.pointerId); } catch (_) {}
          }
          computeAnalogClockFromPointer(face, e.clientX, e.clientY);
        });

        face.addEventListener('pointermove', (e) => {
          if (!ClockPickerState.isDragging) return;
          computeAnalogClockFromPointer(face, e.clientX, e.clientY);
        });

        const endDrag = (e) => {
          if (!ClockPickerState.isDragging) return;
          ClockPickerState.isDragging = false;
          if (face.releasePointerCapture) {
            try { face.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          // Otomatis berpindah dari mode Jam -> Menit agar pengisian cepat 2 ketukan
          if (ClockPickerState.mode === 'hour') {
            setTimeout(() => {
              if (document.getElementById('analog-clock-face')) {
                ClockPickerState.mode = 'minute';
                renderAnalogClockModal();
              }
            }, 170);
          }
        };

        face.addEventListener('pointerup', endDrag);
        face.addEventListener('pointercancel', endDrag);
      }

      function handleAdminPinDigit(digit) {
        if (!AdminPinModalState.open || !/^\d$/.test(digit)) return;
        if (AdminPinModalState.digits.length >= 6) return;
        AdminPinModalState.error = '';
        AdminPinModalState.digits += digit;
        renderAdminPinModal(false);

        if (AdminPinModalState.digits.length === 6) {
          const entered = AdminPinModalState.digits;
          setTimeout(() => {
            if (!AdminPinModalState.open) return;
            const res = AdminAuth.verifyPin(entered);
            if (res.ok) {
              const cb = AdminPinModalState.onSuccess;
              closeAdminPinModal();
              if (typeof cb === 'function') cb();
            } else {
              AdminPinModalState.digits = '';
              AdminPinModalState.error = res.message;
              renderAdminPinModal(true);
            }
          }, 90);
        }
      }

      function previewTripDistance(startKm, endVal, targetServiceKm) {
        const el = document.getElementById('trip-distance-preview');
        if (!el) return;
        const endNum = Number(endVal) || 0;
        const dist = endNum - startKm;
        if (dist < 0) {
          el.className = 'mt-2 text-xs font-bold text-rose-600 tabular-nums';
          el.textContent = 'KM Akhir tidak boleh lebih kecil dari KM Awal.';
          return;
        }
        const remService = targetServiceKm - endNum;
        let extra = '';
        if (targetServiceKm > 0 && remService <= 500) {
          extra = ` · ⚠ Sisa ${formatNumberID(Math.max(0, remService))} km menuju target service (akan memicu Alert Service!)`;
          el.className = 'mt-2 text-xs font-bold text-amber-700 tabular-nums';
        } else {
          el.className = 'mt-2 text-xs font-semibold text-emerald-700 tabular-nums';
        }
        el.textContent = `Jarak tempuh perjalanan: +${formatNumberID(dist)} km${extra}`;
      }

      /** Modal Admin: Edit / Reschedule Jadwal atau Batalkan Dinas */
      const AdminBookingModalState = {
        bookingId: '',
        tab: 'reschedule', // 'reschedule' | 'cancel'
        tanggal: '',
        tanggal_selesai: '',
        jam_mulai: '09:00',
        jam_selesai: '14:00',
        vehicle_id: '',
        driver_id: '',
        tujuan: '',
        keperluan: '',
        alasan_batal: ''
      };

      const CANCEL_REASON_PRESETS = [
        'Agenda rapat dibatalkan',
        'Dialihkan ke rapat daring (online)',
        'Salah input jadwal / unit',
        'Perubahan penugasan unit kerja'
      ];

      function openAdminBookingModal(bookingId, initialTab = 'reschedule') {
        const b = getBookingById(bookingId);
        if (!b) return;
        if (b.status === 'COMPLETED') {
          showToast('Perjalanan Sudah Selesai', 'Riwayat perjalanan yang telah selesai tidak dapat diubah atau dibatalkan.', 'info');
          return;
        }
        AdminBookingModalState.bookingId = b.id;
        AdminBookingModalState.tab = initialTab === 'cancel' ? 'cancel' : 'reschedule';
        AdminBookingModalState.tanggal = String(b.tanggal || getTodayWibISO()).slice(0, 10);
        AdminBookingModalState.tanggal_selesai = getBookingEndDate(b) || AdminBookingModalState.tanggal;
        AdminBookingModalState.jam_mulai = sanitizeTimeHHMM(b.jam_mulai, '09:00');
        AdminBookingModalState.jam_selesai = sanitizeTimeHHMM(b.jam_selesai, '14:00');
        AdminBookingModalState.vehicle_id = getVehicleById(b.vehicle_id) ? b.vehicle_id : (AppState.data.vehicles[0]?.id || '');
        AdminBookingModalState.driver_id = getDriverById(b.driver_id) ? b.driver_id : (AppState.data.drivers[0]?.id || '');
        AdminBookingModalState.tujuan = b.tujuan || '';
        AdminBookingModalState.keperluan = b.keperluan || '';
        AdminBookingModalState.alasan_batal = b.alasan_batal || '';

        showModal(`<div id="admin-booking-modal-shell">${buildAdminBookingModalInnerHtml()}</div>`, 'max-w-lg');
      }

      function refreshAdminBookingModalInPlace() {
        const shell = document.getElementById('admin-booking-modal-shell');
        if (!shell) return;
        shell.innerHTML = buildAdminBookingModalInnerHtml();
        if (window.lucide) lucide.createIcons({ nodes: [shell] });
      }

      function buildAdminBookingModalInnerHtml() {
        const s = AdminBookingModalState;
        const b = getBookingById(s.bookingId);
        if (!b) return '';

        const tglSelesai = s.tanggal_selesai && s.tanggal_selesai >= s.tanggal ? s.tanggal_selesai : s.tanggal;
        const dayCount = getBookingDayCount(s.tanggal, tglSelesai);
        const isPastStart = b.status !== 'ON_TRIP' && isStartDateTimeInPast(s.tanggal, s.jam_mulai);
        const validRange = isBookingTimeRangeValid(s.tanggal, tglSelesai, s.jam_mulai, s.jam_selesai);
        const validTime = validRange && !isPastStart;
        const durationText = isPastStart
          ? `Waktu sudah terlewat (${getNowWibHHMM()} WIB)`
          : calcDurationLabel(s.jam_mulai, s.jam_selesai, s.tanggal, tglSelesai);
        const isRescheduleTab = s.tab === 'reschedule';
        const isAlreadyCancelled = b.status === 'CANCELLED';

        const vehOptions = AppState.data.vehicles.map((v) => {
          const av = validTime ? getVehicleAvailability(v, s.tanggal, tglSelesai, s.jam_mulai, s.jam_selesai, b.id) : { available: true, reason: '' };
          const statusTag = av.available ? 'Tersedia' : `Bentrok: ${av.reason}`;
          return { v, av, statusTag };
        });

        const drvOptions = AppState.data.drivers.map((d) => {
          const av = validTime ? getDriverAvailability(d, s.tanggal, tglSelesai, s.jam_mulai, s.jam_selesai, b.id) : { available: true, reason: '' };
          const statusTag = av.available ? 'Tersedia' : `Bentrok: ${av.reason}`;
          return { d, av, statusTag };
        });

        const curVehObj = vehOptions.find((x) => x.v.id === s.vehicle_id);
        const curDrvObj = drvOptions.find((x) => x.d.id === s.driver_id);
        const hasConflict = Boolean((curVehObj && !curVehObj.av.available) || (curDrvObj && !curDrvObj.av.available));

        const origVeh = getVehicleById(b.vehicle_id);
        const origDrv = getDriverById(b.driver_id);

        return `
          <div class="overflow-hidden rounded-2xl">
            <!-- Header -->
            <div class="bg-gradient-to-br from-[#0B3B60] to-[#072A45] text-white px-5 py-4">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="font-sport text-xs font-bold uppercase tracking-wider text-sky-300 tabular-nums">${escapeHtml(b.kode_booking)}</span>
                    ${renderStatusPill(b.status)}
                  </div>
                  <h3 class="text-base font-extrabold mt-1">Kelola Jadwal Peminjaman</h3>
                  <p class="text-[11px] text-blue-200/90 truncate mt-0.5">${escapeHtml(b.nama_peminjam)} · ${escapeHtml(b.unit_kerja)}</p>
                </div>
                <button type="button" onclick="App.closeModal()" class="p-1.5 rounded-lg text-blue-200 hover:text-white hover:bg-white/10 shrink-0">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- Switch Tab: Reschedule vs Batalkan Dinas -->
              <div class="mt-3.5 grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-white/10">
                <button
                  type="button"
                  onclick="App.switchAdminBookingTab('reschedule')"
                  class="py-2 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    isRescheduleTab ? 'bg-white text-[#0B3B60] shadow-sm' : 'text-blue-100 hover:bg-white/10'
                  }"
                >
                  <i data-lucide="calendar-clock" class="w-3.5 h-3.5"></i>
                  <span>${isAlreadyCancelled ? 'Jadwalkan Ulang' : 'Reschedule / Edit'}</span>
                </button>
                <button
                  type="button"
                  onclick="App.switchAdminBookingTab('cancel')"
                  class="py-2 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    !isRescheduleTab ? 'bg-rose-600 text-white shadow-sm' : 'text-rose-200 hover:bg-rose-500/20'
                  }"
                >
                  <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
                  <span>Batalkan Dinas</span>
                </button>
              </div>
            </div>

            <!-- Body -->
            <div class="p-5">
              ${isRescheduleTab ? `
                <form onsubmit="App.submitAdminBookingReschedule(event)" class="space-y-4">
                  ${isAlreadyCancelled ? `
                    <div class="p-3 rounded-xl bg-[#EFF6FF] border border-blue-200 text-xs text-[#0B3B60] flex items-start gap-2">
                      <i data-lucide="rotate-ccw" class="w-4 h-4 text-[#1D4ED8] shrink-0 mt-0.5"></i>
                      <span>Dinas ini sebelumnya berstatus <strong>Dibatalkan</strong>. Menyimpan jadwal baru akan mengaktifkannya kembali sebagai <strong>Terjadwal</strong>.</span>
                    </div>
                  ` : ''}

                  <!-- Pilihan Cepat Lama Hari -->
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="text-[11px] font-bold text-slate-500">Durasi:</span>
                      ${[1, 2, 3, 5].map((dNum) => `
                        <button
                          type="button"
                          onclick="App.setAdminBookingDurationDays(${dNum})"
                          class="px-2 py-0.5 rounded-md text-[11px] font-bold border transition tabular-nums ${
                            dayCount === dNum ? 'bg-[#0B3B60] text-white border-[#0B3B60]' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-[#0B3B60]'
                          }"
                        >${dNum} Hari</button>
                      `).join('')}
                    </div>
                    <span class="text-[11px] font-bold tabular-nums ${validTime ? 'text-emerald-700' : 'text-rose-600'}">
                      ${validTime ? escapeHtml(durationText) : escapeHtml(isPastStart ? durationText : 'Waktu kembali tidak valid')}
                    </span>
                  </div>

                  <!-- Tanggal & Jam Berangkat / Kembali -->
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Tanggal Berangkat</label>
                      <button
                        type="button"
                        onclick="App.openAdminBookingDatePicker('start')"
                        class="w-full px-3 py-2 rounded-xl border ${b.status !== 'ON_TRIP' && s.tanggal < getTodayWibISO() ? 'border-rose-400 bg-rose-50 text-rose-700' : 'border-slate-300 bg-white text-slate-900'} hover:border-[#0B3B60] text-left flex items-center justify-between gap-2 text-xs font-bold"
                      >
                        <span class="truncate">${escapeHtml(formatTanggalIndo(s.tanggal, false))}</span>
                        <i data-lucide="calendar" class="w-3.5 h-3.5 ${b.status !== 'ON_TRIP' && s.tanggal < getTodayWibISO() ? 'text-rose-600' : 'text-[#0B3B60]'} shrink-0"></i>
                      </button>
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Tanggal Kembali</label>
                      <button
                        type="button"
                        onclick="App.openAdminBookingDatePicker('end')"
                        class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white hover:border-[#1D4ED8] text-left flex items-center justify-between gap-2 text-xs font-bold text-slate-900"
                      >
                        <span class="truncate">${escapeHtml(formatTanggalIndo(tglSelesai, false))}</span>
                        <i data-lucide="calendar-check" class="w-3.5 h-3.5 text-[#1D4ED8] shrink-0"></i>
                      </button>
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Jam Berangkat (WIB)</label>
                      <button
                        type="button"
                        onclick="App.openAdminBookingClockPicker('jam_mulai')"
                        class="w-full px-3 py-2 rounded-xl border ${isPastStart ? 'border-rose-400 bg-rose-50 text-rose-700' : 'border-slate-300 bg-white text-slate-900'} hover:border-[#0B3B60] text-left flex items-center justify-between gap-2 text-xs font-extrabold tabular-nums"
                      >
                        <span>${escapeHtml(s.jam_mulai)} WIB</span>
                        <i data-lucide="clock" class="w-3.5 h-3.5 ${isPastStart ? 'text-rose-600' : 'text-[#1D4ED8]'} shrink-0"></i>
                      </button>
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Jam Kembali (WIB)</label>
                      <button
                        type="button"
                        onclick="App.openAdminBookingClockPicker('jam_selesai')"
                        class="w-full px-3 py-2 rounded-xl border ${validRange ? 'border-slate-300 bg-white text-slate-900' : 'border-rose-400 bg-rose-50 text-rose-700'} hover:border-[#0B3B60] text-left flex items-center justify-between gap-2 text-xs font-extrabold tabular-nums"
                      >
                        <span>${escapeHtml(s.jam_selesai)} WIB</span>
                        <i data-lucide="clock" class="w-3.5 h-3.5 ${validRange ? 'text-[#1D4ED8]' : 'text-rose-600'} shrink-0"></i>
                      </button>
                    </div>
                  </div>

                  <!-- Armada & Driver (Cek Anti-Bentrok Live) -->
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Armada Dinas</label>
                      <select
                        onchange="App.updateAdminBookingDraft('vehicle_id', this.value, true)"
                        class="w-full px-3 py-2 rounded-xl border ${curVehObj && !curVehObj.av.available ? 'border-rose-400 bg-rose-50/40' : 'border-slate-300 bg-white'} text-xs font-bold text-slate-900 outline-none"
                      >
                        ${vehOptions.map(({ v, av, statusTag }) => `
                          <option value="${v.id}" ${v.id === s.vehicle_id ? 'selected' : ''}>
                            ${escapeHtml(v.plat_nomor)} — ${escapeHtml(v.jenis_mobil)} [${escapeHtml(statusTag)}]
                          </option>
                        `).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Pengemudi</label>
                      <select
                        onchange="App.updateAdminBookingDraft('driver_id', this.value, true)"
                        class="w-full px-3 py-2 rounded-xl border ${curDrvObj && !curDrvObj.av.available ? 'border-rose-400 bg-rose-50/40' : 'border-slate-300 bg-white'} text-xs font-bold text-slate-900 outline-none"
                      >
                        ${drvOptions.map(({ d, av, statusTag }) => `
                          <option value="${d.id}" ${d.id === s.driver_id ? 'selected' : ''}>
                            ${escapeHtml(d.nama)} [${escapeHtml(statusTag)}]
                          </option>
                        `).join('')}
                      </select>
                    </div>
                  </div>

                  ${hasConflict ? `
                    <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700 flex items-start gap-2">
                      <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                      <span>
                        ${curVehObj && !curVehObj.av.available ? `Armada ${escapeHtml(curVehObj.v.plat_nomor)} bentrok (${escapeHtml(curVehObj.av.reason)}). ` : ''}
                        ${curDrvObj && !curDrvObj.av.available ? `Driver ${escapeHtml(curDrvObj.d.nama)} bentrok (${escapeHtml(curDrvObj.av.reason)}).` : ''}
                      </span>
                    </div>
                  ` : ''}

                  <!-- Tujuan & Keperluan -->
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Tujuan Dinas</label>
                      <input
                        type="text"
                        required
                        value="${escapeHtml(s.tujuan)}"
                        oninput="App.updateAdminBookingDraft('tujuan', this.value, false)"
                        class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs"
                      />
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">Keperluan</label>
                      <input
                        type="text"

      /* ======================================================================
       * 13. EKSPOR LAPORAN RESMI BULANAN (EXCEL .XLS & CSV BERKOP KPWBI JATENG)
       * ====================================================================== */
      function exportMonthlyReport(format = 'xls') {
        const month = AppState.adminFilters.expenseMonth === 'ALL'
          ? getTodayWibISO().slice(0, 7)
          : AppState.adminFilters.expenseMonth;
        const periodLabel = formatBulanIndo(month);
        const generatedAt = formatTanggalIndo(getTodayWibISO(), true) + ', ' + formatNowClockWIB();

        const exps = AppState.data.expenses.filter((e) => AppState.adminFilters.expenseMonth === 'ALL' || String(e.tanggal_waktu || '').startsWith(month));
        const bkgs = AppState.data.bookings.filter((b) => {
          if (AppState.adminFilters.expenseMonth === 'ALL') return true;
          const sDate = String(b.tanggal || '').slice(0, 10);
          const eDate = getBookingEndDate(b);
          return sDate.startsWith(month) || eDate.startsWith(month) || (sDate <= `${month}-31` && eDate >= `${month}-01`);
        });
        const formatExportBookingDate = (b) => {
          const sDate = String(b.tanggal || '').slice(0, 10);
          const eDate = getBookingEndDate(b);
          const dCount = getBookingDayCount(sDate, eDate);
          return dCount > 1 ? `${sDate} s/d ${eDate} (${dCount} hari)` : sDate;
        };
        const totalBBM = exps.filter((e) => e.jenis_biaya === 'BBM').reduce((s, e) => s + (Number(e.nominal) || 0), 0);
        const totalEtoll = exps.filter((e) => e.jenis_biaya === 'ETOLL').reduce((s, e) => s + (Number(e.nominal) || 0), 0);

        if (format === 'csv') {
          const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
          const rows = [
            ['BANK INDONESIA'],
            ['KANTOR PERWAKILAN PROVINSI JAWA TENGAH'],
            ['Jl. Imam Bardjo SH No. 4, Semarang — Fungsi Logistik & Pengelolaan Aset'],
            [`LAPORAN OPERASIONAL KENDARAAN DINAS, BBM & E-TOLL — PERIODE: ${periodLabel.toUpperCase()}`],
            [`Dicetak: ${generatedAt}`],
            [],
            ['RINGKASAN PENGELUARAN', 'NOMINAL (IDR)'],
            ['Total Pengeluaran BBM', totalBBM],
            ['Total Pengeluaran E-Toll', totalEtoll],
            ['Grand Total Operasional', totalBBM + totalEtoll],
            [],
            ['LOG TRANSAKSI BBM & E-TOLL'],
            ['Tanggal & Jam WIB', 'Plat Nomor', 'Kendaraan', 'Pengemudi', 'Jenis Biaya', 'Liter', 'Odometer (KM)', 'Nominal (IDR)', 'Keterangan'],
            ...exps.map((e) => {
              const v = getVehicleById(e.vehicle_id);
              const d = getDriverById(e.driver_id);
              return [e.tanggal_waktu, v?.plat_nomor || '-', v?.jenis_mobil || '-', d?.nama || '-', e.jenis_biaya, e.liter || '', e.odometer_pengisian || '', e.nominal, e.keterangan || ''];
            }),
            [],
            ['REKAP PERJALANAN DINAS & RATING PENGEMUDI'],
            ['Kode Booking', 'Tanggal', 'Jam WIB', 'Peminjam', 'Unit Kerja', 'Tujuan', 'Plat Nomor', 'Pengemudi', 'KM Awal', 'KM Akhir', 'Status', 'Rating'],
            ...bkgs.map((b) => {
              const v = getVehicleById(b.vehicle_id);
              const d = getDriverById(b.driver_id);
              return [b.kode_booking, formatExportBookingDate(b), `${b.jam_mulai}-${b.jam_selesai}`, b.nama_peminjam, b.unit_kerja, b.tujuan, v?.plat_nomor || '-', d?.nama || '-', b.km_awal || '', b.km_akhir || '', b.status, b.rating || ''];
            })
          ];
          const csvContent = '\uFEFF' + rows.map((r) => r.map(esc).join(',')).join('\r\n');
          triggerDownload(csvContent, `Laporan_DALMUDI_KPwBI_Jateng_${month}.csv`, 'text/csv;charset=utf-8;');
          showToast('Ekspor CSV Berhasil', `Laporan resmi periode ${periodLabel} berhasil diunduh.`, 'success');
          return;
        }

        // Format Excel (.xls) berkop korporat KPwBI Provinsi Jawa Tengah
        const xlsHtml = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
          <head><meta charset="UTF-8" />
            <style>
              body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #0F172A; }

              .kop-addr { font-size: 9.5pt; color: #475569; }
              table { border-collapse: collapse; width: 100%; margin-top: 10px; }

              .num { text-align: right; }

            </style>
          </head>
          <body>
            <div class="kop-title">BANK INDONESIA</div>
            <div class="kop-sub">KANTOR PERWAKILAN PROVINSI JAWA TENGAH</div>
            <div class="kop-addr">Jl. Imam Bardjo SH No. 4, Semarang — Fungsi Logistik &amp; Pengelolaan Aset</div>
            <hr/>
            <div class="sec">LAPORAN BULANAN OPERASIONAL KENDARAAN DINAS (${escapeHtml(periodLabel.toUpperCase())})</div>
            <div class="kop-addr">Dicetak secara sistem melalui DALMUDI pada ${escapeHtml(generatedAt)}</div>

            <table>
              <tr><th>Ringkasan Biaya Operasional</th><th class="num">Nominal</th></tr>
              <tr><td>Total Pengeluaran BBM</td><td class="num">${formatRupiah(totalBBM)}</td></tr>
              <tr><td>Total Transaksi / Top-Up E-Toll</td><td class="num">${formatRupiah(totalEtoll)}</td></tr>
              <tr><td><strong>Grand Total BBM &amp; E-Toll</strong></td><td class="num"><strong>${formatRupiah(totalBBM + totalEtoll)}</strong></td></tr>
            </table>

            <div class="sec">1. Rincian Log Pengeluaran BBM &amp; E-Toll</div>
            <table>
              <thead>
                <tr><th>Waktu (WIB)</th><th>Plat Nomor</th><th>Kendaraan</th><th>Driver</th><th>Jenis</th><th class="num">Liter</th><th class="num">Odometer</th><th class="num">Nominal</th><th>Keterangan</th></tr>
              </thead>
              <tbody>
                ${exps.map((e) => {
                  const v = getVehicleById(e.vehicle_id);
                  const d = getDriverById(e.driver_id);
                  return `<tr>
                    <td>${escapeHtml(e.tanggal_waktu)}</td>
                    <td>${escapeHtml(v?.plat_nomor || '-')}</td>
                    <td>${escapeHtml(v?.jenis_mobil || '-')}</td>
                    <td>${escapeHtml(d?.nama || '-')}</td>
                    <td>${escapeHtml(e.jenis_biaya)}</td>
                    <td class="num">${e.liter || '-'}</td>
                    <td class="num">${e.odometer_pengisian ? formatKM(e.odometer_pengisian) : '-'}</td>
                    <td class="num">${formatRupiah(e.nominal)}</td>
                    <td>${escapeHtml(e.keterangan || '-')}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>

            <div class="sec">2. Status Armada &amp; Pemantauan Service Berkala</div>
            <table>
              <thead>
                <tr><th>Plat Nomor</th><th>Jenis Kendaraan</th><th>Status</th><th class="num">Odometer</th><th class="num">Target Service</th><th>Jadwal Service</th><th>Status Service</th></tr>
              </thead>
              <tbody>
                ${AppState.data.vehicles.map((v) => {
                  const h = getVehicleServiceHealth(v);
                  return `<tr>
                    <td>${escapeHtml(v.plat_nomor)}</td>
                    <td>${escapeHtml(v.jenis_mobil)}</td>
                    <td>${escapeHtml(v.status)}</td>
                    <td class="num">${formatKM(v.odometer_saat_ini)}</td>
                    <td class="num">${formatKM(v.target_km_service)}</td>
                    <td>${escapeHtml(v.tanggal_service_berikutnya)}</td>
                    <td>${h.needsService ? 'WAKTUNYA SERVICE (' + escapeHtml(h.reason) + ')' : 'Normal'}</td>
                  </tr>`;
                }).join('')}

      function triggerDownload(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
