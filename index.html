  <style>
    :root {
      --bi-navy: #0B3B60;
      --bi-navy-dark: #072A45;
      --bi-blue: #1D4ED8;
      --app-canvas: #F8FAFC;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F1F5F9;
      background-image:
        radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.06) 0px, transparent 48%),
        radial-gradient(at 100% 0%, rgba(11, 59, 96, 0.06) 0px, transparent 45%);
      background-attachment: fixed;
      color: #0F172A;
      overflow-x: clip;
      max-width: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-sport {
      font-family: 'Chakra Petch', 'Plus Jakarta Sans', system-ui, sans-serif;
      letter-spacing: 0.015em;
    }

    /* Sporty Automotive Carbon & Motorsport Accents */
    .sport-carbon {
      background-color: #072238;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 2px,
          transparent 2px,
          transparent 8px
        ),
        linear-gradient(135deg, #061A2C 0%, #0B3B60 55%, #0A2E4D 100%);
    }

    .sport-tri-stripe {
      background: linear-gradient(90deg, #0EA5E9 0%, #1D4ED8 45%, #0B3B60 72%, #F59E0B 100%);
    }

    .sport-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .sport-card:hover {
      transform: translateY(-2px);
      border-color: rgba(29, 78, 216, 0.32);
      box-shadow: 0 12px 26px -10px rgba(11, 59, 96, 0.16);
    }

    /* Digital Instrument Bezel (Odometer / Telemetry) */
    .sport-bezel {
      background: linear-gradient(180deg, #0A233A 0%, #061726 100%);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    /* Segmented RPM-Style Progress Track */
    .sport-rpm-track {
      position: relative;
      overflow: hidden;
      background: #E2E8F0;
    }
    .sport-rpm-track::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 10px,
        rgba(255, 255, 255, 0.55) 10px,
        rgba(255, 255, 255, 0.55) 12px
      );
      pointer-events: none;
    }

    /* Skewed Motorsport Badge */
    .sport-skew-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transform: skewX(-10deg);
    }
    .sport-skew-badge > * {
      transform: skewX(10deg);
    }

    /* Tactile Ignition Button Sheen */
    .sport-ignition-btn {
      position: relative;
      overflow: hidden;
    }
    .sport-ignition-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transform: skewX(-24deg);
      transition: left 0.55s ease;
      pointer-events: none;
    }
    .sport-ignition-btn:hover::after {
      left: 135%;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Authentic Indonesian White License Plate */
    .indo-plate {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #0F172A;
      border: 1.5px solid #0F172A;
      border-radius: 6px;
      padding: 2px 9px 2px 9px;
      box-shadow: inset 0 0 0 1px #FFFFFF, inset 0 0 0 2px #CBD5E1, 0 1px 2px rgba(15, 23, 42, 0.08);
      line-height: 1.1;
      min-width: 96px;
      user-select: all;
    }
    .indo-plate-lg {
      min-width: 122px;
      padding: 4px 12px 3px 12px;
      border-width: 2px;
      border-radius: 8px;
    }
    .indo-plate-number {
      font-weight: 800;
      letter-spacing: 0.06em;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .indo-plate-lg .indo-plate-number {
      font-size: 1rem;
    }
    .indo-plate-divider {
      width: 100%;
      height: 1px;
      background: #CBD5E1;
      margin: 2px 0 1px;
    }
    .indo-plate-exp {
      font-size: 0.5625rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #334155;
      font-variant-numeric: tabular-nums;
      align-self: flex-end;
    }

    /* Subtle custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Smooth modal & toast animations */
    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-modal {
      animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpToast {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-toast {
      animation: slideUpToast 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownAlert {
      from { opacity: 0; transform: translateY(-18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-driver-alert {
      animation: slideDownAlert 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .animate-pin-shake {
      animation: pinShake 0.35s ease-in-out;
    }

    /* Safe area bottom padding for Android APK / PWA */
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Modern Analog Clock Dial (Responsive for all mobile widths) */
    .analog-clock-face {
      width: min(276px, calc(100vw - 72px));
      height: min(276px, calc(100vw - 72px));
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #F1F5F9 100%);
      box-shadow: inset 0 2px 10px rgba(11, 59, 96, 0.08), 0 4px 18px rgba(11, 59, 96, 0.06);
      position: relative;
      user-select: none;
      touch-action: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .analog-clock-num {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      transition: color 0.12s ease, transform 0.12s ease;
    }
    @media (max-width: 390px) {
      .indo-plate {
        min-width: 84px;
        padding: 2px 7px;
      }
      .indo-plate-lg {
        min-width: 104px;
        padding: 3px 9px 2px;
      }
      .indo-plate-number {
        font-size: 0.75rem;
      }
      .indo-plate-lg .indo-plate-number {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

  <!-- ======================================================================== -->
  <!-- VANILLA JAVASCRIPT APPLICATION ENGINE                                    -->
  <!-- ======================================================================== -->
  <script>
    (function () {
      'use strict';

      /* ======================================================================
       * 1. KONFIGURASI INTEGRASI BACKEND (FIREBASE & GOOGLE APPS SCRIPT)
       * ======================================================================
       * PANDUAN INTEGRASI:
       * 1) GOOGLE APPS SCRIPT (Arsip Google Sheets & Bukti Struk Google Drive):
       *    - Deploy file `Code.gs` sebagai Web App ("Execute as: Me", "Who has access: Anyone").
       *    - Salin URL Web App (`https://script.google.com/macros/s/XXXX/exec`) lalu tempel
       *      ke `GOOGLE_APPS_SCRIPT_URL` di bawah ini, ATAU masukkan langsung lewat menu
       *      Admin Logistik -> Driver & Pengaturan -> Integrasi Backend.
       * 2) FIREBASE FIRESTORE (Sinkronisasi Cloud Real-Time < 300ms lintas perangkat):
       *    - Isi objek `FIREBASE_CONFIG` dari Firebase Console Anda.
       * 3) MODE DEFAULT (OUT-OF-THE-BOX):
       *    - Jika keduanya kosong, aplikasi otomatis berjalan 100% interaktif dengan
       *      Real-Time Local Sync Engine (`localStorage` + `BroadcastChannel API`).
       */
      const DEFAULT_INTEGRATION_CONFIG = {
        GOOGLE_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyQjFZ7CtXgKmWMwH4if052rQgm6ixKbBoUAt-ERbYWAmQ_GiwYDMk8Oh1LxwVAWweb/exec',
        FIREBASE_CONFIG: {
          apiKey: '',
          authDomain: '',
          projectId: '',
          storageBucket: '',
          messagingSenderId: '',
          appId: ''
        }
      };

      // Versi Aplikasi DALMUDI (Selalu dinaikkan setiap ada pembaruan fitur/perubahan)
      const APP_VERSION = 'v1.10.2';

      // PIN Default Akses Tab Admin Logistik (6 Digit — dapat diubah di menu Admin -> Driver & Sistem)
      const DEFAULT_ADMIN_PIN = '211126';

      // Akun Admin Utama (Default Fallback Offline — khusus tanpa email, tidak dapat dihapus)
      const DEFAULT_PRIMARY_ADMIN = {
        id: 'adm-primary',
        identifier: 'BI-ADM-0009',
        nama: 'Ahmad Rizal',
        unit: 'Fungsi Logistik & Pengelolaan Aset',
        isPrimary: true
      };

      const STORAGE_KEYS = {
        STATE: 'bi_fleet_jateng_state_v1',
        CONFIG: 'bi_fleet_jateng_integration_cfg_v1',
        SESSION: 'bi_fleet_jateng_user_session_v2',
        SESSION_LEGACY: 'bi_fleet_jateng_session_v1',
        SYNC_LOG: 'bi_fleet_jateng_synclog_v1',
        ADMIN_LIST: 'bi_fleet_jateng_admin_list_v1',
        ADMIN_PIN_HASH: 'bi_fleet_jateng_admin_pin_hash_v1',
        ADMIN_UNLOCKED: 'bi_fleet_jateng_admin_unlocked_v1',
        LOGIN_HISTORY: 'bi_fleet_jateng_login_history_v1'
      };

      const BROADCAST_CHANNEL_NAME = 'bi_fleet_jateng_realtime_v1';

      /** Engine Keamanan PIN Admin Logistik (Hash tersimpan aman + Session Lock + Rate Limit) */
      const AdminAuth = {
        memoryUnlocked: false,
        failedAttempts: 0,
        lockedUntil: 0,

        hashPin(pin) {
          const salted = 'BI-FLEET-JATENG-KPWBI::' + String(pin || '') + '::SEMARANG';
          let h1 = 0xdeadbeef ^ salted.length;
          let h2 = 0x41c6ce57 ^ salted.length;
          for (let i = 0; i < salted.length; i++) {
            const ch = salted.charCodeAt(i);
            h1 = Math.imul(h1 ^ ch, 2654435761);
            h2 = Math.imul(h2 ^ ch, 1597334677);
          }
          h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
          h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
          return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
        },

        getStoredHash() {
          try {
            const custom = localStorage.getItem(STORAGE_KEYS.ADMIN_PIN_HASH);
            if (custom) return custom;
          } catch (_) {}
          return this.hashPin(DEFAULT_ADMIN_PIN);
        },

        isCustomPinSet() {
          try {
            return Boolean(localStorage.getItem(STORAGE_KEYS.ADMIN_PIN_HASH));
          } catch (_) {
            return false;
          }
        },

        ensurePrimaryAdmin(list) {
          const normalized = Array.isArray(list)
            ? list
                .filter((a) => a && String(a.identifier || '').trim())
                .map((a) => ({
                  id: String(a.id || ('adm-' + String(a.identifier).trim().toLowerCase().replace(/[^a-z0-9]/g, '_'))),
                  identifier: String(a.identifier).trim(),
                  nama: String(a.nama || 'Admin Logistik').trim(),
                  unit: String(a.unit || 'Fungsi Logistik & Pengelolaan Aset').trim(),
                  isPrimary: Boolean(a.isPrimary)
                }))
            : [];

          const primaryKey = DEFAULT_PRIMARY_ADMIN.identifier.toLowerCase();
          const hasPrimary = normalized.some((a) => a.identifier.toLowerCase() === primaryKey || a.isPrimary);
          if (!hasPrimary) {
            normalized.unshift(Object.assign({}, DEFAULT_PRIMARY_ADMIN));
          } else {
            // Sinkronkan nama Admin Utama bila masih memakai nama bawaan lama & pastikan di urutan pertama
            normalized.forEach((a) => {
              if (a.isPrimary || a.id === DEFAULT_PRIMARY_ADMIN.id || a.identifier.toLowerCase() === primaryKey) {
                a.isPrimary = true;
                if (!a.nama || /hendra kusumo/i.test(a.nama)) {
                  a.nama = DEFAULT_PRIMARY_ADMIN.nama;
                }
              }
            });
            normalized.sort((a, b) => (b.isPrimary ? 1 : 0) - (a.isPrimary ? 1 : 0));
          }
          return normalized;
        },

        loadAdminList() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.ADMIN_LIST);
            if (raw) {
              const parsed = JSON.parse(raw);
              return this.ensurePrimaryAdmin(parsed);
            }
          } catch (_) {}
          const fallback = this.ensurePrimaryAdmin([Object.assign({}, DEFAULT_PRIMARY_ADMIN)]);
          try {
            localStorage.setItem(STORAGE_KEYS.ADMIN_LIST, JSON.stringify(fallback));
          } catch (_) {}
          return fallback;
        },

        saveAdminList(list) {
          const safe = this.ensurePrimaryAdmin(list);
          AppState.adminList = safe;
          try {
            localStorage.setItem(STORAGE_KEYS.ADMIN_LIST, JSON.stringify(safe));
          } catch (_) {}
          return safe;
        },

        findAdminByIdentifier(identifier) {
          const clean = String(identifier || '').trim().toLowerCase();
          if (!clean) return null;
          const list = (typeof AppState !== 'undefined' && Array.isArray(AppState.adminList))
            ? AppState.adminList
            : this.loadAdminList();
          return list.find((a) => String(a.identifier || '').trim().toLowerCase() === clean) || null;
        },

        isAdminIdentifier(identifier) {
          return Boolean(this.findAdminByIdentifier(identifier));
        },

        isUnlocked() {
          try {
            if (typeof sessionStorage !== 'undefined' && sessionStorage.getItem(STORAGE_KEYS.ADMIN_UNLOCKED) === '1') {
              return true;
            }
          } catch (_) {}
          return this.memoryUnlocked;
        },

        unlock() {
          this.memoryUnlocked = true;
          this.failedAttempts = 0;
          this.lockedUntil = 0;
          try {
            if (typeof sessionStorage !== 'undefined') {
              sessionStorage.setItem(STORAGE_KEYS.ADMIN_UNLOCKED, '1');
            }
          } catch (_) {}
        },

        lock() {
          this.memoryUnlocked = false;
          try {
            if (typeof sessionStorage !== 'undefined') {
              sessionStorage.removeItem(STORAGE_KEYS.ADMIN_UNLOCKED);
            }
          } catch (_) {}
        },

        verifyPin(inputPin) {
          const now = Date.now();
          if (this.lockedUntil > now) {
            const secs = Math.ceil((this.lockedUntil - now) / 1000);
            return { ok: false, locked: true, waitSeconds: secs, message: `Terlalu banyak percobaan salah. Tunggu ${secs} detik.` };
          }
          if (this.hashPin(inputPin) === this.getStoredHash()) {
            this.unlock();
            return { ok: true };
          }
          this.failedAttempts += 1;
          const remaining = Math.max(0, 5 - this.failedAttempts);
          if (remaining === 0) {
            this.lockedUntil = Date.now() + 30000;
            this.failedAttempts = 0;
            return { ok: false, locked: true, waitSeconds: 30, message: '5x PIN salah. Akses dikunci sementara selama 30 detik.' };
          }
          return { ok: false, locked: false, remaining, message: `PIN Admin salah. Sisa percobaan: ${remaining} kali.` };
        },

        changePin(oldPin, newPin, confirmPin) {
          if (this.hashPin(oldPin) !== this.getStoredHash()) {
            return { ok: false, message: 'PIN Admin saat ini tidak sesuai.' };
          }
          if (!/^\d{6}$/.test(String(newPin || ''))) {
            return { ok: false, message: 'PIN baru wajib berupa tepat 6 digit angka.' };
          }
          if (newPin !== confirmPin) {
            return { ok: false, message: 'Konfirmasi PIN baru tidak cocok.' };
          }
          try {
            localStorage.setItem(STORAGE_KEYS.ADMIN_PIN_HASH, this.hashPin(newPin));
          } catch (_) {
            return { ok: false, message: 'Gagal menyimpan PIN baru di penyimpanan browser.' };
          }
          return { ok: true, message: 'PIN Admin Logistik berhasil diperbarui.' };
        }
      };

      /* ======================================================================
       * 2. KONSTANTA & DATA REFERENSI KPWBI PROVINSI JAWA TENGAH

      /* ======================================================================
       * 3. UTILITAS TANGGAL WIB, FORMATTER, GAMBAR & EKSPOR
       * ====================================================================== */
      function getNowWIB() {
        const now = new Date();
        // Konversi akurat ke WIB (UTC+7)
        const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utcMs + 7 * 3600000);
      }

      function getTodayWibISO() {
        const d = getNowWIB();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function shiftDateISO(isoDate, deltaDays) {
        const [y, m, d] = isoDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d + deltaDays);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }

      function addMonthsISO(isoDate, months) {
        const [y, m, d] = (isoDate || getTodayWibISO()).split('-').map(Number);
        const dt = new Date(y, m - 1 + months, d);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }

      function diffDaysISO(startIso, endIso) {
        if (!startIso || !endIso) return 0;
        const [sy, sm, sd] = String(startIso).slice(0, 10).split('-').map(Number);
        const [ey, em, ed] = String(endIso).slice(0, 10).split('-').map(Number);
        if ([sy, sm, sd, ey, em, ed].some(isNaN)) return 0;
        const startUtc = Date.UTC(sy, sm - 1, sd);
        const endUtc = Date.UTC(ey, em - 1, ed);
        return Math.round((endUtc - startUtc) / 86400000);
      }

      function getBookingEndDate(b) {
        if (!b || !b.tanggal) return '';
        const start = String(b.tanggal).slice(0, 10);
        const end = b.tanggal_selesai ? String(b.tanggal_selesai).slice(0, 10) : '';
        return end && end >= start ? end : start;
      }

      function getBookingDayCount(startIso, endIso) {
        if (!startIso) return 1;
        const effEnd = endIso && endIso >= startIso ? endIso : startIso;
        return Math.max(1, diffDaysISO(startIso, effEnd) + 1);
      }

      function isDateWithinRange(targetIso, startIso, endIso) {
        if (!targetIso || !startIso) return false;
        const effEnd = endIso && endIso >= startIso ? endIso : startIso;
        return targetIso >= startIso && targetIso <= effEnd;
      }

      function getNowWibHHMM() {
        const d = getNowWIB();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      function isStartDateTimeInPast(startIso, startTime) {
        if (!startIso || !startTime) return false;
        const today = getTodayWibISO();
        const sDate = String(startIso).slice(0, 10);
        if (sDate < today) return true;
        if (sDate === today && String(startTime) < getNowWibHHMM()) return true;
        return false;
      }

      function getSmartDefaultBookingSchedule() {
        const today = getTodayWibISO();
        const now = getNowWIB();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        // Sebelum 08:30 WIB -> default hari ini 09:00 - 14:00
        if (nowMin < 8 * 60 + 30) {
          return { tanggal: today, tanggal_selesai: today, jam_mulai: '09:00', jam_selesai: '14:00' };
        }
        // 08:30 s/d 21:29 WIB -> bulatkan ke kelipatan 30 menit berikutnya (buffer min. 15 menit), durasi 2 jam
        if (nowMin < 21 * 60 + 30) {
          const startMin = Math.ceil((nowMin + 15) / 30) * 30;
          const endMin = Math.min(23 * 60 + 45, startMin + 120);
          const toHHMM = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
          return { tanggal: today, tanggal_selesai: today, jam_mulai: toHHMM(startMin), jam_selesai: toHHMM(endMin) };
        }
        // Sudah lewat 21:30 WIB -> otomatis jadwalkan besok pagi 08:00 - 14:00
        const tomorrow = shiftDateISO(today, 1);
        return { tanggal: tomorrow, tanggal_selesai: tomorrow, jam_mulai: '08:00', jam_selesai: '14:00' };
      }

      function isBookingTimeRangeValid(startIso, endIso, startTime, endTime) {
        if (!startIso || !startTime || !endTime) return false;
        const effEnd = endIso || startIso;
        if (effEnd < startIso) return false;
        return `${startIso}T${startTime}` < `${effEnd}T${endTime}`;
      }

      function diffDaysFromToday(targetIso) {
        if (!targetIso) return 999;
        return diffDaysISO(getTodayWibISO(), targetIso);
      }

      function formatTanggalIndo(isoDate, includeDay = true) {
        if (!isoDate) return '-';
        const clean = String(isoDate).slice(0, 10);
        const parts = clean.split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return isoDate;
        const dt = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayStr = HARI_ID[dt.getDay()];
        const monthStr = BULAN_ID[dt.getMonth()];
        return includeDay
          ? `${dayStr}, ${parts[2]} ${monthStr} ${parts[0]}`
          : `${parts[2]} ${monthStr} ${parts[0]}`;
      }

      function formatTanggalSingkatIndo(isoDate, includeYear = false) {
        if (!isoDate) return '-';
        const clean = String(isoDate).slice(0, 10);
        const parts = clean.split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return isoDate;
        const monthShort = (BULAN_ID[parts[1] - 1] || '').slice(0, 3);
        return includeYear ? `${parts[2]} ${monthShort} ${parts[0]}` : `${parts[2]} ${monthShort}`;
      }

      function formatTanggalRangeIndo(startIso, endIso, includeDay = false, includeDaysCount = false) {
        if (!startIso) return '-';
        const sClean = String(startIso).slice(0, 10);
        const eClean = endIso && String(endIso).slice(0, 10) >= sClean ? String(endIso).slice(0, 10) : sClean;
        if (sClean === eClean) {
          return formatTanggalIndo(sClean, includeDay);
        }

        const [sy, sm, sd] = sClean.split('-').map(Number);
        const [ey, em, ed] = eClean.split('-').map(Number);
        const days = getBookingDayCount(sClean, eClean);
        const suffix = includeDaysCount ? ` (${days} hari)` : '';

        if (includeDay) {
          const sDay = HARI_ID[new Date(sy, sm - 1, sd).getDay()];
          const eDay = HARI_ID[new Date(ey, em - 1, ed).getDay()];
          if (sy === ey) {
            return `${sDay}, ${formatTanggalSingkatIndo(sClean, false)} – ${eDay}, ${formatTanggalSingkatIndo(eClean, true)}${suffix}`;
          }
          return `${sDay}, ${formatTanggalSingkatIndo(sClean, true)} – ${eDay}, ${formatTanggalSingkatIndo(eClean, true)}${suffix}`;
        }

        if (sy === ey && sm === em) {
          return `${sd} – ${ed} ${BULAN_ID[sm - 1]} ${sy}${suffix}`;
        }
        if (sy === ey) {
          return `${sd} ${BULAN_ID[sm - 1].slice(0, 3)} – ${ed} ${BULAN_ID[em - 1].slice(0, 3)} ${sy}${suffix}`;
        }
        return `${formatTanggalSingkatIndo(sClean, true)} – ${formatTanggalSingkatIndo(eClean, true)}${suffix}`;
      }

      function renderMultiDayBadge(startIso, endIso) {
        const days = getBookingDayCount(startIso, endIso);
        if (days <= 1) return '';

      function formatBulanIndo(ym) {
        if (!ym || ym === 'ALL') return 'Semua Periode';
        const [y, m] = ym.split('-').map(Number);
        if (!y || !m) return ym;
        return `${BULAN_ID[m - 1]} ${y}`;
      }

      function formatTanggalWaktuIndo(stamp) {
        if (!stamp) return '-';
        const match = String(stamp).match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);
        if (!match) return stamp;
        return `${formatTanggalIndo(match[1], false)}, ${match[2]}`;
      }

      function formatRelativeDateLabel(isoDate) {
        const diff = diffDaysFromToday(isoDate);
        if (diff === 0) return 'Hari ini';
        if (diff === 1) return 'Besok';
        if (diff === 2) return 'Lusa';
        if (diff === -1) return 'Kemarin';
        if (diff > 2) return `${diff} hari lagi`;
        return `${Math.abs(diff)} hari lalu`;
      }

      function formatNowWibStamp() {
        const d = getNowWIB();
        const iso = getTodayWibISO();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');

      function formatNowClockWIB() {
        const d = getNowWIB();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss} WIB`;

      function formatRupiah(amount) {
        const n = Math.round(Number(amount) || 0);
        return 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }

      function formatKM(km) {
        const n = Math.round(Number(km) || 0);
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' km';
      }

      function formatNumberID(num) {
        const n = Math.round(Number(num) || 0);
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function generateId(prefix) {
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      }

      function getInitials(name) {
        if (!name) return 'BI';
        const parts = name.trim().split(/\s+/);
        return ((parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '')).toUpperCase();
      }

      function isTimeOverlap(startA, endA, startB, endB) {
        if (!startA || !endA || !startB || !endB) return false;
        return String(startA) < String(endB) && String(startB) < String(endA);
      }

      function isDateTimeRangeOverlap(startDateA, endDateA, startTimeA, endTimeA, startDateB, endDateB, startTimeB, endTimeB) {
        if (!startDateA || !startDateB || !startTimeA || !endTimeA || !startTimeB || !endTimeB) return false;
        const aEndDate = endDateA && endDateA >= startDateA ? endDateA : startDateA;
        const bEndDate = endDateB && endDateB >= startDateB ? endDateB : startDateB;
        const aStart = `${startDateA}T${startTimeA}`;
        const aEnd = `${aEndDate}T${endTimeA}`;
        const bStart = `${startDateB}T${startTimeB}`;
        const bEnd = `${bEndDate}T${endTimeB}`;
        return aStart < bEnd && bStart < aEnd;
      }

      function calcDurationLabel(startHHMM, endHHMM, startIso = '', endIso = '') {
        if (!startHHMM || !endHHMM) return '';
        const [sh, sm] = startHHMM.split(':').map(Number);
        const [eh, em] = endHHMM.split(':').map(Number);
        const effEnd = endIso || startIso;
        if (startIso && effEnd && effEnd < startIso) return 'Tanggal kembali harus ≥ berangkat';

        const dayDiff = startIso && effEnd ? diffDaysISO(startIso, effEnd) : 0;
        const diffMin = dayDiff * 1440 + (eh * 60 + em) - (sh * 60 + sm);
        if (diffMin <= 0) return dayDiff === 0 ? 'Jam kembali harus lebih besar' : 'Waktu kembali tidak valid';

        const totalHours = Math.floor(diffMin / 60);
        const remMin = diffMin % 60;
        if (dayDiff > 0) {
          const dayCount = dayDiff + 1;
          const timePart = remMin > 0 ? `${totalHours} jam ${remMin} mnt` : `${totalHours} jam`;
          return `${dayCount} hari (${timePart})`;
        }
        return totalHours > 0 && remMin > 0 ? `${totalHours} jam ${remMin} menit` : totalHours > 0 ? `${totalHours} jam` : `${remMin} menit`;
      }

          ctx.font = '12px monospace';
          ctx.fillText('Arsip Digital Fungsi Logistik & Pengelolaan Aset', canvas.width / 2, canvas.height - 38);

          return canvas.toDataURL('image/jpeg', 0.72);

      /**
       * Kompresi gambar bukti struk di sisi klien (HTML5 Canvas)
       * secara iteratif hingga <= 150 KB.
       */
      function compressReceiptImage(file, maxKB = 150) {
        return new Promise((resolve, reject) => {
          const originalKB = Math.max(1, Math.round(file.size / 1024));
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
          reader.onload = (ev) => {
            const img = new Image();
            img.onerror = () => reject(new Error('Format gambar tidak didukung.'));
            img.onload = () => {
              let maxDim = 1280;
              let quality = 0.82;
              let dataUrl = '';
              let compressedKB = originalKB;

              for (let attempt = 0; attempt < 10; attempt++) {
                const ratio = Math.min(1, maxDim / Math.max(img.width, img.height));
                const w = Math.max(1, Math.round(img.width * ratio));
                const h = Math.max(1, Math.round(img.height * ratio));

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);

                dataUrl = canvas.toDataURL('image/jpeg', quality);
                // Estimasi ukuran byte aktual dari string Base64
                const base64Body = dataUrl.split(',')[1] || '';
                compressedKB = Math.max(1, Math.round((base64Body.length * 3) / 4 / 1024));

                if (compressedKB <= maxKB) break;

                if (quality > 0.4) {
                  quality -= 0.12;
                } else {
                  maxDim = Math.round(maxDim * 0.78);
                  quality = 0.65;
                }
              }

              resolve({
                dataUrl,
                originalKB,
                compressedKB
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function ensureDriverPins(stateObj) {
        if (!stateObj || !Array.isArray(stateObj.drivers)) return false;
        let changed = false;
        stateObj.drivers.forEach((d, idx) => {
          const clean = d && d.pin !== undefined && d.pin !== null ? String(d.pin).trim().replace(/\D/g, '') : '';
          if (!/^\d{4,6}$/.test(clean)) {
            d.pin = getDefaultDriverPin(d.id, idx);
            changed = true;
          } else if (d.pin !== clean) {
            d.pin = clean;
            changed = true;
          }
        });
        return changed;

        playChime() {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            if (ctx.state === 'suspended' && typeof ctx.resume === 'function') {
              ctx.resume().catch(() => {});
            }
            const now = ctx.currentTime;
            // Suara notifikasi 2-nada singkat & jernih (A5 -> D6, tanpa file audio eksternal)
            const tones = [
              { freq: 880, start: now, dur: 0.15 },
              { freq: 1174.66, start: now + 0.17, dur: 0.24 }
            ];
            tones.forEach(({ freq, start, dur }) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, start);
              gain.gain.setValueAtTime(0.001, start);
              gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(start);
              osc.stop(start + dur + 0.02);
            });
            setTimeout(() => {
              try { ctx.close(); } catch (_) {}
            }, 700);
          } catch (_) {}
        },

        triggerVibrate() {
          try {
            if (typeof navigator !== 'undefined') {
              navigator.vibrate?.([250, 100, 250]);
            }
          } catch (_) {}

          this.playChime();

        config: null,
        syncLogs: [],
        isPulling: false,
        pendingWrites: 0,
        mutationVersion: 0,

        _pendingSilentRender: false,

        lastSyncClock: '',
        lastPullTimestamp: 0,
        _lastRepairMap: {},
        knownBookingIds: new Set(),
        hasInitializedKnownBookings: false,

        computeDataSignature(data, adminList) {
          try {
            return JSON.stringify({
              vehicles: data?.vehicles || [],
              drivers: data?.drivers || [],
              bookings: data?.bookings || [],
              expenses: data?.expenses || [],
              services: data?.services || [],
              admins: adminList || []
            });
          } catch (_) {
            return String(Date.now());
          }
        },

        isUserEditingMainForm() {
          try {
            if (AppState.role === 'pegawai' && AppState.activeNav === 'pinjam' && AppState.bookingForm.unitDropdownOpen) {
              return true;
            }
            const activeEl = document.activeElement;
            if (!activeEl) return false;
            const tag = String(activeEl.tagName || '').toUpperCase();
            if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
            const mainEl = document.getElementById('main-content');
            return Boolean(mainEl && typeof mainEl.contains === 'function' && mainEl.contains(activeEl));
          } catch (_) {
            return false;
          }
        },

        updateDriverLiveSyncBadge() {
          const timeEl = document.getElementById('driver-live-sync-time');
          if (timeEl) {
            timeEl.textContent = this.lastSyncClock ? `· ${this.lastSyncClock}` : '· Aktif';
          }
        },

        init() {
          this.config = this.loadConfig();
          this.syncLogs = this.loadSyncLogs();

          // BroadcastChannel API untuk sinkronisasi real-time antar-tab browser (< 50ms)
          if (typeof BroadcastChannel !== 'undefined') {
            this.channel = new BroadcastChannel(BROADCAST_CHANNEL_NAME);
            this.channel.onmessage = (event) => {
              const msg = event.data;
              if (!msg || msg.senderId === AppState.tabId) return;
              this.handleIncomingSync(msg);
            };
          }

          // Fallback listener localStorage untuk browser/konteks tertentu
          window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEYS.STATE && e.newValue) {
              if (this.pendingWrites > 0 || (this.lastWriteCompletedAt > 0 && (Date.now() - this.lastWriteCompletedAt) < 3500)) return;
              try {
                const parsed = JSON.parse(e.newValue);
                if (parsed && parsed.updated_at !== AppState.data.updated_at) {
                  sanitizeStateData(parsed);
                  AppState.data = parsed;
                  renderAll();
                }
              } catch (_) {}
            }
          });

          // Jika kredensial Firebase diisi, aktifkan Firestore real-time listener
          if (this.hasFirebaseConfig()) {
            this.initFirebaseRealtime();
          }

          // Jika URL Google Apps Script sudah aktif, tarik data terbaru di latar belakang secara senyap
          if (this.hasGasUrl()) {
            this.pullFromGAS(true);
          } else {
            // Mode lokal tanpa GAS: inisialisasi daftar booking yang sudah dikenal
            (AppState.data.bookings || []).forEach((b) => {
              if (b && b.id) this.knownBookingIds.add(b.id);
            });
            this.hasInitializedKnownBookings = true;
          }

          // Smart Polling setiap 6 detik (hemat kuota & baterai: hanya jalan saat layar/tab terlihat)
          if (this.pollTimerId) clearInterval(this.pollTimerId);
          this.pollTimerId = setInterval(() => {
            if (this.hasGasUrl() && document.visibilityState === 'visible') {
              this.pullFromGAS(true);
            }
          }, 6000);

          // Auto-sync seketika saat layar HP dibuka atau tab kembali aktif
          if (!this._lifecycleBound) {
            this._lifecycleBound = true;
            const triggerResumeSync = () => {
              if (document.visibilityState === 'visible' && this.hasGasUrl()) {
                if (Date.now() - this.lastPullTimestamp < 1000) return;
                this.pullFromGAS(true);
              }
            };
            document.addEventListener('visibilitychange', triggerResumeSync);
            window.addEventListener('focus', triggerResumeSync);
            document.addEventListener('focusout', () => {
              if (this._pendingSilentRender) {
                setTimeout(() => {
                  if (this._pendingSilentRender && !this.isUserEditingMainForm()) {
                    this._pendingSilentRender = false;
                    renderAll();
                  }
                }, 120);
              }
            });
          }
        },

        loadConfig() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.CONFIG);
            if (raw) {
              const saved = JSON.parse(raw);
              const savedGas = typeof saved.GOOGLE_APPS_SCRIPT_URL === 'string' ? saved.GOOGLE_APPS_SCRIPT_URL.trim() : '';
              return {
                GOOGLE_APPS_SCRIPT_URL: savedGas || DEFAULT_INTEGRATION_CONFIG.GOOGLE_APPS_SCRIPT_URL,
                FIREBASE_CONFIG: Object.assign({}, DEFAULT_INTEGRATION_CONFIG.FIREBASE_CONFIG, saved.FIREBASE_CONFIG || {})
              };
            }
          } catch (_) {}
          return JSON.parse(JSON.stringify(DEFAULT_INTEGRATION_CONFIG));
        },

        saveConfig(newCfg) {
          this.config = newCfg;
          localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(newCfg));
          if (this.hasFirebaseConfig() && !this.firebaseActive) {
            this.initFirebaseRealtime();
          }
          renderAll();
        },

        hasFirebaseConfig() {
          const fc = this.config && this.config.FIREBASE_CONFIG;
          return Boolean(fc && fc.apiKey && fc.projectId);
        },

        hasGasUrl() {
          return Boolean(this.config && this.config.GOOGLE_APPS_SCRIPT_URL && this.config.GOOGLE_APPS_SCRIPT_URL.trim().startsWith('http'));
        },

        getModeLabel() {
          if (this.firebaseActive && this.hasGasUrl()) return 'Cloud Real-Time (Firebase + Sheets)';
          if (this.firebaseActive) return 'Cloud Real-Time (Firebase)';
          if (this.hasGasUrl()) return 'Real-Time Lokal + Arsip Google Sheets';
          return 'Real-Time Lokal (Multi-Tab Sync)';
        },

        loadSyncLogs() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.SYNC_LOG);
            return raw ? JSON.parse(raw) : [];
          } catch (_) {
            return [];
          }
        },

        addSyncLog(entry) {
          this.syncLogs.unshift({
            time: formatNowClockWIB(),
            ...entry
          });
          if (this.syncLogs.length > 25) this.syncLogs.length = 25;
          try {
            localStorage.setItem(STORAGE_KEYS.SYNC_LOG, JSON.stringify(this.syncLogs));
          } catch (_) {}
        },

        persistAndBroadcast(eventType, meta = {}) {
          if (eventType !== 'SYNC_PULL') {
            this.mutationVersion++;
          }
          AppState.data.updated_at = Date.now();
          try {
            localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(AppState.data));
            localStorage.setItem(STORAGE_KEYS.ADMIN_LIST, JSON.stringify(AppState.adminList));
          } catch (err) {
            showToast('Peringatan Penyimpanan', 'Kapasitas localStorage hampir penuh. Disarankan sinkronkan ke Google Sheets.', 'warning');
          }

          if (this.channel) {
            this.channel.postMessage({
              senderId: AppState.tabId,
              eventType,
              meta,
              state: AppState.data,
              adminList: AppState.adminList
            });
          }

          // Jika Firebase aktif, tulis ke Firestore
          if (this.firebaseActive && this.firestoreDb) {
            this.pushToFirebase(eventType, meta);
          }
        },

        handleIncomingSync(msg) {
          if (msg.eventType === 'SYNC_PULL' && (this.pendingWrites > 0 || (this.lastWriteCompletedAt > 0 && (Date.now() - this.lastWriteCompletedAt) < 3500))) {
            return;
          }
          const activeDriverId = DriverAuth.getActiveDriverId();
          const newlyForDriver = [];

          if (msg.state) {
            AppState.data = msg.state;
            sanitizeStateData(AppState.data);
            if (this.hasInitializedKnownBookings) {
              (AppState.data.bookings || []).forEach((b) => {
                if (!b || !b.id) return;
                if (!this.knownBookingIds.has(b.id)) {
                  this.knownBookingIds.add(b.id);
                  if (
                    AppState.role === 'driver' &&
                    activeDriverId &&
                    b.driver_id === activeDriverId &&
                    isBookingBlockingSchedule(b)
                  ) {
                    newlyForDriver.push(b);
                  }
                }
              });
            }
          }
          if (Array.isArray(msg.adminList)) {
            AdminAuth.saveAdminList(msg.adminList);
          }
          renderAll();

          if (newlyForDriver.length > 0) {
            DriverAlertManager.notifyNewBookings(newlyForDriver);
          }

          if (msg.eventType === 'CREATE_BOOKING') {
            showToast('Sinkronisasi Real-Time', `Peminjaman baru ${msg.meta?.kode_booking || ''} telah masuk.`, 'info');
          } else if (msg.eventType === 'UPDATE_BOOKING') {
            showToast('Jadwal Diperbarui', `Peminjaman ${msg.meta?.kode_booking || ''} telah diperbarui oleh Admin.`, 'info');
          } else if (msg.eventType === 'START_TRIP') {
            showToast('Status Armada Diperbarui', `Kendaraan ${msg.meta?.plat_nomor || ''} mulai beroperasi (Sedang Dinas).`, 'info');
          } else if (msg.eventType === 'COMPLETE_TRIP') {
            showToast('Perjalanan Selesai', `Tugas ${msg.meta?.kode_booking || ''} selesai. Odometer & status diperbarui.`, 'success');
            // Trigger otomatis modal rating hanya jika perjalanan tersebut milik akun Pegawai yang sedang login
            if (AppState.role === 'pegawai' && msg.meta?.booking_id) {
              const completedBkg = getBookingById(msg.meta.booking_id);
              if (completedBkg && isBookingOwnedByCurrentSession(completedBkg)) {
                setTimeout(() => openRatingModal(msg.meta.booking_id), 350);
              }
            }
          } else if (msg.eventType === 'SUBMIT_RATING') {
            showToast('Rating Pengemudi Masuk', `Penilaian bintang ${msg.meta?.rating || 5}★ telah diperbarui secara live.`, 'success');
          } else if (msg.eventType === 'ADD_EXPENSE') {
            showToast('Catatan Biaya Masuk', `Transaksi ${msg.meta?.jenis_biaya || 'Biaya'} ${formatRupiah(msg.meta?.nominal || 0)} tercatat.`, 'info');
          } else if (msg.eventType === 'ADD_SERVICE') {
            showToast('Jadwal Service Diperbarui', `Perawatan armada ${msg.meta?.plat_nomor || ''} telah dicatat.`, 'success');
          }
        },

        /**
         * Background POST non-blocking ke Google Apps Script Web App (`Code.gs`).
         * Menggunakan `text/plain;charset=utf-8` agar terhindar dari preflight CORS block.
         */
        async postToGAS(action, payload) {
          if (!this.hasGasUrl()) {
            this.addSyncLog({
              target: 'Local Sync',
              action,
              status: 'OK (Mode Lokal)',
              detail: 'URL GAS belum diisi — tersimpan real-time di perangkat.'
            });
            return { skipped: true };
          }

          this.mutationVersion++;
          this.pendingWrites++;
          const url = this.config.GOOGLE_APPS_SCRIPT_URL.trim();
          try {
            const resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, payload }),
              cache: 'no-store'
            });
            const data = await resp.json();
            if (data.status === 'success') {
              this.addSyncLog({
                target: 'Google Sheets (GAS)',
                action,
                status: 'BERHASIL',
                detail: `Tersinkron pada ${data.timestamp || formatNowClockWIB()}`
              });
              return data;
            }
            throw new Error(data.message || 'Respon GAS error');
          } catch (err) {
            this.addSyncLog({
              target: 'Google Sheets (GAS)',
              action,
              status: 'GAGAL',
              detail: err.message || 'Koneksi GAS gagal'
            });
            return { error: err.message };
          } finally {
            this.pendingWrites = Math.max(0, this.pendingWrites - 1);
            this.lastWriteCompletedAt = Date.now();
          }
        },

        async postBookingsToGAS(bookings) {
          const list = Array.isArray(bookings) ? bookings : (bookings ? [bookings] : []);
          if (list.length === 0) return { skipped: true };
          if (list.length === 1) {
            return this.postToGAS('CREATE_BOOKING', list[0]);
          }
          const batchRes = await this.postToGAS('CREATE_BOOKINGS_BATCH', { bookings: list });
          if (batchRes && batchRes.error && /Action tidak dikenali/i.test(String(batchRes.error))) {
            // Kompatibilitas otomatis jika Code.gs versi sebelumnya belum di-deploy ulang
            const fallbackResults = [];
            for (const b of list) {
              fallbackResults.push(await this.postToGAS('CREATE_BOOKING', b));
            }
            return { status: 'success', fallback: true, results: fallbackResults };
          }
          return batchRes;
        },

        async testGasConnection() {
          if (!this.hasGasUrl()) {
            showToast('URL GAS Kosong', 'Masukkan URL Web App Google Apps Script terlebih dahulu.', 'warning');
            return null;
          }
          const url = this.config.GOOGLE_APPS_SCRIPT_URL.trim();
          const sep = url.includes('?') ? '&' : '?';
          try {
            const resp = await fetch(`${url}${sep}action=ping`);
            const json = await resp.json();
            if (json.status === 'success') {
              this.addSyncLog({
                target: 'Google Sheets (GAS)',
                action: 'PING',
                status: 'TERHUBUNG',
                detail: `Sheet: ${json.spreadsheetName || 'OK'}`
              });
              showToast('Koneksi GAS Berhasil', `Terhubung ke "${json.spreadsheetName || 'Spreadsheet DALMUDI'}".`, 'success');
              return json;
            }
            throw new Error(json.message || 'Respon tidak valid');
          } catch (err) {
            this.addSyncLog({
              target: 'Google Sheets (GAS)',
              action: 'PING',
              status: 'GAGAL',
              detail: err.message
            });
            showToast('Koneksi GAS Gagal', 'Pastikan deployment Web App diset "Who has access: Anyone".', 'error');
            return null;
          }
        },

        async pullFromGAS(silent = false) {
          if (this.isPulling) return;
          // Jangan menimpa aksi tulis yang sedang berjalan / baru selesai dikirim ke Google Sheets
          if (silent && (this.pendingWrites > 0 || (this.lastWriteCompletedAt > 0 && (Date.now() - this.lastWriteCompletedAt) < 3500))) {
            return;
          }
          if (!this.hasGasUrl()) {
            if (!silent) showToast('URL GAS Kosong', 'Isi URL Web App GAS untuk menarik data dari Google Sheets.', 'warning');
            return;
          }
          this.isPulling = true;
          this.lastPullTimestamp = Date.now();
          const pullStartMutationVersion = this.mutationVersion;
          const url = this.config.GOOGLE_APPS_SCRIPT_URL.trim();
          const sep = url.includes('?') ? '&' : '?';
          try {
            if (!silent) showToast('Sinkronisasi', 'Mengambil data terbaru dari Google Sheets...', 'info');
            const resp = await fetch(`${url}${sep}action=getAll&t=${Date.now()}`, { cache: 'no-store' });
            const json = await resp.json();
            // Jika ada aksi lokal (mis. Mulai/Selesaikan Perjalanan) saat GET sedang in-flight,
            // abaikan snapshot lama ini agar tombol & status UI tidak mental kembali ke status lama!
            if (this.pendingWrites > 0 || this.mutationVersion !== pullStartMutationVersion) {
              return;
            }
            if (json.status === 'success' && json.data) {
              // Simpan daftar ID booking & sidik jari state sebelum AppState.data diperbarui
              const prevSignature = this.computeDataSignature(AppState.data, AppState.adminList);
              if (!this.hasInitializedKnownBookings) {
                (AppState.data.bookings || []).forEach((b) => {
                  if (b && b.id) this.knownBookingIds.add(b.id);
                });
              }

              let pulledSomething = false;
              let repairedFromPull = { healedVehicles: [], healedDrivers: [] };
              const hasCoreData = (Array.isArray(json.data.vehicles) && json.data.vehicles.length > 0) ||
                                  (Array.isArray(json.data.drivers) && json.data.drivers.length > 0) ||
                                  (Array.isArray(json.data.bookings) && json.data.bookings.length > 0);
              if (hasCoreData) {
                AppState.data = {
                  version: 1,
                  updated_at: Date.now(),
                  vehicles: Array.isArray(json.data.vehicles) && json.data.vehicles.length > 0 ? json.data.vehicles : AppState.data.vehicles,
                  drivers: Array.isArray(json.data.drivers) && json.data.drivers.length > 0 ? json.data.drivers : AppState.data.drivers,
                  bookings: Array.isArray(json.data.bookings) ? json.data.bookings : [],
                  expenses: Array.isArray(json.data.expenses) ? json.data.expenses : [],
                  services: Array.isArray(json.data.services) ? json.data.services : []
                };
                migrateLegacyDriversIfNeeded(AppState.data);
                repairedFromPull = reconcileAllStateStatuses(AppState.data);
                sanitizeStateData(AppState.data);
                pulledSomething = true;
              }
              if (Array.isArray(json.data.admins) && json.data.admins.length > 0) {
                AdminAuth.saveAdminList(json.data.admins);
                pulledSomething = true;
              }

              // Detektor Booking Baru Khusus Driver (activeDriverId)
              const activeDriverId = DriverAuth.getActiveDriverId();
              const newlyDetectedForDriver = [];

              if (!this.hasInitializedKnownBookings) {
                // Sync pertama selesai: catat seluruh booking lama agar tidak memicu notifikasi palsu saat baru buka aplikasi
                (AppState.data.bookings || []).forEach((b) => {
                  if (b && b.id) this.knownBookingIds.add(b.id);
                });
                this.hasInitializedKnownBookings = true;
              } else {
                (AppState.data.bookings || []).forEach((b) => {
                  if (!b || !b.id) return;
                  if (!this.knownBookingIds.has(b.id)) {
                    this.knownBookingIds.add(b.id);
                    if (
                      AppState.role === 'driver' &&
                      activeDriverId &&
                      b.driver_id === activeDriverId &&
                      isBookingBlockingSchedule(b)
                    ) {
                      newlyDetectedForDriver.push(b);
                    }
                  }
                });
              }

              // Perbarui jam sync terakhir pada indikator Live Sync Driver tanpa mengganggu DOM
              this.lastSyncClock = formatNowClockWIB();
              this.updateDriverLiveSyncBadge();

              const nextSignature = this.computeDataSignature(AppState.data, AppState.adminList);
              const dataChanged = nextSignature !== prevSignature;

              if (pulledSomething) {
                if (!silent || dataChanged || !this._hasLoggedFirstAutoPull) {
                  this._hasLoggedFirstAutoPull = true;
                  this.addSyncLog({
                    target: 'Google Sheets (GAS)',
                    action: silent ? 'AUTO_PULL' : 'PULL',
                    status: 'BERHASIL',
                    detail: `Data terbaru dimuat (${AppState.data.vehicles.length} armada, ${AppState.adminList.length} admin)`
                  });
                }

                if (dataChanged || !silent) {
                  this.persistAndBroadcast('SYNC_PULL', {});
                  if (silent && this.isUserEditingMainForm()) {
                    // Tunda render penuh agar input pegawai / form aktif tidak terganggu saat mengetik
                    this._pendingSilentRender = true;
                  } else {
                    this._pendingSilentRender = false;
                    renderAll();
                  }
                }
                if (!silent) showToast('Data Ditarik', 'Seluruh data Google Sheets (termasuk Master_Admin) berhasil dimuat.', 'success');
              } else if (!silent) {
                showToast('Sheet Masih Kosong', 'Klik "Dorong Semua ke Sheets" untuk mengunggah data awal ke Spreadsheet.', 'warning');
              }

              if (newlyDetectedForDriver.length > 0) {
                DriverAlertManager.notifyNewBookings(newlyDetectedForDriver);
              }

              // Self-healing write-back: jika Google Sheets memiliki status ON_TRIP/ON_DUTY yatim (tanpa booking aktif),
              // otomatis perbaiki baris armada/driver tersebut di Google Sheets agar konsisten di seluruh perangkat.
              if (repairedFromPull.healedVehicles.length > 0 || repairedFromPull.healedDrivers.length > 0) {
                this.repairDriftedStatusesInGAS(repairedFromPull.healedVehicles, repairedFromPull.healedDrivers);
              }
            } else {
              throw new Error(json.message || 'Gagal membaca data');
            }
          } catch (err) {
            if (!silent) showToast('Gagal Menarik Data', err.message, 'error');
          } finally {
            this.isPulling = false;
          }
        },

        repairDriftedStatusesInGAS(healedVehicles = [], healedDrivers = []) {
          if (!this.hasGasUrl()) return;
          const now = Date.now();
          const COOLDOWN_MS = 15000;
          const repairedLabels = [];

          healedVehicles.forEach((v) => {
            if (!v || !v.id) return;
            const key = `veh:${v.id}:${v.status}`;
            if (now - (this._lastRepairMap[key] || 0) < COOLDOWN_MS) return;
            this._lastRepairMap[key] = now;
            repairedLabels.push(`${v.plat_nomor || v.id}→${v.status}`);
            this.postToGAS('UPSERT_VEHICLE', v);
          });

          healedDrivers.forEach((d) => {
            if (!d || !d.id) return;
            const key = `drv:${d.id}:${d.status}`;
            if (now - (this._lastRepairMap[key] || 0) < COOLDOWN_MS) return;
            this._lastRepairMap[key] = now;
            repairedLabels.push(`${d.nama || d.id}→${d.status}`);
            this.postToGAS('UPSERT_DRIVER', d);
          });

          if (repairedLabels.length > 0) {
            this.addSyncLog({
              target: 'Auto-Repair Status',
              action: 'RECONCILE',
              status: 'DIPERBAIKI',
              detail: `Status tidak sinkron dipulihkan: ${repairedLabels.join(', ')}`
            });
          }
        },

        async pushAllToGAS() {
          if (!this.hasGasUrl()) {
            showToast('URL GAS Kosong', 'Isi URL Web App GAS terlebih dahulu.', 'warning');
            return;
          }
          showToast('Menyinkronkan', 'Mengirim seluruh tabel (termasuk Master_Admin) ke Google Sheets...', 'info');
          const res = await this.postToGAS('SYNC_ALL', {
            vehicles: AppState.data.vehicles,
            drivers: AppState.data.drivers,
            bookings: AppState.data.bookings,
            expenses: AppState.data.expenses,
            services: AppState.data.services,
            admins: AppState.adminList
          });
          if (res && res.status === 'success') {
            showToast('Sinkronisasi Selesai', 'Seluruh data (termasuk Daftar Admin) berhasil diarsipkan ke Google Sheets & Drive.', 'success');
          } else {
            showToast('Sinkronisasi Gagal', res?.error || 'Periksa izin akses Web App GAS Anda.', 'error');
          }
          renderAll();
        },

        /**
         * Dynamic loader opsional untuk Firebase Firestore (Real-Time onSnapshot)
         * Hanya dimuat jika FIREBASE_CONFIG telah diisi pengguna.
         */
        initFirebaseRealtime() {
          const loadScript = (src) => new Promise((res, rej) => {
            if (document.querySelector(`script[src="${src}"]`)) return res();
            const s = document.createElement('script');
            s.src = src;
            s.onload = res;
            s.onerror = rej;
            document.head.appendChild(s);
          });

          Promise.all([
            loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js'),
            loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js')
          ]).then(() => {
            if (!window.firebase) return;
            const app = window.firebase.apps.length
              ? window.firebase.app()
              : window.firebase.initializeApp(this.config.FIREBASE_CONFIG);
            const db = app.firestore();
            this.firestoreDb = db;
            this.firebaseActive = true;

            const collections = ['vehicles', 'drivers', 'bookings', 'expenses', 'services'];
            collections.forEach((colName) => {
              db.collection(colName).onSnapshot((snap) => {
                if (snap.empty) return;
                const items = [];
                snap.forEach((doc) => items.push(Object.assign({ id: doc.id }, doc.data())));
                AppState.data[colName] = items;
                localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(AppState.data));
                renderAll();
              }, (err) => {
                this.addSyncLog({ target: 'Firebase', action: `onSnapshot(${colName})`, status: 'ERROR', detail: err.message });
              });
            });

            this.addSyncLog({ target: 'Firebase', action: 'CONNECT', status: 'TERHUBUNG', detail: `Project: ${this.config.FIREBASE_CONFIG.projectId}` });
            renderAll();
          }).catch((err) => {
            this.addSyncLog({ target: 'Firebase', action: 'LOAD_SDK', status: 'GAGAL', detail: err.message || 'Gagal memuat SDK Firebase' });
          });
        },

        pushToFirebase(eventType, meta) {
          if (!this.firestoreDb) return;
          try {
            const batch = this.firestoreDb.batch();
            ['vehicles', 'drivers', 'bookings', 'expenses', 'services'].forEach((col) => {
              (AppState.data[col] || []).forEach((item) => {
                if (item && item.id) {
                  batch.set(this.firestoreDb.collection(col).doc(String(item.id)), item, { merge: true });
                }
              });
            });
            batch.commit().catch(() => {});
          } catch (_) {}
        }
      };

      /* ======================================================================
       * 6. APPLICATION STATE & DOMAIN HELPERS
       * ====================================================================== */
      /** Sanitizer Parameter Data Menyeluruh (Mencegah bug 1899-12-30 dari Sheets, NaN, PIN & tanggal rusak) */
      function sanitizeIsoDate(val, fallback) {
        const s = String(val || '').trim();
        const m = s.match(/(\d{4}-\d{2}-\d{2})/);
        if (m && m[1] !== '1899-12-30') return m[1];
        return fallback || getTodayWibISO();
      }

      function sanitizeTimeHHMM(val, fallback = '08:00') {
        const s = String(val || '').trim();
        // Tangkap format HH:mm atau H:mm:ss atau ISO timestamp (mis. 1899-12-30T09:00:00)
        const isoTimeMatch = s.match(/T(\d{2}):(\d{2})/);
        if (isoTimeMatch) {
          const hh = Math.min(23, Math.max(0, Number(isoTimeMatch[1])));
          const mm = Math.min(59, Math.max(0, Number(isoTimeMatch[2])));
          return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
        }
        const plainMatch = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
        if (plainMatch) {
          const hh = Math.min(23, Math.max(0, Number(plainMatch[1])));
          const mm = Math.min(59, Math.max(0, Number(plainMatch[2])));
          return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
        }
        // Fallback aman jika terlanjur terkonversi Google Sheets lama menjadi "1899-12-30"
        return fallback;
      }

      function generateNextBookingCode(isoDate) {
        const ym = sanitizeIsoDate(isoDate, getTodayWibISO()).slice(0, 7).replace('-', '');
        const prefix = `BI-JTG-${ym}-`;
        let maxSeq = 0;
        (AppState.data.bookings || []).forEach((b) => {
          const code = String(b?.kode_booking || '');
          if (code.startsWith(prefix)) {
            const num = parseInt(code.slice(prefix.length), 10);
            if (!isNaN(num) && num > maxSeq) maxSeq = num;
          }
        });
        return `${prefix}${String(maxSeq + 1).padStart(3, '0')}`;
      }

      /**
       * Rekonsiliasi Otomatis Status Armada & Pengemudi (Single Source of Truth = Booking_Kendaraan).
       * Mencegah status armada terjebak di ON_TRIP ("Sedang Dinas") atau pengemudi terjebak di ON_DUTY
       * padahal tidak ada jadwal ON_TRIP yang sedang berlangsung (mis. akibat hapus manual di Sheets atau putus jaringan).
       * Status manual bengkel (MAINTENANCE) dan driver libur (OFF) selalu dipertahankan.
       */
      function reconcileAllStateStatuses(stateObj) {
        const result = { changed: false, healedVehicles: [], healedDrivers: [] };
        if (!stateObj || typeof stateObj !== 'object') return result;

        const bookings = Array.isArray(stateObj.bookings) ? stateObj.bookings : [];
        const onTripVehicleIds = new Set();
        const onTripDriverIds = new Set();

        bookings.forEach((b) => {
          if (b && b.status === 'ON_TRIP') {
            if (b.vehicle_id) onTripVehicleIds.add(String(b.vehicle_id));
            if (b.driver_id) onTripDriverIds.add(String(b.driver_id));
          }
        });

        (Array.isArray(stateObj.vehicles) ? stateObj.vehicles : []).forEach((v) => {
          if (!v || v.status === 'MAINTENANCE') return;
          const expected = onTripVehicleIds.has(String(v.id)) ? 'ON_TRIP' : 'READY';
          if (v.status !== expected) {
            v.status = expected;
            result.changed = true;
            result.healedVehicles.push(v);
          }
        });

        (Array.isArray(stateObj.drivers) ? stateObj.drivers : []).forEach((d) => {
          if (!d || d.status === 'OFF') return;
          const expected = onTripDriverIds.has(String(d.id)) ? 'ON_DUTY' : 'AVAILABLE';
          if (d.status !== expected) {
            d.status = expected;
            result.changed = true;
            result.healedDrivers.push(d);
          }
        });

        return result;
      }

      function sanitizeStateData(stateObj) {
        if (!stateObj || typeof stateObj !== 'object') return false;
        let changed = false;

        if (!Array.isArray(stateObj.vehicles)) { stateObj.vehicles = []; changed = true; }
        if (!Array.isArray(stateObj.drivers)) { stateObj.drivers = []; changed = true; }
        if (!Array.isArray(stateObj.bookings)) { stateObj.bookings = []; changed = true; }
        if (!Array.isArray(stateObj.expenses)) { stateObj.expenses = []; changed = true; }
        if (!Array.isArray(stateObj.services)) { stateObj.services = []; changed = true; }

        // 1. Sanitasi Master Armada
        stateObj.vehicles.forEach((v) => {
          if (!v) return;
          const cap = Number(v.kapasitas);
          if (!isFinite(cap) || cap <= 0) { v.kapasitas = 7; changed = true; }
          const odo = Number(v.odometer_saat_ini);
          if (!isFinite(odo) || odo < 0) { v.odometer_saat_ini = 0; changed = true; }
          const target = Number(v.target_km_service);
          if (!isFinite(target) || target <= 0) { v.target_km_service = Math.max(10000, v.odometer_saat_ini + 10000); changed = true; }
          const nextSrv = sanitizeIsoDate(v.tanggal_service_berikutnya, addMonthsISO(getTodayWibISO(), 6));
          if (v.tanggal_service_berikutnya !== nextSrv) { v.tanggal_service_berikutnya = nextSrv; changed = true; }
          const expClean = String(v.masa_berlaku_plat || '11·30').trim();
          if (v.masa_berlaku_plat !== expClean) { v.masa_berlaku_plat = expClean; changed = true; }
        });

        // 2. Sanitasi Master Driver & PIN
        if (ensureDriverPins(stateObj)) changed = true;
        stateObj.drivers.forEach((d) => {
          if (!d) return;
          const rating = Number(d.rating_rata_rata);
          if (!isFinite(rating) || rating <= 0 || rating > 5) { d.rating_rata_rata = 5.0; changed = true; }
          const trips = Number(d.total_trip);
          if (!isFinite(trips) || trips < 0) { d.total_trip = 0; changed = true; }
          const hp = String(d.no_hp || '').trim();
          if (d.no_hp !== hp) { d.no_hp = hp; changed = true; }
        });

        // 3. Sanitasi Booking (termasuk pemulihan jam_mulai / jam_selesai dari bug 1899-12-30 & alasan_batal)
        stateObj.bookings.forEach((b) => {
          if (!b) return;
          const start = sanitizeIsoDate(b.tanggal, getTodayWibISO());
          if (b.tanggal !== start) { b.tanggal = start; changed = true; }
          const rawEnd = b.tanggal_selesai ? sanitizeIsoDate(b.tanggal_selesai, start) : start;
          const end = rawEnd >= start ? rawEnd : start;
          if (b.tanggal_selesai !== end) { b.tanggal_selesai = end; changed = true; }

          const jm = sanitizeTimeHHMM(b.jam_mulai, '08:00');
          if (b.jam_mulai !== jm) { b.jam_mulai = jm; changed = true; }
          const jsDefault = end > start ? '17:00' : (jm >= '17:00' ? '20:00' : '17:00');
          const js = sanitizeTimeHHMM(b.jam_selesai, jsDefault);
          if (b.jam_selesai !== js) { b.jam_selesai = js; changed = true; }

          if (!Array.isArray(b.ulasan_tags)) {
            if (typeof b.ulasan_tags === 'string' && b.ulasan_tags) {
              try { b.ulasan_tags = JSON.parse(b.ulasan_tags); } catch (_) { b.ulasan_tags = []; }
            } else {
              b.ulasan_tags = [];
            }
            changed = true;
          }

          if (b.status === 'CANCELLED' && !b.alasan_batal && /^Dibatalkan:\s*/i.test(String(b.ulasan_catatan || ''))) {
            b.alasan_batal = String(b.ulasan_catatan).replace(/^Dibatalkan:\s*/i, '').trim();
            changed = true;
          }
        });

        // 4. Sanitasi Expenses & Services
        stateObj.expenses.forEach((e) => {
          if (!e) return;
          const nom = Number(e.nominal);
          if (!isFinite(nom) || nom < 0) { e.nominal = 0; changed = true; }
        });
        stateObj.services.forEach((s) => {
          if (!s) return;
          const srvDate = sanitizeIsoDate(s.tanggal_service, getTodayWibISO());
          if (s.tanggal_service !== srvDate) { s.tanggal_service = srvDate; changed = true; }
          const biaya = Number(s.biaya_service);
          if (!isFinite(biaya) || biaya < 0) { s.biaya_service = 0; changed = true; }
          const kmSrv = Number(s.km_service);
          if (!isFinite(kmSrv) || kmSrv < 0) { s.km_service = 0; changed = true; }
        });

        // 5. Rekonsiliasi Otomatis Status Armada & Pengemudi (Self-Healing Anti-Stuck ON_TRIP / ON_DUTY)
        if (reconcileAllStateStatuses(stateObj).changed) {
          changed = true;
        }

        return changed;
      }

      function loadInitialState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.STATE);
          if (raw) {
            const parsed = JSON.parse(raw);

              const drvChanged = migrateLegacyDriversIfNeeded(parsed);
              const sanChanged = sanitizeStateData(parsed);
              if (drvChanged || sanChanged) {
                try { localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(parsed)); } catch (_) {}
              }
              return parsed;
            }
          }
        } catch (_) {}
        const seeded = buildSeedState();
        try {
          localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(seeded));
        } catch (_) {}
        return seeded;
      }

        login(driverId, inputPin) {

          const entered = String(inputPin || '').trim();

          if (!/^\d{4,6}$/.test(entered)) {

          if (!expected || entered !== expected) {

      /** Engine Riwayat Login Cepat Sungguhan di localStorage (Khusus Pegawai & Driver — Tanpa Akun Demo & Tanpa Admin) */
      const LoginHistory = {

        load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.LOGIN_HISTORY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return parsed.filter((item) =>

              item.role !== 'admin' &&
              (item.nama || item.identifier) &&
              !AdminAuth.findAdminByIdentifier(item.identifier || item.nip || item.email || '')
            );

        save(list) {

            localStorage.setItem(STORAGE_KEYS.LOGIN_HISTORY, JSON.stringify((list || []).slice(0, this.MAX_ITEMS)));

        record(acc) {
          if (!acc || acc.role === 'admin') return;
          const ident = String(acc.identifier || acc.email || acc.nip || '').trim();
          if (!ident || AdminAuth.findAdminByIdentifier(ident)) return;

          const entry = {
            identifier: ident,
            nip: String(acc.nip || ident).trim(),
            email: String(acc.email || '').trim(),
            nama: String(acc.nama || '').trim(),

            role: acc.role === 'driver' ? 'driver' : 'pegawai',
            driver_id: acc.driver_id || null,
            lastLoginAt: Date.now()
          };

          const existing = this.load().filter((item) =>
            String(item.identifier || '').toLowerCase() !== ident.toLowerCase() &&
            String(item.nip || '').toLowerCase() !== entry.nip.toLowerCase()
          );
          existing.unshift(entry);
          this.save(existing);
        },

        removeAt(index) {
          const list = this.load();
          if (index < 0 || index >= list.length) return;
          list.splice(index, 1);

      // Mode default saat aplikasi pertama dibuka selalu role "Pegawai" tanpa auto-login

      function ROLE_NAVS_DEFAULT_NAV(role) {

      // Domain Helpers
      function getVehicleById(id) {
